# Stack dev persisten (bukan sekali-pakai) — MariaDB + migrasi + acsd.
# Port host sengaja dipilih tidak bentrok dengan instance MariaDB/app lain
# yang mungkin sudah jalan di mesin yang sama (3306/3307/8080 dsb).
services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ACS_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: acs
      MARIADB_USER: acs
      MARIADB_PASSWORD: ${ACS_DB_PASSWORD}
    volumes:
      - acs-mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306" # hanya host lokal; jangan expose DB ke jaringan
    healthcheck:
      # -h 127.0.0.1 (TCP) WAJIB: pada boot pertama volume kosong, entrypoint
      # menjalankan server SEMENTARA yang hanya melayani socket (skip-networking).
      # Ping lewat socket lolos terhadap server sementara itu -> compose mengira
      # MariaDB sudah sehat -> migrate konek TCP dan ditolak (connection refused)
      # tepat saat server sementara berhenti. Lewat TCP, healthy baru terjadi saat
      # server final sudah menerima koneksi jaringan.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      ACS_DB_DSN: acs:${ACS_DB_PASSWORD}@tcp(mariadb:3306)/acs?parseTime=true&loc=Local&charset=utf8mb4
      ACS_JWT_SECRET: ${ACS_JWT_SECRET}
      ACS_CREDENTIAL_ENC_KEY: ${ACS_CREDENTIAL_ENC_KEY}
      # cmd/migrate tidak memakai MinIO sama sekali, tapi config.Load() yang
      # dipakai bersama acsd mewajibkan var ini diisi (konsisten dengan
      # ACS_JWT_SECRET/ACS_CREDENTIAL_ENC_KEY di atas yang juga tidak dipakai
      # migrate tapi tetap wajib lewat validasi Load()).
      ACS_MINIO_ENDPOINT: "minio:9000"
      ACS_MINIO_ACCESS_KEY: ${ACS_MINIO_ACCESS_KEY}
      ACS_MINIO_SECRET_KEY: ${ACS_MINIO_SECRET_KEY}
    depends_on:
      mariadb:
        condition: service_healthy

  # Object storage firmware, S3-compatible (ROADMAP.md Fase 2 — keputusan
  # user: MinIO untuk dev). Presigned URL yang digenerate acsd dikirim
  # LANGSUNG ke CPE sebagai URL Download RPC CWMP (TECH.md §7) — di
  # deployment nyata (bukan compose dev ini), endpoint MinIO harus reachable
  # dari jaringan CPE fisik, bukan cuma dari ACS/dashboard.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ACS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ACS_MINIO_SECRET_KEY}
    volumes:
      - acs-minio-data:/data
    ports:
      - "19000:9000"
      - "127.0.0.1:19001:9001" # konsol MinIO hanya host lokal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password opsional (ACS_REDIS_PASSWORD); kosong = tanpa auth. Port hanya host lokal.
    command: ["redis-server", "--requirepass", "${ACS_REDIS_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${ACS_REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - acs-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  acsd:
    build: .
    restart: unless-stopped
    environment:
      ACS_DB_DSN: acs:${ACS_DB_PASSWORD}@tcp(mariadb:3306)/acs?parseTime=true&loc=Local&charset=utf8mb4
      ACS_HTTP_ADDR: ":8080"
      ACS_CWMP_ADDR: ":7547"
      ACS_JWT_SECRET: ${ACS_JWT_SECRET}
      ACS_CREDENTIAL_ENC_KEY: ${ACS_CREDENTIAL_ENC_KEY}
      ACS_MINIO_ENDPOINT: "minio:9000"
      ACS_MINIO_ACCESS_KEY: ${ACS_MINIO_ACCESS_KEY}
      ACS_MINIO_SECRET_KEY: ${ACS_MINIO_SECRET_KEY}
      ACS_MINIO_BUCKET: ${ACS_MINIO_BUCKET:-acs-firmware}
      ACS_MINIO_USE_SSL: "false"
      ACS_REDIS_ADDR: "redis:6379"
      ACS_REDIS_PASSWORD: ${ACS_REDIS_PASSWORD:-}
      # Reverse proxy/LB tepercaya (IP/CIDR, pisahkan koma). WAJIB diisi bila ACS di belakang
      # proxy agar IP klien benar; kosong = X-Forwarded-For diabaikan.
      ACS_TRUSTED_PROXIES: ${ACS_TRUSTED_PROXIES:-}
      # Rentang IP tepercaya untuk ConnectionRequestURL yang dilaporkan CPE walau BUKAN IP sumber Inform. Isi bila ACS di balik
      # NAT/port-forward (Docker Desktop: semua CPE terlihat 172.x) mis. 10.0.0.0/8. Kosong = ketat (host == IP sumber).
      ACS_CR_TRUSTED_CIDRS: ${ACS_CR_TRUSTED_CIDRS:-}
      # Pendaftaran tenant mandiri (bawaan mati; WAJIB ACS_SMTP_HOST untuk email verifikasi). Tenant baru mulai dengan
      # batas paket awal di bawah (0 = tak dibatasi); superadmin menaikkannya lewat PATCH /tenants/:id/device-limit.
      ACS_SELF_SIGNUP: ${ACS_SELF_SIGNUP:-false}
      ACS_SIGNUP_DAILY_CAP: ${ACS_SIGNUP_DAILY_CAP:-50}
      ACS_SIGNUP_MAX_DEVICES: ${ACS_SIGNUP_MAX_DEVICES:-25}
      ACS_SIGNUP_MAX_PENDING_TASKS: ${ACS_SIGNUP_MAX_PENDING_TASKS:-50}
      # Multi-instance (beberapa acsd + load balancer, berbagi MariaDB & Redis): rate limit terdistribusi,
      # fan-out WebSocket, kunci leader sweeper. Bawaan false (satu instance).
      ACS_HA: ${ACS_HA:-false}
      # SaaS publik: tolak target webhook di jaringan privat (RFC1918/ULA/CGNAT). Bawaan false (LAN diizinkan).
      ACS_WEBHOOK_BLOCK_PRIVATE: ${ACS_WEBHOOK_BLOCK_PRIVATE:-false}
      # Host yang boleh menjadi URL task Download/Upload buatan API (nama host, *.subdomain, IP, CIDR; pisahkan koma).
      # Kosong = tidak dibatasi. Unduhan dari katalog firmware/berkas ACS (presigned) tidak terkena.
      ACS_TRANSFER_ALLOWED_HOSTS: ${ACS_TRANSFER_ALLOWED_HOSTS:-}
      # Token Bearer penerima webhook Alertmanager (POST /api/v1/alertmanager-webhook), minimal 24 karakter acak. Kosong = endpoint tidak
      # dipasang (404). Service alertmanager memakai token yang sama dari .env.
      ACS_ALERTMANAGER_WEBHOOK_TOKEN: ${ACS_ALERTMANAGER_WEBHOOK_TOKEN:-}
      # OLT Controller: driver simulator (ONU palsu, tanpa koneksi jaringan) untuk pengembangan/e2e/demo. Bawaan MATI; jangan di produksi.
      ACS_OLT_SIM_ENABLED: ${ACS_OLT_SIM_ENABLED:-false}
      # Batas request/detik PER IP di REST API (Console/BSS). Login/MFA/reset/signup punya batas sendiri yang lebih ketat.
      ACS_REST_RATE_LIMIT: ${ACS_REST_RATE_LIMIT:-100}
      # Batas request/detik PER IP di endpoint CWMP (naikkan bila banyak CPE berbagi satu IP/CGNAT).
      ACS_CWMP_RATE_LIMIT: ${ACS_CWMP_RATE_LIMIT:-5}
      # Endpoint /usp (TR-369) masih kerangka tanpa auth: default mati.
      ACS_USP_ENABLED: ${ACS_USP_ENABLED:-false}
      # Retensi tabel log (hari); 0 = tanpa pemangkasan. activity_logs (audit) tidak dipangkas.
      ACS_LOG_RETENTION_DAYS: ${ACS_LOG_RETENTION_DAYS:-90}
      # Ukuran connection pool MariaDB. Bawaan 50/10/30mnt sama seperti sebelum
      # variabel ini ada; naikkan ACS_DB_MAX_OPEN_CONNS di produksi/HA bila load
      # test menunjukkan plateau throughput sebelum CPU acsd/MariaDB jenuh
      # (lihat docs/laporan/PROGRESS.md LANJUTAN 14).
      ACS_DB_MAX_OPEN_CONNS: ${ACS_DB_MAX_OPEN_CONNS:-50}
      ACS_DB_MAX_IDLE_CONNS: ${ACS_DB_MAX_IDLE_CONNS:-10}
      ACS_DB_CONN_MAX_LIFETIME_MINUTES: ${ACS_DB_CONN_MAX_LIFETIME_MINUTES:-30}
      # Masuk dengan Google / SSO OIDC (kosongkan ACS_OIDC_ISSUER untuk menonaktifkan; lihat RUNBOOK §R).
      # Google: ACS_OIDC_ISSUER=https://accounts.google.com. Secret hanya di .env, jangan di-commit.
      ACS_OIDC_ISSUER: ${ACS_OIDC_ISSUER:-}
      ACS_OIDC_CLIENT_ID: ${ACS_OIDC_CLIENT_ID:-}
      ACS_OIDC_CLIENT_SECRET: ${ACS_OIDC_CLIENT_SECRET:-}
      ACS_OIDC_REDIRECT_URL: ${ACS_OIDC_REDIRECT_URL:-http://localhost:18080/api/v1/auth/oidc/callback}
      ACS_OIDC_ALLOWED_DOMAINS: ${ACS_OIDC_ALLOWED_DOMAINS:-}
      # Ambang notifikasi proaktif (evaluator tiap 5 menit): rasio perangkat offline & jumlah task gagal dalam 30 menit.
      ACS_NOTIFY_OFFLINE_RATIO: ${ACS_NOTIFY_OFFLINE_RATIO:-0.30}
      ACS_NOTIFY_FAILED_TASKS: ${ACS_NOTIFY_FAILED_TASKS:-5}
      # Penerima email laporan bug dari Console (tombol bug di navbar). Kosongkan (ACS_BUG_REPORT_EMAIL=) untuk mematikan email; laporan tetap tersimpan.
      ACS_BUG_REPORT_EMAIL: ${ACS_BUG_REPORT_EMAIL-hfzrmd@gmail.com}
      # Langganan SaaS via Xendit (bawaan MATI). Aktifkan hanya dengan kunci dari dashboard Xendit; JANGAN commit nilainya.
      ACS_BILLING_ENABLED: ${ACS_BILLING_ENABLED:-false}
      ACS_XENDIT_SECRET_KEY: ${ACS_XENDIT_SECRET_KEY:-}
      ACS_XENDIT_CALLBACK_TOKEN: ${ACS_XENDIT_CALLBACK_TOKEN:-}
      ACS_XENDIT_BASE_URL: ${ACS_XENDIT_BASE_URL:-https://api.xendit.co}
      ACS_BILLING_INVOICE_HOURS: ${ACS_BILLING_INVOICE_HOURS:-24}
      # Interval polling redaman optik (menit); 0 = nonaktif. Hanya untuk vendor/model bermapping optical.*.
      ACS_OPTICAL_POLL_MINUTES: ${ACS_OPTICAL_POLL_MINUTES:-360}
      # Interval penyegaran username PPPoE (menit); 0 = nonaktif.
      ACS_PPPOE_POLL_MINUTES: ${ACS_PPPOE_POLL_MINUTES:-1440}
      # Email (reset password & notifikasi keamanan). Kosongkan ACS_SMTP_HOST
      # untuk menonaktifkan. Kredensial HANYA dari .env (tidak di-commit).
      ACS_SMTP_HOST: ${ACS_SMTP_HOST:-}
      ACS_SMTP_PORT: ${ACS_SMTP_PORT:-587}
      ACS_SMTP_USERNAME: ${ACS_SMTP_USERNAME:-}
      ACS_SMTP_PASSWORD: ${ACS_SMTP_PASSWORD:-}
      ACS_SMTP_FROM: ${ACS_SMTP_FROM:-}
      ACS_SMTP_FROM_NAME: ${ACS_SMTP_FROM_NAME:-ACS Console}
      ACS_PUBLIC_URL: ${ACS_PUBLIC_URL:-http://localhost:5173}
      # Origin Console web yang boleh memanggil REST (pisahkan dengan koma). Wajib diisi
      # bila Console dibuka dari komputer lain (mis. http://10.0.0.5:5173).
      ACS_CORS_ALLOW_ORIGINS: ${ACS_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ACS_PASSWORD_RESET_TTL: ${ACS_PASSWORD_RESET_TTL:-30m}
    # Image slim tanpa curl/wget: probe /readyz lewat /dev/tcp bash. Hanya DB yang kritis;
    # Redis down hanya dilaporkan (lihat internal/delivery/http/health_handler.go).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "18080:8080"
      - "17547:7547"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Observabilitas Lanjutan: Prometheus + Alertmanager + Grafana
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
      - acs-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - acsd

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    # Token Bearer webhook ke acsd diambil dari .env (ACS_ALERTMANAGER_WEBHOOK_TOKEN) dan ditulis ke berkas sementara di dalam container
    # sebelum Alertmanager start, supaya tidak ada rahasia di deploy/alertmanager/config.yml yang ikut repo. Image berbasis busybox (ada
    # /bin/sh); entrypoint bawaan /bin/alertmanager dipanggil lewat exec dengan argumen bawaan image.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'printf "%s" "$$ACS_ALERTMANAGER_WEBHOOK_TOKEN" > /tmp/acs-webhook-token && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager'
    environment:
      ACS_ALERTMANAGER_WEBHOOK_TOKEN: ${ACS_ALERTMANAGER_WEBHOOK_TOKEN:-}
    volumes:
      - ./deploy/alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:19093:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - acs-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus

volumes:
  acs-mariadb-data:
  acs-prometheus-data:
  acs-grafana-data:
  acs-minio-data:
  acs-redis-data:

