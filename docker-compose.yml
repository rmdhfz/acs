# Stack dev persisten (bukan sekali-pakai) — MariaDB + migrasi + acsd.
# Port host sengaja dipilih tidak bentrok dengan instance MariaDB/app lain
# yang mungkin sudah jalan di mesin yang sama (3306/3307/8080 dsb).
services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ACS_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: acs
      MARIADB_USER: acs
      MARIADB_PASSWORD: ${ACS_DB_PASSWORD}
    volumes:
      - acs-mariadb-data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      ACS_DB_DSN: acs:${ACS_DB_PASSWORD}@tcp(mariadb:3306)/acs?parseTime=true&loc=Local&charset=utf8mb4
      ACS_JWT_SECRET: ${ACS_JWT_SECRET}
      ACS_CREDENTIAL_ENC_KEY: ${ACS_CREDENTIAL_ENC_KEY}
    depends_on:
      mariadb:
        condition: service_healthy

  acsd:
    build: .
    restart: unless-stopped
    environment:
      ACS_DB_DSN: acs:${ACS_DB_PASSWORD}@tcp(mariadb:3306)/acs?parseTime=true&loc=Local&charset=utf8mb4
      ACS_HTTP_ADDR: ":8080"
      ACS_CWMP_ADDR: ":7547"
      ACS_JWT_SECRET: ${ACS_JWT_SECRET}
      ACS_CREDENTIAL_ENC_KEY: ${ACS_CREDENTIAL_ENC_KEY}
    ports:
      - "18080:8080"
      - "17547:7547"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  acs-mariadb-data:
