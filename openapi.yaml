  /devices/{id}/capture:
    get:
      operationId: getDeviceCapture
      tags: [Devices]
      summary: Status capture sesi CWMP perangkat
      description: "ADMIN/SUPERADMIN, dibatasi ke perangkat tenant sendiri. `active=false` bila belum pernah dinyalakan atau sudah kedaluwarsa."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Status capture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureStatus' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan ADMIN/SUPERADMIN, atau perangkat milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Perangkat tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: enableDeviceCapture
      tags: [Devices]
      summary: Nyalakan capture sesi CWMP perangkat (maks 60 menit)
      description: |
        ADMIN/SUPERADMIN. Selama capture aktif, setiap pesan SOAP perangkat ini (CPE → ACS dan ACS → CPE) disimpan untuk
        diagnosis kuirk firmware. **Nilai parameter rahasia (password, passphrase, PSK, dst.) disamarkan sebelum disimpan**;
        header HTTP (Authorization, Cookie) tidak pernah disimpan. Capture berhenti sendiri saat kedaluwarsa; hanya 200 pesan
        terbaru per perangkat yang disimpan dan pesan dibuang setelah 7 hari. Menyalakan ulang = memperpanjang. Tercatat di
        audit trail (`CAPTURE_ENABLED`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: integer, minimum: 1, maximum: 60, description: "Lama capture (menit)." }
              required: [minutes]
      responses:
        '200':
          description: Capture aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureStatus' }
        '400':
          description: "`minutes` di luar 1-60 atau field asing."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan ADMIN/SUPERADMIN, atau perangkat milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Perangkat tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: disableDeviceCapture
      tags: [Devices]
      summary: Matikan capture sesi CWMP perangkat
      description: "ADMIN/SUPERADMIN. Seketika; pesan yang sudah terekam tetap ada sampai dipangkas. Audit `CAPTURE_DISABLED`."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Capture dimatikan.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan ADMIN/SUPERADMIN, atau perangkat milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Perangkat tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

