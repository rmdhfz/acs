      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      responses:
        '200':
          description: Daftar OUI (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: addVendorOUI
      tags: [Catalog]
      summary: Mendaftarkan OUI baru milik vendor
      description: |
        Superadmin only. OUI dipakai me-resolve vendor device baru saat Inform
        pertama kali (lihat `FindOrCreateFromInform`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddVendorOUIRequest' }
      responses:
        '201':
          description: OUI ditambahkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `oui` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: OUI sudah terdaftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /device-models:
    get:
      operationId: listDeviceModels
      tags: [Catalog]
      summary: Daftar model device milik satu vendor
      description: Semua role terautentikasi. Data global lintas tenant. `vendor_id` WAJIB diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Daftar device model (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createDeviceModel
      tags: [Catalog]
      summary: Menambah model device baru milik vendor
      description: Superadmin only — bagian dari operasi data menambah dukungan vendor/model (lihat `POST /vendors`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceModelRequest' }
      responses:
        '201':
          description: Device model dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`model_name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendor-parameter-mappings:
    post:
      operationId: upsertParameterMapping
      tags: [Catalog]
      summary: Upsert mapping logical key -> path TR-069 mentah
      description: |
        Superadmin only. Memetakan `logical_key` (mis. `wifi.5g.ssid`) ke path
        TR-069 aktual per vendor + data model version, opsional override per
        device model spesifik. Ini mekanisme WAJIB untuk perbedaan path
        parameter antar vendor — jangan hardcode percabangan vendor di kode Go.
        Upsert: mengirim `vendor_id`+`data_model_version_id`+`device_model_id`+
        `logical_key` yang sama akan mengganti mapping yang sudah ada
        (bukan menambah duplikat).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertVendorParameterMappingRequest' }
      responses:
        '200':
          description: Mapping berhasil di-upsert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorParameterMapping' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`logical_key`/`tr069_path` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== FIRMWARE ==============================
  /firmware:
    post:
      operationId: uploadFirmware
      tags: [Firmware]
      summary: Upload file firmware ke object storage
      description: |
        Superadmin only — `firmware_files` adalah katalog GLOBAL lintas tenant
        (konsisten dengan vendor/device-model/vendor-parameter-mappings),
        upload dibatasi superadmin untuk mencegah satu tenant mendistribusikan
        firmware yang lalu bisa dipakai tenant lain lewat vendor/model yang
        sama. `multipart/form-data`, BUKAN JSON — checksum SHA-256 SELALU
        dihitung ulang di server dari isi file yang benar-benar diterima
        (nilai checksum dari client, kalau ada, tidak pernah dipercaya).
        Batas ukuran file: 256 MiB.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFirmwareRequest'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '201':
          description: Firmware berhasil diupload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareFile' }
        '400':
          description: "`vendor_id`/`version`/`device_model_id` tidak valid, atau field `file` (multipart) tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: "Ukuran request/file melebihi batas maksimum (256 MiB)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listFirmware
      tags: [Firmware]
      summary: Daftar firmware milik satu vendor
      description: Semua role terautentikasi. Data global lintas tenant. `vendor_id` WAJIB diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar firmware.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareFileListResponse' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/firmware-upgrade:
    post:
      operationId: scheduleFirmwareUpgrade
      tags: [Firmware]
      summary: Menjadwalkan upgrade firmware untuk sebuah device
      description: |
        ADMIN/SUPERADMIN. Membuat `firmware_upgrade_jobs` + task `DOWNLOAD`
        (RPC CWMP standar, FileType `1 Firmware Upgrade Image`) berisi
        presigned URL GET langsung dari object storage (MinIO/S3-compatible,
        masa berlaku 1 jam) — bukan proxy lewat ACS. Ditolak `429` bila kuota
        task queue tenant sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleFirmwareUpgradeRequest' }
      responses:
        '201':
          description: Firmware upgrade job dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareUpgradeJob' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `firmware_id` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau firmware tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/firmware-jobs:
    get:
      operationId: listFirmwareJobs
      tags: [Firmware]
      summary: Histori firmware upgrade job milik device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar firmware upgrade job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareUpgradeJobListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== DIAGNOSTICS ==============================
  /devices/{id}/diagnostics:
    post:
      operationId: triggerDiagnostic
      tags: [Diagnostics]
      summary: Trigger diagnostic test TR-069 pada device
      description: |
        ADMIN/NOC/SUPERADMIN. Mengantre task `SET_PARAMETER_VALUES` yang
        menyalakan object diagnostic TR-069 terkait (path parameter dikirim di
        `parameters`, sebagai logical key ATAU raw TR-069 path). Hasil final
        diambil terpisah dan async — polling lewat
        `GET /devices/:id/diagnostics` setelah CPE mengirim event
        `8 DIAGNOSTICS COMPLETE`. Ditolak `429` bila kuota task queue tenant
        sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerDiagnosticRequest' }
      responses:
        '201':
          description: Diagnostic dibuat berstatus PENDING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDiagnostic' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `diagnostic_type` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listDiagnostics
      tags: [Diagnostics]
      summary: Histori diagnostic test milik device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar diagnostic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDiagnosticListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== METRICS ==============================
  /metrics:
    get:
      operationId: metrics
      tags: [Metrics]
      summary: Metrik observability format Prometheus (bukan JSON)
      description: |
        **Format teks Prometheus** (`text/plain; version=0.0.4`), BUKAN JSON —
        beda dari SELURUH endpoint lain di API ini. Tanpa autentikasi sama
        sekali (konvensi umum Prometheus exporter — scraper Prometheus tidak
        mengirim Bearer token). Agregat READ-ONLY LINTAS SELURUH TENANT (mis.
        `acs_devices_by_status`, `acs_cwmp_sessions_open`,
        `acs_devices_by_vendor`) — di deployment produksi, endpoint ini WAJIB
        difirewall di level jaringan (hanya reachable dari subnet Prometheus
        scraper), BUKAN diandalkan level aplikasi, karena memang tidak ada
        autentikasi aplikasi di endpoint ini.
      security: []
      responses:
        '200':
          description: Metrik dalam format exposition Prometheus.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP acs_cwmp_sessions_open Jumlah sesi CWMP yang masih berstatus OPEN saat ini.
                  # TYPE acs_cwmp_sessions_open gauge
                  acs_cwmp_sessions_open 304

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT sesi user (dari `POST /auth/login`) ATAU API token statis
        berawalan `acs_...` (dari `POST /auth/tokens`) — keduanya dikirim
        dengan cara yang sama lewat header `Authorization: Bearer <token>`.

  parameters:
    page:
      name: page
      in: query
      description: Halaman (1-based). Default 1.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: page_size
      in: query
      description: Ukuran halaman. Default 50, maksimum 200 (nilai di luar rentang ini jatuh ke default 50).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    tenantIdQuery:
      name: tenant_id
      in: query
      description: |
        Filter tenant. HANYA efektif untuk actor `SUPERADMIN` — actor role lain
        selalu dipaksa ke tenant miliknya sendiri, nilai ini diabaikan.
      schema: { type: integer, format: int64 }
    tenantIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal tenant.
      schema: { type: integer, format: int64 }
    userIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal user.
      schema: { type: integer, format: int64 }
    deviceIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal device.
      schema: { type: integer, format: int64 }
    taskIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal task.
      schema: { type: integer, format: int64 }
    profileIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal provisioning profile.
      schema: { type: integer, format: int64 }
    ztRuleIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal zero-touch rule.
      schema: { type: integer, format: int64 }
    vendorIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal vendor.
      schema: { type: integer, format: int64 }

  schemas:
    # ---------- Generik ----------
    ErrorResponse:
      type: object
      description: |
        Bentuk error SERAGAM untuk seluruh endpoint (`echo.NewHTTPError`) —
        selalu `{"message": "..."}`, tidak ada kode error mesin terpisah dari
        `message` teks bebas saat ini (perhatikan: teks pesan sebagian besar
        Bahasa Indonesia, konsisten dengan gaya pesan aplikasi ini).
      properties:
        message:
          type: string
          example: "domain: data tidak ditemukan"
      required: [message]

    RefLookup:
      type: object
      description: Satu baris tabel referensi/enum generik (`ref_*`).
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ONLINE }
        name: { type: string, example: Online }
      required: [id, code, name]

    Audit:
      type: object
      description: 7 kolom audit standar yang dipakai hampir semua entitas master/transactional.
      properties:
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: integer, format: int64, nullable: true }
        is_deleted: { type: boolean }

    # ---------- Auth ----------
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        user:
          type: object
          properties:
            id: { type: integer, format: int64 }
            uuid: { type: string, format: uuid }
            username: { type: string }
            roles: { type: array, items: { type: string } }
            tenant_id: { type: integer, format: int64, nullable: true }
      required: [access_token, token_type, user]

    ChangeOwnPasswordRequest:
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
      required: [current_password, new_password]

    IssueAPITokenRequest:
      type: object
      properties:
        name: { type: string, description: Nama/label token untuk memudahkan identifikasi di masa depan. }
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: harus sama dengan tenant milik actor sendiri (atau dikosongkan agar default ke tenant actor)."
        expires_at: { type: string, format: date-time, nullable: true, description: "Kosongkan agar token tidak pernah kedaluwarsa." }
      required: [name]

    IssueAPITokenResponse:
      type: object
      description: "Nilai `token` PLAINTEXT hanya muncul di sini, SEKALI — tidak bisa diambil ulang lewat endpoint manapun setelahnya."
      properties:
        token: { type: string, example: "acs_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" }
        id: { type: integer, format: int64 }
        uuid: { type: string, format: uuid }
      required: [token, id, uuid]

    # ---------- Tenants ----------
    Tenant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        cwmp_inform_username:
          type: string
          nullable: true
          description: "Separuh dari shared secret Inform CWMP tenant ini. Separuh lainnya (password) TIDAK PERNAH diekspos di response manapun."
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true, example: "#1a73e8" }
        max_pending_tasks: { type: integer, nullable: true, description: "NULL berarti tidak dibatasi." }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, tenant_uuid, code, name, is_active]

    TenantListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Tenant' }
        total: { type: integer }
      required: [data, total]

    CurrentTenant:
      type: object
      description: DTO SEMPIT khusus `GET /tenants/current` — sengaja tidak mengikutkan `code`, `is_active`, `cwmp_inform_username`, atau kolom audit.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true }
      required: [id, name]

    CreateTenantRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        cwmp_inform_username: { type: string, nullable: true }
        cwmp_inform_password: { type: string, format: password, nullable: true, minLength: 16 }
      required: [code, name]

    SetTenantCWMPCredentialsRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 16 }
      required: [username, password]

    UpdateTenantBrandingRequest:
      type: object
      description: "FULL REPLACE — `null` eksplisit mengosongkan kolom terkait (bukan \"tidak diubah\")."
      properties:
        brand_name: { type: string, nullable: true, maxLength: 128 }
        logo_url: { type: string, nullable: true, format: uri, maxLength: 512, description: "Harus http/https valid." }
        primary_color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$' }

    SetTenantTaskQuotaRequest:
      type: object
      properties:
        max_pending_tasks:
          type: integer
          nullable: true
          description: "NULL berarti tidak dibatasi."

    UpdateTenantRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
        is_active: { type: boolean, nullable: true }

    # ---------- Users ----------
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL untuk superadmin lintas-tenant." }
        username: { type: string }
        email: { type: string, format: email }
        full_name: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER] }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, user_uuid, username, email, full_name, is_active, roles]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }
      required: [data, total]

    CreateUserRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: WAJIB sama dengan tenant miliknya sendiri."
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        full_name: { type: string }
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER] }
          description: "Non-superadmin TIDAK BOLEH menyertakan `SUPERADMIN` (dicek case-insensitive)."
      required: [username, password]

    UpdateUserRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        full_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        is_active: { type: boolean, nullable: true, description: "Actor tidak bisa men-set `false` untuk akunnya sendiri (self-lockout guard)." }

    ResetUserPasswordRequest:
      type: object
      properties:
        new_password: { type: string, format: password, minLength: 8 }
      required: [new_password]

    ReplaceUserRolesRequest:
      type: object
      description: FULL REPLACE — role yang tidak disebut akan dicabut.
      properties:
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER] }
      required: [role_codes]

    # ---------- Devices ----------
    Device:
      type: object
      description: |
        Inventory CPE. Kredensial (`connection_request_password`,
        `inform_password`) disimpan terenkripsi dan TIDAK PERNAH muncul di
        response ini. **Catatan:** `connection_request_username` MASIH
        dikembalikan di response (beda perlakuan dari passwordnya) — lihat
        catatan temuan di deskripsi endpoint terkait/laporan audit.
      properties:
        id: { type: integer, format: int64 }
        device_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        vendor_id: { type: integer, format: int64, nullable: true, description: "NULL bila belum ter-resolve dari OUI (device UNREGISTERED)." }
        device_model_id: { type: integer, format: int64, nullable: true }
        device_status_id: { type: integer, format: int64 }
        provisioning_profile_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true, example: "AABBCC" }
        serial_number: { type: string }
        product_class: { type: string, nullable: true }
        mac_address: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
        hardware_version: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        connection_request_url: { type: string, nullable: true }
        connection_request_username: { type: string, nullable: true }
        inform_username: { type: string, nullable: true }
        last_inform_at: { type: string, format: date-time, nullable: true }
        last_boot_event_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, device_uuid, device_status_id, serial_number]

    DeviceListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Device' }
        total: { type: integer }
      required: [data, total]

    DeviceStats:
      type: object
      properties:
        by_status:
          type: array
          nullable: true
          items:
            type: object
            properties:
              device_status_id: { type: integer, format: int64 }
              count: { type: integer }
        by_vendor:
          type: array
          nullable: true
          items:
            type: object
            properties:
              vendor_id: { type: integer, format: int64, nullable: true, description: "NULL berarti device yang belum ter-resolve vendor-nya." }
              count: { type: integer }

    UpdateDeviceRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        notes: { type: string, nullable: true }
        connection_request_url: { type: string, nullable: true }
        connection_request_username: { type: string, nullable: true }
        connection_request_password:
          type: string
          format: password
          nullable: true
          description: "Dienkripsi sebelum disimpan; tidak pernah dikembalikan lagi di response manapun."

    DeviceParameter:
      type: object
      description: Nilai parameter TR-069 terkini per device (EAV, hasil sinkronisasi GetParameterValues terakhir).
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        parameter_name: { type: string, example: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.ExternalIPAddress" }
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        writable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, device_id, parameter_name, writable]

    DeviceEvent:
      type: object
      description: "Histori event Inform CWMP — audit minimal (`created_at` saja, tanpa 7 kolom audit standar; TECH.md §11, tabel log volume tinggi)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64, nullable: true }
        event_code_id: { type: integer, format: int64 }
        command_key: { type: string, nullable: true }
        raw_payload: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, event_code_id, occurred_at]

    DeviceEventListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceEvent' }
        total: { type: integer }
      required: [data, total]

    DeviceOpticalMetric:
      type: object
      description: "Metrik optik GPON/EPON — audit minimal (TECH.md §11)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        rx_power_dbm: { type: number, format: double, nullable: true }
        tx_power_dbm: { type: number, format: double, nullable: true }
        voltage: { type: number, format: double, nullable: true }
        bias_current_ma: { type: number, format: double, nullable: true }
        temperature_celsius: { type: number, format: double, nullable: true }
        distance_meters: { type: number, format: double, nullable: true }
        recorded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, recorded_at]

    DeviceOpticalMetricListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceOpticalMetric' }
        total: { type: integer }
      required: [data, total]

    ActivityLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, nullable: true, description: "NULL untuk aksi sistem otomatis (mis. evaluasi Zero-Touch saat BOOTSTRAP)." }
        tenant_id: { type: integer, format: int64, nullable: true }
        action: { type: string, example: UPDATE_DEVICE }
        entity_type: { type: string, example: device }
        entity_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        username:
          type: string
          nullable: true
          description: "Hasil LEFT JOIN ke users, bukan kolom asli tabel — NULL bila `user_id` NULL atau user sudah dihapus."
      required: [id, action, entity_type, created_at]

    ActivityLogListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ActivityLog' }
        total: { type: integer }
      required: [data, total]

    # ---------- Tasks ----------
    Task:
      type: object
      description: |
        Satu item antrean RPC CWMP. **Catatan penting:** `parameters` dan
        `response` di struct Go bertipe `[]byte` (JSON mentah) sehingga
        di-serialize sebagai STRING TER-BASE64-KAN oleh `encoding/json`
        Go (bukan objek JSON apa adanya) — klien HARUS men-decode base64
        lalu parse ulang sebagai JSON untuk mendapatkan isi aslinya. Ini
        BEDA dari body request `POST /tasks` yang menerima `parameters`
        sebagai objek JSON biasa (lihat `CreateTaskRequest`) — asimetri
        request vs response ini nyata di API berjalan, dicatat sebagai
        temuan (lihat laporan audit), bukan sekadar asumsi dari baca kode.
        Untuk role `NOC`/`VIEWER`, key `url`/`username`/`password` di dalam
        `parameters` (setelah didekode) akan bernilai `"[redacted]"`.
      properties:
        id: { type: integer, format: int64 }
        task_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        task_type_id: { type: integer, format: int64 }
        task_status_id: { type: integer, format: int64 }
        priority: { type: integer, minimum: 1, maximum: 9, description: "1 = tertinggi, 9 = terendah." }
        parameters:
          type: string
          format: byte
          nullable: true
          description: "JSON mentah ter-base64-kan, lihat catatan di atas."
        response:
          type: string
          format: byte
          nullable: true
          description: "JSON mentah ter-base64-kan (respons RPC dari CPE), lihat catatan di atas."
        error_message: { type: string, nullable: true }
        retry_count: { type: integer }
        max_retries: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, task_uuid, device_id, task_type_id, task_status_id, priority]

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Task' }
        total: { type: integer }
      required: [data, total]

    TaskStatusCount:
      type: object
      properties:
        task_status_id: { type: integer, format: int64 }
        count: { type: integer }
      required: [task_status_id, count]

    CreateTaskRequest:
      type: object
      description: "`parameters` di SINI adalah OBJEK JSON biasa (bukan base64) — lihat catatan asimetri di skema `Task`."
      properties:
        device_id: { type: integer, format: int64 }
        task_type:
          type: string
          description: "Kode `ref_task_types`, mis. `REBOOT`, `GET_PARAMETER_VALUES`, `SET_PARAMETER_VALUES`, `DOWNLOAD`, `FACTORY_RESET`."
          example: REBOOT
        priority: { type: integer, minimum: 0, maximum: 9, default: 5, description: "0 dikirim = pakai default 5." }
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        max_retries: { type: integer, minimum: 0, default: 3, description: "0 dikirim = pakai default 3." }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
      required: [device_id, task_type]

    # ---------- Provisioning ----------
    ProvisioningProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti profile global lintas tenant (hanya bisa dibuat/diedit superadmin)." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, profile_uuid, name, is_default, is_active]

    ProvisioningProfileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfile' }
        total: { type: integer }
      required: [data, total]

    ProvisioningProfileParameter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        parameter_name:
          type: string
          description: "Boleh logical key (mis. `wifi.5g.ssid`) ATAU raw path TR-069 — diresolve saat APPLY, bukan saat disimpan."
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        apply_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, profile_id, parameter_name, apply_order]

    ProvisioningProfileDetail:
      type: object
      description: "Response gabungan khusus `GET /provisioning-profiles/:id` — BUKAN `ProvisioningProfile` polos."
      properties:
        profile: { $ref: '#/components/schemas/ProvisioningProfile' }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfileParameter' }
      required: [profile, parameters]

    ProfileParameterInput:
      type: object
      properties:
        parameter_name: { type: string }
        parameter_value: { type: string, nullable: true }
        apply_order: { type: integer, default: 0 }
      required: [parameter_name]

    CreateProfileRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "NULL = profile global (superadmin only). Non-superadmin WAJIB isi dengan tenant miliknya sendiri."
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean, default: false }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ProfileParameterInput' }
      required: [name]

    UpdateProfileRequest:
      type: object
      description: "FULL update untuk field skalar (bukan partial — kirim seluruh state). `parameters` NULL/tidak dikirim = parameter lama TIDAK disentuh; array (termasuk kosong `[]`) = REPLACE seluruh parameter lama."
      properties:
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean }
        is_active: { type: boolean }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProfileParameterInput' }

    ZeroTouchRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti rule global lintas tenant." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true }
        serial_pattern: { type: string, nullable: true, description: "Pola SQL LIKE (`%`/`_`), dicocokkan case-insensitive." }
        provisioning_profile_id: { type: integer, format: int64 }
        priority: { type: integer, description: "Angka lebih kecil dievaluasi lebih dulu." }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, provisioning_profile_id, priority, is_active]

    ZeroTouchRuleRequest:
      type: object
      properties:
        tenant_id: { type: integer, format: int64, nullable: true }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true }
        serial_pattern: { type: string, nullable: true }
        provisioning_profile_id: { type: integer, format: int64 }
        priority: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
      required: [provisioning_profile_id]

    # ---------- Catalog ----------
    Vendor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ZTE }
        name: { type: string, example: ZTE Corporation }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, code, name, is_active]

    VendorListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Vendor' }
        total: { type: integer }
      required: [data, total]

    CreateVendorRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
      required: [code, name]

    VendorOUI:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        oui: { type: string, example: "AABBCC" }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, oui]

    AddVendorOUIRequest:
      type: object
      properties:
        oui: { type: string }
        notes: { type: string, nullable: true }
      required: [oui]

    DeviceModel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64, description: "Resolve ke `InternetGatewayDevice.*` (TR-098) atau `Device.*` (TR-181)." }
        product_class: { type: string, nullable: true }
        model_name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, device_type_id, data_model_version_id, model_name, is_active]

    CreateDeviceModelRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        product_class: { type: string, nullable: true }
        model_name: { type: string }
        description: { type: string, nullable: true }
      required: [vendor_id, device_type_id, data_model_version_id, model_name]

    VendorParameterMapping:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true, description: "NULL = berlaku untuk seluruh model vendor ini pada data model version tsb; diisi untuk override spesifik satu model." }
        logical_key: { type: string, example: wifi.5g.ssid }
        tr069_path: { type: string, example: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSID" }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, data_model_version_id, logical_key, tr069_path]

    UpsertVendorParameterMappingRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        logical_key: { type: string }
        tr069_path: { type: string }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
      required: [vendor_id, data_model_version_id, logical_key, tr069_path]

    # ---------- Firmware ----------
    FirmwareFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firmware_uuid: { type: string, format: uuid }
        vendor_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        version: { type: string }
        file_name: { type: string }
        storage_key:
          type: string
          description: "Object key di object storage (MinIO/S3-compatible) — BUKAN URL. Presigned GET URL digenerate on-demand terpisah (lihat `POST /devices/:id/firmware-upgrade`), tidak pernah disimpan/diekspos langsung di sini."
        file_size_bytes: { type: integer, format: int64, nullable: true }
        checksum_sha256: { type: string, nullable: true, description: "Selalu dihitung ulang di server saat upload, tidak pernah dipercaya dari client." }
        release_notes: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, firmware_uuid, vendor_id, version, file_name, storage_key, is_active]

    FirmwareFileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareFile' }
        total: { type: integer }
      required: [data, total]

    UploadFirmwareRequest:
      type: object
      description: "`multipart/form-data` — bukan JSON."
      properties:
        vendor_id: { type: string, description: "Numerik, dikirim sebagai form field teks (bukan JSON number)." }
        device_model_id: { type: string, nullable: true, description: "Opsional, numerik sebagai teks." }
        version: { type: string }
        release_notes: { type: string, nullable: true }
        file:
          type: string
          format: binary
          description: "Isi file firmware. Maksimum 256 MiB."
      required: [vendor_id, version, file]

    ScheduleFirmwareUpgradeRequest:
      type: object
      properties:
        firmware_id: { type: integer, format: int64 }
        scheduled_at: { type: string, format: date-time, nullable: true }
      required: [firmware_id]

    FirmwareUpgradeJob:
      type: object
      description: "TIDAK memakai 7 kolom audit standar (tidak ada soft-delete pada entitas ini) — hanya `created_at/by` + `updated_at/by`."
      properties:
        id: { type: integer, format: int64 }
        job_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        firmware_id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64, nullable: true }
        task_status_id: { type: integer, format: int64 }
        from_version: { type: string, nullable: true }
        to_version: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
      required: [id, job_uuid, device_id, firmware_id, task_status_id]

    FirmwareUpgradeJobListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareUpgradeJob' }
        total: { type: integer }
      required: [data, total]

    # ---------- Diagnostics ----------
    DeviceDiagnostic:
      type: object
      description: "`result` bertipe `[]byte` di Go, sama seperti `Task.parameters`/`Task.response` — di-serialize sebagai string ter-base64-kan, bukan objek JSON apa adanya."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64, nullable: true }
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        result: { type: string, format: byte, nullable: true }
        executed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, device_id, diagnostic_type, status, created_at]

    DeviceDiagnosticListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceDiagnostic' }
        total: { type: integer }
      required: [data, total]

    TriggerDiagnosticRequest:
      type: object
      properties:
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        parameters:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: "Map logical key/raw TR-069 path -> nilai yang di-set untuk menjalankan diagnostic (mis. `{\"InternetGatewayDevice.IPPingDiagnostics.Host\": \"8.8.8.8\"}`)."
      required: [diagnostic_type]
