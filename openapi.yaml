  /provisioning-profiles/{id}:
    get:
      operationId: getProfile
      tags: [Provisioning]
      summary: Detail profile beserta daftar parameternya
      description: |
        Semua role terautentikasi — boleh membaca profile tenant sendiri ATAU
        profile global (`tenant_id: null`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      responses:
        '200':
          description: Detail profile + parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningProfileDetail' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Profile milik tenant lain (bukan global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: updateProfile
      tags: [Provisioning]
      summary: Update profile (full update) beserta parameternya
      description: |
        ADMIN/SUPERADMIN. Profile global (`tenant_id: null`) HANYA bisa diedit
        superadmin (mencegah satu tenant diam-diam mengubah default bersama).
        Bila field `parameters` dikirim (non-null), SELURUH parameter lama
        profile diganti (replace, bukan merge); bila tidak dikirim, parameter
        yang sudah ada tidak disentuh.

        **PENTING (FR-18):** mengubah profile ini TIDAK otomatis mendorong
        ulang konfigurasi ke device yang SUDAH terprovisioning dengan profile
        ini sebelumnya — ini keputusan produk yang disengaja. Untuk menerapkan
        perubahan ke device tertentu, panggil eksplisit
        `POST /devices/:id/apply-profile/:profileId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '204':
          description: Profile berhasil diupdate.
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, profile tenant lain, atau non-superadmin mencoba mengedit profile global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteProfile
      tags: [Provisioning]
      summary: Soft-delete profile
      description: ADMIN/SUPERADMIN, scope sama seperti `PUT /provisioning-profiles/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      responses:
        '204':
          description: Profile berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, profile tenant lain, atau non-superadmin mencoba menghapus profile global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/apply-profile/{profileId}:
    post:
      operationId: applyProfile
      tags: [Provisioning]
      summary: Menerapkan provisioning profile ke device (eksplisit)
      description: |
        ADMIN/SUPERADMIN. Mengantre SATU task `SET_PARAMETER_VALUES` berisi
        seluruh parameter profile, lalu mengeset `provisioning_profile_id`
        device ke profile ini. SELALU dipanggil eksplisit (manual, atau
        otomatis dari evaluasi Zero-Touch Provisioning saat BOOTSTRAP) — lihat
        catatan FR-18 di `PUT /provisioning-profiles/:id`. Ditolak `429` bila
        kuota task queue tenant sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - name: profileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '201':
          description: Task SET_PARAMETER_VALUES yang diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` device/`profileId` tidak valid, atau profile tidak punya parameter untuk diterapkan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, device/profile milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== ZERO-TOUCH ==============================
  /zero-touch-rules:
    get:
      operationId: listZTRules
      tags: [ZeroTouch]
      summary: Daftar aturan Zero-Touch Provisioning
      description: |
        Semua role terautentikasi. Menampilkan rule tenant sendiri + rule
        global (`tenant_id: null`), terurut `priority` ASC. `tenant_id` di
        query hanya efektif untuk superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
      responses:
        '200':
          description: Daftar rule (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/ZeroTouchRule' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createZTRule
      tags: [ZeroTouch]
      summary: Membuat aturan Zero-Touch Provisioning baru
      description: |
        ADMIN/SUPERADMIN. Rule dievaluasi urut `priority` ASC (angka lebih
        kecil dievaluasi lebih dulu) saat device baru mengirim event
        `0 BOOTSTRAP`. Non-superadmin hanya boleh membuat rule untuk tenant
        miliknya sendiri.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZeroTouchRuleRequest' }
      responses:
        '201':
          description: Rule dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZeroTouchRule' }
        '400':
          description: "Payload tidak valid atau `provisioning_profile_id` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau non-superadmin mencoba membuat rule untuk tenant lain/global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /zero-touch-rules/{id}:
    put:
      operationId: updateZTRule
      tags: [ZeroTouch]
      summary: Update aturan Zero-Touch Provisioning (full update)
      description: ADMIN/SUPERADMIN, scope tenant sama seperti `POST /zero-touch-rules`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ztRuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZeroTouchRuleRequest' }
      responses:
        '204':
          description: Rule berhasil diupdate.
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau rule milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rule tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteZTRule
      tags: [ZeroTouch]
      summary: Soft-delete aturan Zero-Touch Provisioning
      description: ADMIN/SUPERADMIN, scope sama seperti `PUT /zero-touch-rules/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ztRuleIdPath'
      responses:
        '204':
          description: Rule berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau rule milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rule tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== CATALOG ==============================
  /vendors:
    get:
      operationId: listVendors
      tags: [Catalog]
      summary: Daftar vendor CPE
      description: |
        Semua role terautentikasi. Data referensi GLOBAL lintas tenant (FR-28)
        — TIDAK ada filter tenant sama sekali di endpoint katalog vendor/model/
        mapping (by design, ini "data referensi platform" bukan data tenant).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createVendor
      tags: [Catalog]
      summary: Menambah vendor CPE baru
      description: |
        Superadmin only. Menambah dukungan vendor baru adalah OPERASI DATA
        (insert ke `ref_vendors`/`vendor_ouis`/`device_models`/
        `vendor_parameter_mappings`), bukan perubahan kode — lihat juga
        `POST /vendors/:id/ouis`, `POST /device-models`,
        `POST /vendor-parameter-mappings`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVendorRequest' }
      responses:
        '201':
          description: Vendor dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400':
          description: "Payload tidak valid, `code`/`name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`code` vendor sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendors/{id}/ouis:
    get:
      operationId: listVendorOUIs
      tags: [Catalog]
      summary: Daftar OUI (prefix MAC) terdaftar milik vendor
