      description: |
        Superadmin only. HANYA metadata: `version`, `release_notes` (string kosong = dikosongkan), `is_active`. Identitas isi file (`file_name`, `storage_key`, ukuran, `checksum_sha256`) dan targeting (`vendor_id`/`device_model_id`) tidak bisa diubah — unggah firmware baru bila isinya berbeda. Minimal satu field harus diisi.
