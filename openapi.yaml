  # ============================== CATALOG ==============================
  /vendors:
    get:
      operationId: listVendors
      tags: [Catalog]
      summary: Daftar vendor CPE
      description: |
        Semua role terautentikasi. Data referensi GLOBAL lintas tenant (FR-28)
        — TIDAK ada filter tenant sama sekali di endpoint katalog vendor/model/
        mapping (by design, ini "data referensi platform" bukan data tenant).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createVendor
      tags: [Catalog]
      summary: Menambah vendor CPE baru
      description: |
        Superadmin only. Menambah dukungan vendor baru adalah OPERASI DATA
        (insert ke `ref_vendors`/`vendor_ouis`/`device_models`/
        `vendor_parameter_mappings`), bukan perubahan kode — lihat juga
        `POST /vendors/:id/ouis`, `POST /device-models`,
        `POST /vendor-parameter-mappings`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVendorRequest' }
      responses:
        '201':
          description: Vendor dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400':
          description: "Payload tidak valid, `code`/`name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`code` vendor sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendors/{id}/ouis:
    get:
      operationId: listVendorOUIs
      tags: [Catalog]
      summary: Daftar OUI (prefix MAC) terdaftar milik vendor
      description: Semua role terautentikasi. Data global lintas tenant.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      responses:
        '200':
          description: Daftar OUI (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: addVendorOUI
      tags: [Catalog]
      summary: Mendaftarkan OUI baru milik vendor
      description: |
        Superadmin only. OUI dipakai me-resolve vendor device baru saat Inform
        pertama kali (lihat `FindOrCreateFromInform`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddVendorOUIRequest' }
      responses:
        '201':
          description: OUI ditambahkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `oui` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: OUI sudah terdaftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /device-models:
    get:
      operationId: listDeviceModels
      tags: [Catalog]
      summary: Daftar model device milik satu vendor
      description: Semua role terautentikasi. Data global lintas tenant. `vendor_id` WAJIB diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Daftar device model (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createDeviceModel
      tags: [Catalog]
      summary: Menambah model device baru milik vendor
      description: Superadmin only — bagian dari operasi data menambah dukungan vendor/model (lihat `POST /vendors`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceModelRequest' }
      responses:
        '201':
          description: Device model dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`model_name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendor-parameter-mappings:
    post:
      operationId: upsertParameterMapping
      tags: [Catalog]
      summary: Upsert mapping logical key -> path TR-069 mentah
      description: |
        Superadmin only. Memetakan `logical_key` (mis. `wifi.5g.ssid`) ke path
        TR-069 aktual per vendor + data model version, opsional override per
        device model spesifik. Ini mekanisme WAJIB untuk perbedaan path
        parameter antar vendor — jangan hardcode percabangan vendor di kode Go.
        Upsert: mengirim `vendor_id`+`data_model_version_id`+`device_model_id`+
        `logical_key` yang sama akan mengganti mapping yang sudah ada
        (bukan menambah duplikat).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertVendorParameterMappingRequest' }
      responses:
        '200':
          description: Mapping berhasil di-upsert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorParameterMapping' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`logical_key`/`tr069_path` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== FIRMWARE ==============================
  /firmware:
    post:
      operationId: uploadFirmware
      tags: [Firmware]
      summary: Upload file firmware ke object storage
      description: |
        Superadmin only — `firmware_files` adalah katalog GLOBAL lintas tenant
        (konsisten dengan vendor/device-model/vendor-parameter-mappings),
        upload dibatasi superadmin untuk mencegah satu tenant mendistribusikan
        firmware yang lalu bisa dipakai tenant lain lewat vendor/model yang
        sama. `multipart/form-data`, BUKAN JSON — checksum SHA-256 SELALU
        dihitung ulang di server dari isi file yang benar-benar diterima
        (nilai checksum dari client, kalau ada, tidak pernah dipercaya).
        Batas ukuran file: 256 MiB.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFirmwareRequest'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '201':
          description: Firmware berhasil diupload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareFile' }
        '400':
          description: "`vendor_id`/`version`/`device_model_id` tidak valid, atau field `file` (multipart) tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: "Ukuran request/file melebihi batas maksimum (256 MiB)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listFirmware
      tags: [Firmware]
      summary: Daftar firmware milik satu vendor
      description: Semua role terautentikasi. Data global lintas tenant. `vendor_id` WAJIB diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar firmware.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareFileListResponse' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/firmware-upgrade:
    post:
      operationId: scheduleFirmwareUpgrade
      tags: [Firmware]
      summary: Menjadwalkan upgrade firmware untuk sebuah device
      description: |
        ADMIN/SUPERADMIN. Membuat `firmware_upgrade_jobs` + task `DOWNLOAD`
        (RPC CWMP standar, FileType `1 Firmware Upgrade Image`) berisi
        presigned URL GET langsung dari object storage (MinIO/S3-compatible,
        masa berlaku 1 jam) — bukan proxy lewat ACS. Ditolak `429` bila kuota
        task queue tenant sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleFirmwareUpgradeRequest' }
      responses:
        '201':
          description: Firmware upgrade job dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareUpgradeJob' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `firmware_id` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau firmware tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/firmware-jobs:
    get:
      operationId: listFirmwareJobs
      tags: [Firmware]
      summary: Histori firmware upgrade job milik device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar firmware upgrade job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareUpgradeJobListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /firmware/rollout-batches:
    post:
      operationId: createRolloutBatch
      tags: [Firmware]
      summary: Buat firmware rollout batch (canary/staged rollout)
      description: |
        ADMIN/SUPERADMIN. Membuat rencana rollout firmware bertahap ke populasi
        device (filter `vendor_id`/`device_model_id`, bentuk sama dgn
        `GET /devices`). Wave pertama otomatis dimulai saat batch dibuat.
        Wave berikutnya menyusul otomatis (sweeper `acsd` atau
        `POST .../advance`) HANYA bila wave sebelumnya tuntas & failure rate di
        bawah `max_failure_rate_percent`; jika melebihi ambang batch di-PAUSE.
        `tenant_id` null (rollout global lintas-tenant) hanya boleh dibuat SUPERADMIN.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRolloutBatchRequest' }
      responses:
        '201':
          description: Batch dibuat (wave 1 mungkin sudah dijadwalkan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRolloutBatch' }
        '400':
          description: "Payload tidak valid, `firmware_file_id` kosong, atau `wave_percentage` di luar 1-100."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau mencoba membuat batch global sbg non-SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listRolloutBatches
      tags: [Firmware]
      summary: Daftar firmware rollout batch
      description: |
        Semua role terautentikasi. Tenant-scoped: non-SUPERADMIN hanya melihat
        batch tenant sendiri (param `tenant_id` diabaikan). GET dibuka ke
        NOC/VIEWER untuk memantau progres tanpa bisa memicu/membatalkan.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Hanya efektif untuk SUPERADMIN.
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar rollout batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRolloutBatchListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Non-SUPERADMIN dengan akun tanpa tenant_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /firmware/rollout-batches/{id}:
    get:
      operationId: getRolloutBatch
      tags: [Firmware]
      summary: Detail satu firmware rollout batch
      description: Semua role terautentikasi, tenant-scoped.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/rolloutBatchIdPath'
      responses:
        '200':
          description: Detail batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRolloutBatch' }
        '400': { description: "`id` tidak valid.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: "Tidak terautentikasi.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: "Batch milik tenant lain.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Batch tidak ditemukan.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /firmware/rollout-batches/{id}/advance:
    post:
      operationId: advanceRolloutBatch
      tags: [Firmware]
      summary: Paksa evaluasi wave rollout sekarang
      description: |
        ADMIN/SUPERADMIN, tenant-scoped. Idempotent — hanya mengubah state bila
        wave berjalan sudah tuntas (semua job berstatus akhir). Dipakai operator
        yang tidak ingin menunggu sweeper periodik. Jika wave sebelumnya di
        atas ambang gagal, batch tetap PAUSED (advance tidak memaksa lanjut).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/rolloutBatchIdPath'
      responses:
        '200':
          description: State batch setelah evaluasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRolloutBatch' }
        '400': { description: "`id` tidak valid.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: "Tidak terautentikasi.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: "Role di bawah ADMIN, atau batch milik tenant lain.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Batch tidak ditemukan.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /firmware/rollout-batches/{id}/cancel:
    post:
      operationId: cancelRolloutBatch
      tags: [Firmware]
      summary: Batalkan firmware rollout batch
      description: |
        ADMIN/SUPERADMIN, tenant-scoped. Status → CANCELLED (batch tetap
        terlihat di histori, BUKAN soft-delete). Job yang sudah dibuat pada
        wave berjalan TIDAK ditarik balik — yang dicegah adalah wave berikutnya.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/rolloutBatchIdPath'
      responses:
        '204': { description: "Batch dibatalkan." }
        '400': { description: "`id` tidak valid.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: "Tidak terautentikasi.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: "Role di bawah ADMIN, atau batch milik tenant lain.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Batch tidak ditemukan.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================== DIAGNOSTICS ==============================
  /devices/{id}/diagnostics:
    post:
      operationId: triggerDiagnostic
      tags: [Diagnostics]
      summary: Trigger diagnostic test TR-069 pada device
      description: |
        ADMIN/NOC/SUPERADMIN. Mengantre task `SET_PARAMETER_VALUES` yang
        menyalakan object diagnostic TR-069 terkait (path parameter dikirim di
        `parameters`, sebagai logical key ATAU raw TR-069 path). Hasil final
        diambil terpisah dan async — polling lewat
        `GET /devices/:id/diagnostics` setelah CPE mengirim event
        `8 DIAGNOSTICS COMPLETE`. Ditolak `429` bila kuota task queue tenant
        sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerDiagnosticRequest' }
      responses:
        '201':
          description: Diagnostic dibuat berstatus PENDING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDiagnostic' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `diagnostic_type` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listDiagnostics
      tags: [Diagnostics]
      summary: Histori diagnostic test milik device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar diagnostic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDiagnosticListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== METRICS ==============================
  /metrics:
    get:
      operationId: metrics
      tags: [Metrics]
      summary: Metrik observability format Prometheus (bukan JSON)
      description: |
        **Format teks Prometheus** (`text/plain; version=0.0.4`), BUKAN JSON —
        beda dari SELURUH endpoint lain di API ini. Tanpa autentikasi sama
        sekali (konvensi umum Prometheus exporter — scraper Prometheus tidak
        mengirim Bearer token). Agregat READ-ONLY LINTAS SELURUH TENANT (mis.
        `acs_devices_by_status`, `acs_cwmp_sessions_open`,
        `acs_devices_by_vendor`) — di deployment produksi, endpoint ini WAJIB
        difirewall di level jaringan (hanya reachable dari subnet Prometheus
        scraper), BUKAN diandalkan level aplikasi, karena memang tidak ada
        autentikasi aplikasi di endpoint ini.
      security: []
      responses:
        '200':
          description: Metrik dalam format exposition Prometheus.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP acs_cwmp_sessions_open Jumlah sesi CWMP yang masih berstatus OPEN saat ini.
                  # TYPE acs_cwmp_sessions_open gauge
                  acs_cwmp_sessions_open 304

  # ============================== AUTH — OIDC (opsional) ==============================
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [Auth]
      summary: Mulai alur login OIDC (redirect ke Identity Provider)
      description: |
        Hanya aktif bila OIDC dikonfigurasi (`ACS_OIDC_*`). Endpoint browser
        redirect — BUKAN JSON. Mengembalikan `302` ke authorization endpoint IdP
        dengan `state`/`nonce`. Tanpa autentikasi (titik masuk login).
      security: []
      responses:
        '302':
          description: Redirect ke Identity Provider.
        '404':
          description: OIDC tidak dikonfigurasi di instance ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [Auth]
      summary: Callback OIDC — tukar authorization code jadi sesi
      description: |
        Dipanggil oleh browser setelah IdP meng-authorize user. Memverifikasi
        `state` + ID token, lalu menautkan/menerbitkan user lokal. BUKAN JSON
        (redirect atau body kecil, tergantung konfigurasi). Tanpa autentikasi
        Bearer (identitas dibawa oleh `code`).
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Redirect ke aplikasi frontend dengan sesi ter-set.
        '400':
          description: "`state` tidak cocok, `code` invalid, atau ID token gagal diverifikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== REALTIME ==============================
  /ws:
    get:
      operationId: serveWs
      tags: [Sessions]
      summary: Upgrade WebSocket untuk push event realtime ke frontend
      description: |
        Meng-upgrade koneksi HTTP ke WebSocket (`Connection: Upgrade`). Setelah
        upgrade, server mem-push event JSON (task selesai/gagal, device
        online/offline, dsb.) yang ter-scope ke tenant actor. Autentikasi Bearer
        WAJIB pada request handshake. Tidak ada body response HTTP biasa.
      security: [{ bearerAuth: [] }]
      responses:
        '101':
          description: Switching Protocols — WebSocket terhubung.
        '400':
          description: Bukan permintaan upgrade WebSocket yang valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== SESSIONS ==============================
  /cwmp/sessions/count:
    get:
      operationId: countOpenSessions
      tags: [Sessions]
      summary: Jumlah sesi CWMP berstatus OPEN saat ini (lintas tenant)
      description: |
        ADMIN/NOC/SUPERADMIN. Angka **lintas seluruh tenant** (melacak beban
        load balancer CWMP secara global, bukan per-tenant) — sengaja tidak
        di-scope. Sesi yang CPE-nya berhenti tanpa POST-kosong penutup di-reap
        otomatis ke status `TIMEOUT` oleh sweeper (ambang 15 menit), jadi angka
        ini tidak menumpuk permanen.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jumlah sesi OPEN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== DEVICES — sub-resource tambahan ==============================
  /devices/{id}/connection-request:
    post:
      operationId: triggerConnectionRequest
      tags: [Devices]
      summary: Paksa CPE Inform segera (TR-069 Connection Request)
      description: |
        ADMIN/NOC/SUPERADMIN. ACS mengirim HTTP GET ber-Digest-auth ke
        `connection_request_url` device. **Asinkron** — Inform dari device
        datang beberapa detik kemudian di sesi CWMP terpisah, bukan sebagai
        respons sinkron di sini. `400` bila device tidak punya
        `connection_request_url`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '202':
          description: Connection request terkirim ke device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: "`id` tidak valid, atau device tidak punya `connection_request_url`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/config-snapshots:
    get:
      operationId: listConfigSnapshots
      tags: [Devices]
      summary: Histori snapshot konfigurasi (parameter-tree) device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar snapshot (terbaru dulu).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConfigSnapshotListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createConfigSnapshot
      tags: [Devices]
      summary: Ambil snapshot konfigurasi device sekarang
      description: |
        ADMIN/NOC/SUPERADMIN. Menyimpan seluruh `device_parameters` terkini
        sebagai satu snapshot JSON (untuk diff/rollback manual). Tidak
        mengantre RPC ke CPE — memakai nilai parameter yang sudah tersinkron.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Snapshot dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== WEBHOOKS ==============================
  /webhooks:
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Buat langganan webhook keluar
      description: |
        ADMIN/SUPERADMIN. `tenant_id` NULL (langganan global) hanya boleh
        SUPERADMIN; ADMIN wajib tenant sendiri. Response memuat `secret`
        plaintext **sekali** — dipakai untuk verifikasi signature HMAC payload,
        tidak bisa diambil ulang.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookRequest' }
      responses:
        '201':
          description: Langganan dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400':
          description: "`event_type`/`name`/`target_url` kosong, atau `event_type` tidak dikenal."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau `tenant_id` di luar scope actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: Daftar langganan webhook
      description: Semua role terautentikasi. Non-superadmin difilter ke tenant sendiri (+ langganan global).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar langganan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /webhooks/deliveries/failed-count:
    get:
      operationId: countFailedDeliveries
      tags: [Webhooks]
      summary: Jumlah delivery webhook berstatus FAILED (untuk badge/alert)
      description: Semua role terautentikasi, tenant-scoped. Dipakai frontend untuk indikator kesehatan integrasi.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jumlah delivery gagal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Detail satu langganan webhook
      description: Semua role terautentikasi, tenant-scoped. `secret` TIDAK dikembalikan.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/webhookIdPath'
      responses:
        '200':
          description: Detail langganan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Langganan milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Ubah langganan webhook
      description: |
        ADMIN/SUPERADMIN, tenant-scoped. `name` & `target_url` wajib diisi
        (bukan partial). `is_active` opsional (`null` = tidak diubah).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/webhookIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWebhookRequest' }
      responses:
        '204':
          description: Tersimpan.
        '400':
          description: "`id` tidak valid, atau `name`/`target_url` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau langganan milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /webhooks/{id}/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Kirim payload uji ke URL target langganan
      description: |
        ADMIN/SUPERADMIN, tenant-scoped. Mengantre satu delivery uji (payload
        contoh) dan mengembalikan baris delivery-nya untuk dipantau.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/webhookIdPath'
      responses:
        '202':
          description: Delivery uji diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau langganan milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: Log percobaan pengiriman untuk satu langganan
      description: Semua role terautentikasi, tenant-scoped ke langganan.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/webhookIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar delivery (terbaru dulu).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Langganan milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== FILES ==============================
  /files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload berkas generik ke object storage
      description: |
        ADMIN/SUPERADMIN. `multipart/form-data`. Di-scope ke tenant actor.
        Maksimum 256 MiB. `file_type` mengikuti kode TR-069 (`1 Firmware
        Upgrade Image`, `3 Vendor Configuration File`, dst.).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadFileRequest' }
      responses:
        '201':
          description: Berkas tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericFile' }
        '400':
          description: Bagian `file` hilang/invalid, atau file terlalu besar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listFiles
      tags: [Files]
      summary: Daftar berkas generik
      description: Semua role terautentikasi, tenant-scoped.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar berkas (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericFileListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Hapus berkas generik
      description: ADMIN/SUPERADMIN, tenant-scoped. Menghapus objek di storage + baris metadata.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/fileIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau berkas milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Berkas tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== TAGS ==============================
  /tags:
    post:
      operationId: createTag
      tags: [Tags]
      summary: Buat tag device
      description: ADMIN/SUPERADMIN. Tag otomatis di-scope ke tenant actor (`tenant_id` diisi dari actor, bukan body).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Tag dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400':
          description: Nama tag kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listTags
      tags: [Tags]
      summary: Daftar tag
      description: Semua role terautentikasi. Non-superadmin melihat tag tenant sendiri (+ tag global `tenant_id=NULL`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar tag (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tags/{id}:
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Hapus tag
      description: ADMIN/SUPERADMIN. Tag tenant lain → `403`. Penghapusan juga melepas semua penempelan `device_tags`-nya.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tagIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tags:
    get:
      operationId: listDeviceTags
      tags: [Tags]
      summary: Tag yang menempel pada satu device
      description: Semua role terautentikasi. Kepemilikan device divalidasi (tenant-scoped) sebelum menyentuh tag.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Daftar tag device (envelope `data` saja, tanpa pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
                required: [data]
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: assignDeviceTag
      tags: [Tags]
      summary: Tempelkan tag ke device
      description: |
        ADMIN/NOC/SUPERADMIN. Kepemilikan device DAN tag sama-sama divalidasi
        tenant-scoped (tag global boleh; tag tenant lain → `403`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignDeviceTagRequest' }
      responses:
        '204':
          description: Tag ditempelkan (idempoten).
        '400':
          description: "`id` tidak valid, atau `tag_id` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, device milik tenant lain, atau tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tags/{tagId}:
    delete:
      operationId: removeDeviceTag
      tags: [Tags]
      summary: Lepas tag dari device
      description: ADMIN/NOC/SUPERADMIN. Tenant-scoped di sisi device dan tag.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/deviceTagIdPath'
      responses:
        '204':
          description: Tag dilepas (no-op bila tidak menempel).
        '400':
          description: "`id`/`tagId` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device/tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== PRESETS ==============================
  /presets:
    post:
      operationId: createPreset
      tags: [Presets]
      summary: Buat preset provisioning
      description: |
        ADMIN/SUPERADMIN. Di-scope ke tenant actor. `precondition` dan
        `configurations` adalah string (ekspresi/JSON gaya GenieACS) —
        dievaluasi oleh engine preset, bukan divalidasi skema di sini.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePresetRequest' }
      responses:
        '201':
          description: Preset dibuat (selalu `is_active=true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '400':
          description: Nama preset kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listPresets
      tags: [Presets]
      summary: Daftar preset
      description: Semua role terautentikasi, tenant-scoped (+ preset global).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar preset (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /presets/{id}:
    patch:
      operationId: updatePreset
      tags: [Presets]
      summary: Ubah preset
      description: ADMIN/SUPERADMIN, tenant-scoped. FULL replace field skalar (kirim seluruh state).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/presetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePresetRequest' }
      responses:
        '200':
          description: Preset setelah diubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau preset milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Preset tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deletePreset
      tags: [Presets]
      summary: Hapus preset
      description: ADMIN/SUPERADMIN, tenant-scoped.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/presetIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau preset milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Preset tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== SELF-SERVICE (portal pelanggan) ==============================
  /self-service/devices:
    get:
      operationId: listMyDevices
      tags: [SelfService]
      summary: Device milik akun pelanggan ini
      description: |
        Role `ENDUSER` saja. Bukan RBAC tenant — di-scope ke baris `user_devices`
        (device yang dipetakan eksplisit ke akun). DTO sempit
        (`SelfServiceDevice`), bukan `Device` penuh.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar device pelanggan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfServiceDeviceListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan `ENDUSER`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}:
    get:
      operationId: getMyDevice
      tags: [SelfService]
      summary: Detail satu device pelanggan
      description: Role `ENDUSER`. `403` bila device tidak dipetakan ke akun ini.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Detail device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfServiceDevice' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device bukan milik akun ini (atau role bukan `ENDUSER`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}/wifi:
    patch:
      operationId: changeMyWiFi
      tags: [SelfService]
      summary: Ubah SSID/passphrase WiFi device sendiri
      description: |
        Role `ENDUSER`. Mengantre satu task `SET_PARAMETER_VALUES`. Minimal
        salah satu dari `ssid`/`passphrase` wajib diisi; passphrase (bila diisi)
        8–63 karakter (batas WPA-PSK). `band` kosong = terapkan ke 2.4G & 5G.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMyWiFiRequest' }
      responses:
        '202':
          description: Task perubahan WiFi diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` tidak valid, payload kosong, atau passphrase di luar 8–63 karakter."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device bukan milik akun ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}/reboot:
    post:
      operationId: rebootMyDevice
      tags: [SelfService]
      summary: Reboot device sendiri
      description: Role `ENDUSER`. Mengantre task `REBOOT`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '202':
          description: Task reboot diantre.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device bukan milik akun ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT sesi user (dari `POST /auth/login`) ATAU API token statis
        berawalan `acs_...` (dari `POST /auth/tokens`) — keduanya dikirim
        dengan cara yang sama lewat header `Authorization: Bearer <token>`.

  parameters:
    page:
      name: page
      in: query
      description: Halaman (1-based). Default 1.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: page_size
      in: query
      description: Ukuran halaman. Default 50, maksimum 200 (nilai di luar rentang ini jatuh ke default 50).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    tenantIdQuery:
      name: tenant_id
      in: query
      description: |
        Filter tenant. HANYA efektif untuk actor `SUPERADMIN` — actor role lain
        selalu dipaksa ke tenant miliknya sendiri, nilai ini diabaikan.
      schema: { type: integer, format: int64 }
    tenantIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal tenant.
      schema: { type: integer, format: int64 }
    userIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal user.
      schema: { type: integer, format: int64 }
    deviceIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal device.
      schema: { type: integer, format: int64 }
    taskIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal task.
      schema: { type: integer, format: int64 }
    profileIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal provisioning profile.
      schema: { type: integer, format: int64 }
    ztRuleIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal zero-touch rule.
      schema: { type: integer, format: int64 }
    vendorIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal vendor.
      schema: { type: integer, format: int64 }
    rolloutBatchIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal firmware rollout batch.
      schema: { type: integer, format: int64 }
    webhookIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal webhook subscription.
      schema: { type: integer, format: int64 }
    fileIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal file generik.
      schema: { type: integer, format: int64 }
    tagIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal tag.
      schema: { type: integer, format: int64 }
    presetIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal preset.
      schema: { type: integer, format: int64 }
    deviceTagIdPath:
      name: tagId
      in: path
      required: true
      description: ID numerik internal tag yang dilepas dari device.
      schema: { type: integer, format: int64 }

  schemas:
    # ---------- Generik ----------
    ErrorResponse:
      type: object
      description: |
        Bentuk error SERAGAM untuk seluruh endpoint (`echo.NewHTTPError`) —
        selalu `{"message": "..."}`, tidak ada kode error mesin terpisah dari
        `message` teks bebas saat ini (perhatikan: teks pesan sebagian besar
        Bahasa Indonesia, konsisten dengan gaya pesan aplikasi ini).
      properties:
        message:
          type: string
          example: "domain: data tidak ditemukan"
      required: [message]

    RefLookup:
      type: object
      description: Satu baris tabel referensi/enum generik (`ref_*`).
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ONLINE }
        name: { type: string, example: Online }
      required: [id, code, name]

    Audit:
      type: object
      description: 7 kolom audit standar yang dipakai hampir semua entitas master/transactional.
      properties:
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: integer, format: int64, nullable: true }
        is_deleted: { type: boolean }

    # ---------- Auth ----------
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        user:
          type: object
          properties:
            id: { type: integer, format: int64 }
            uuid: { type: string, format: uuid }
            username: { type: string }
            roles: { type: array, items: { type: string } }
            tenant_id: { type: integer, format: int64, nullable: true }
      required: [access_token, token_type, user]

    ChangeOwnPasswordRequest:
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
      required: [current_password, new_password]

    IssueAPITokenRequest:
      type: object
      properties:
        name: { type: string, description: Nama/label token untuk memudahkan identifikasi di masa depan. }
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: harus sama dengan tenant milik actor sendiri (atau dikosongkan agar default ke tenant actor)."
        expires_at: { type: string, format: date-time, nullable: true, description: "Kosongkan agar token tidak pernah kedaluwarsa." }
      required: [name]

    IssueAPITokenResponse:
      type: object
      description: "Nilai `token` PLAINTEXT hanya muncul di sini, SEKALI — tidak bisa diambil ulang lewat endpoint manapun setelahnya."
      properties:
        token: { type: string, example: "acs_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" }
        id: { type: integer, format: int64 }
        uuid: { type: string, format: uuid }
      required: [token, id, uuid]

    APIToken:
      type: object
      description: |
        Metadata satu API token (dari `GET /auth/tokens`). Nilai token
        PLAINTEXT tidak pernah ada di sini — hanya `token_hash` yang tersimpan
        di database, dan field itu sendiri disembunyikan dari response
        (`json:"-"` di Go, lihat domain/tenancy.go).
      properties:
        id: { type: integer, format: int64 }
        token_uuid: { type: string, format: uuid }
        user_id: { type: integer, format: int64, nullable: true, description: "User yang menerbitkan token ini." }
        tenant_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        scopes:
          type: object
          nullable: true
          description: "Belum ada jalur yang mengisi field ini (selalu `null` saat ini) — dicadangkan utk scope granular per-token di masa depan."
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true, description: "NULL berarti masih aktif." }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
      required: [id, token_uuid, name, created_at, updated_at]

    APITokenListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/APIToken' }
        total: { type: integer }
      required: [data, total]

    # ---------- Tenants ----------
    Tenant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        cwmp_inform_username:
          type: string
          nullable: true
          description: "Separuh dari shared secret Inform CWMP tenant ini. Separuh lainnya (password) TIDAK PERNAH diekspos di response manapun."
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true, example: "#1a73e8" }
        max_pending_tasks: { type: integer, nullable: true, description: "NULL berarti tidak dibatasi." }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, tenant_uuid, code, name, is_active]

    TenantListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Tenant' }
        total: { type: integer }
      required: [data, total]

    CurrentTenant:
      type: object
      description: DTO SEMPIT khusus `GET /tenants/current` — sengaja tidak mengikutkan `code`, `is_active`, `cwmp_inform_username`, atau kolom audit.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true }
      required: [id, name]

    CreateTenantRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        cwmp_inform_username: { type: string, nullable: true }
        cwmp_inform_password: { type: string, format: password, nullable: true, minLength: 16 }
      required: [code, name]

    SetTenantCWMPCredentialsRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 16 }
      required: [username, password]

    UpdateTenantBrandingRequest:
      type: object
      description: "FULL REPLACE — `null` eksplisit mengosongkan kolom terkait (bukan \"tidak diubah\")."
      properties:
        brand_name: { type: string, nullable: true, maxLength: 128 }
        logo_url: { type: string, nullable: true, format: uri, maxLength: 512, description: "Harus http/https valid." }
        primary_color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$' }

    SetTenantTaskQuotaRequest:
      type: object
      properties:
        max_pending_tasks:
          type: integer
          nullable: true
          description: "NULL berarti tidak dibatasi."

    UpdateTenantRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
        is_active: { type: boolean, nullable: true }

    # ---------- Users ----------
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL untuk superadmin lintas-tenant." }
        username: { type: string }
        email: { type: string, format: email }
        full_name: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, user_uuid, username, email, full_name, is_active, roles]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }
      required: [data, total]

    CreateUserRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: WAJIB sama dengan tenant miliknya sendiri."
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        full_name: { type: string }
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
          description: "Non-superadmin TIDAK BOLEH menyertakan `SUPERADMIN` (dicek case-insensitive). `ENDUSER` untuk akun portal self-service."
      required: [username, password]

    UpdateUserRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        full_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        is_active: { type: boolean, nullable: true, description: "Actor tidak bisa men-set `false` untuk akunnya sendiri (self-lockout guard)." }

    ResetUserPasswordRequest:
      type: object
      properties:
        new_password: { type: string, format: password, minLength: 8 }
      required: [new_password]

    ReplaceUserRolesRequest:
      type: object
      description: FULL REPLACE — role yang tidak disebut akan dicabut.
      properties:
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
      required: [role_codes]

    # ---------- Devices ----------
    Device:
      type: object
      description: |
        Inventory CPE. Kredensial (`connection_request_password`,
        `inform_password`) disimpan terenkripsi dan TIDAK PERNAH muncul di
        response ini. **Catatan:** `connection_request_username` MASIH
        dikembalikan di response (beda perlakuan dari passwordnya) — lihat
        catatan temuan di deskripsi endpoint terkait/laporan audit.
      properties:
        id: { type: integer, format: int64 }
        device_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        vendor_id: { type: integer, format: int64, nullable: true, description: "NULL bila belum ter-resolve dari OUI (device UNREGISTERED)." }
        device_model_id: { type: integer, format: int64, nullable: true }
        device_status_id: { type: integer, format: int64 }
        provisioning_profile_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true, example: "AABBCC" }
        serial_number: { type: string }
        product_class: { type: string, nullable: true }
        mac_address: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
        hardware_version: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        connection_request_url: { type: string, nullable: true }
        connection_request_username: { type: string, nullable: true }
        inform_username: { type: string, nullable: true }
        last_inform_at: { type: string, format: date-time, nullable: true }
        last_boot_event_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, device_uuid, device_status_id, serial_number]

    DeviceListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Device' }
        total: { type: integer }
      required: [data, total]

    DeviceStats:
      type: object
      properties:
        by_status:
          type: array
          nullable: true
          items:
            type: object
            properties:
              device_status_id: { type: integer, format: int64 }
              count: { type: integer }
        by_vendor:
          type: array
          nullable: true
          items:
            type: object
            properties:
              vendor_id: { type: integer, format: int64, nullable: true, description: "NULL berarti device yang belum ter-resolve vendor-nya." }
              count: { type: integer }

    UpdateDeviceRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        notes: { type: string, nullable: true }
        connection_request_url: { type: string, nullable: true }
        connection_request_username: { type: string, nullable: true }
        connection_request_password:
          type: string
          format: password
          nullable: true
          description: "Dienkripsi sebelum disimpan; tidak pernah dikembalikan lagi di response manapun."

    DeviceParameter:
      type: object
      description: Nilai parameter TR-069 terkini per device (EAV, hasil sinkronisasi GetParameterValues terakhir).
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        parameter_name: { type: string, example: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.ExternalIPAddress" }
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        writable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, device_id, parameter_name, writable]

    DeviceEvent:
      type: object
      description: "Histori event Inform CWMP — audit minimal (`created_at` saja, tanpa 7 kolom audit standar; TECH.md §11, tabel log volume tinggi)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64, nullable: true }
        event_code_id: { type: integer, format: int64 }
        command_key: { type: string, nullable: true }
        raw_payload: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, event_code_id, occurred_at]

    DeviceEventListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceEvent' }
        total: { type: integer }
      required: [data, total]

    DeviceOpticalMetric:
      type: object
      description: "Metrik optik GPON/EPON — audit minimal (TECH.md §11)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        rx_power_dbm: { type: number, format: double, nullable: true }
        tx_power_dbm: { type: number, format: double, nullable: true }
        voltage: { type: number, format: double, nullable: true }
        bias_current_ma: { type: number, format: double, nullable: true }
        temperature_celsius: { type: number, format: double, nullable: true }
        distance_meters: { type: number, format: double, nullable: true }
        recorded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, recorded_at]

    DeviceOpticalMetricListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceOpticalMetric' }
        total: { type: integer }
      required: [data, total]

    ActivityLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, nullable: true, description: "NULL untuk aksi sistem otomatis (mis. evaluasi Zero-Touch saat BOOTSTRAP)." }
        tenant_id: { type: integer, format: int64, nullable: true }
        action: { type: string, example: UPDATE_DEVICE }
        entity_type: { type: string, example: device }
        entity_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        username:
          type: string
          nullable: true
          description: "Hasil LEFT JOIN ke users, bukan kolom asli tabel — NULL bila `user_id` NULL atau user sudah dihapus."
      required: [id, action, entity_type, created_at]

    ActivityLogListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ActivityLog' }
        total: { type: integer }
      required: [data, total]

    # ---------- Tasks ----------
    Task:
      type: object
      description: |
        Satu item antrean RPC CWMP. `parameters` dan `response` bertipe
        `domain.JSONRawMessage` — di-emit sebagai **objek JSON apa adanya**
        (bukan string ter-base64-kan; asimetri base64 lama sudah diperbaiki,
        lihat log perubahan `ROADMAP.md` 2026-08-23). `response` bernilai
        `null` selama task belum selesai. Untuk role `NOC`/`VIEWER`, key
        `url`/`username`/`password` di dalam `parameters` di-redact jadi
        `"[redacted]"`.
      properties:
        id: { type: integer, format: int64 }
        task_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        task_type_id: { type: integer, format: int64 }
        task_status_id: { type: integer, format: int64 }
        priority: { type: integer, minimum: 1, maximum: 9, description: "1 = tertinggi, 9 = terendah." }
        parameters:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON parameter RPC (mis. daftar nama parameter, key-value SetParameterValues)."
        response:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON respons RPC dari CPE. `null` selama task belum selesai."
        error_message: { type: string, nullable: true }
        retry_count: { type: integer }
        max_retries: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, task_uuid, device_id, task_type_id, task_status_id, priority]

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Task' }
        total: { type: integer }
      required: [data, total]

    TaskStatusCount:
      type: object
      properties:
        task_status_id: { type: integer, format: int64 }
        count: { type: integer }
      required: [task_status_id, count]

    CreateTaskRequest:
      type: object
      description: "`parameters` di SINI adalah OBJEK JSON biasa (bukan base64) — lihat catatan asimetri di skema `Task`."
      properties:
        device_id: { type: integer, format: int64 }
        task_type:
          type: string
          description: "Kode `ref_task_types`, mis. `REBOOT`, `GET_PARAMETER_VALUES`, `SET_PARAMETER_VALUES`, `DOWNLOAD`, `FACTORY_RESET`."
          example: REBOOT
        priority: { type: integer, minimum: 0, maximum: 9, default: 5, description: "0 dikirim = pakai default 5." }
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        max_retries: { type: integer, minimum: 0, default: 3, description: "0 dikirim = pakai default 3." }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
      required: [device_id, task_type]

    # ---------- Provisioning ----------
    ProvisioningProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti profile global lintas tenant (hanya bisa dibuat/diedit superadmin)." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, profile_uuid, name, is_default, is_active]

    ProvisioningProfileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfile' }
        total: { type: integer }
      required: [data, total]

    ProvisioningProfileParameter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        parameter_name:
          type: string
          description: "Boleh logical key (mis. `wifi.5g.ssid`) ATAU raw path TR-069 — diresolve saat APPLY, bukan saat disimpan."
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        apply_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, profile_id, parameter_name, apply_order]

    ProvisioningProfileDetail:
      type: object
      description: "Response gabungan khusus `GET /provisioning-profiles/:id` — BUKAN `ProvisioningProfile` polos."
      properties:
        profile: { $ref: '#/components/schemas/ProvisioningProfile' }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfileParameter' }
      required: [profile, parameters]

    ProfileParameterInput:
      type: object
      properties:
        parameter_name: { type: string }
        parameter_value: { type: string, nullable: true }
        apply_order: { type: integer, default: 0 }
      required: [parameter_name]

    CreateProfileRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "NULL = profile global (superadmin only). Non-superadmin WAJIB isi dengan tenant miliknya sendiri."
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean, default: false }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ProfileParameterInput' }
      required: [name]

    UpdateProfileRequest:
      type: object
      description: "FULL update untuk field skalar (bukan partial — kirim seluruh state). `parameters` NULL/tidak dikirim = parameter lama TIDAK disentuh; array (termasuk kosong `[]`) = REPLACE seluruh parameter lama."
      properties:
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean }
        is_active: { type: boolean }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProfileParameterInput' }

    ZeroTouchRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti rule global lintas tenant." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true }
        serial_pattern: { type: string, nullable: true, description: "Pola SQL LIKE (`%`/`_`), dicocokkan case-insensitive." }
        software_version_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd devices.software_version (migrations/0009)." }
        match_parameter_name: { type: string, nullable: true, description: "Precondition opsional — device harus punya device_parameters dgn nama ini yang nilainya cocok match_parameter_value_pattern. Wajib berpasangan." }
        match_parameter_value_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd nilai parameter match_parameter_name. Wajib berpasangan." }
        provisioning_profile_id: { type: integer, format: int64, nullable: true, description: "NULLABLE sejak migrations/0009 — rule boleh hanya memicu reboot dan/atau firmware push." }
        post_apply_reboot: { type: boolean, description: "Jika true, enqueue task REBOOT setelah aksi lain diterapkan." }
        firmware_file_id: { type: integer, format: int64, nullable: true, description: "Jika diisi, enqueue task Download firmware ini ke device yang cocok." }
        trigger_event_id: { type: integer, format: int64, description: "FK ref_ztp_trigger_event — kapan rule dievaluasi (BOOTSTRAP_ONLY / BOOTSTRAP_OR_BOOT / EVERY_INFORM)." }
        priority: { type: integer, description: "Angka lebih kecil dievaluasi lebih dulu." }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, trigger_event_id, priority, is_active]

    ZeroTouchRuleRequest:
      type: object
      properties:
        tenant_id: { type: integer, format: int64, nullable: true }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true }
        serial_pattern: { type: string, nullable: true }
        software_version_pattern: { type: string, nullable: true }
        match_parameter_name: { type: string, nullable: true }
        match_parameter_value_pattern: { type: string, nullable: true }
        provisioning_profile_id: { type: integer, format: int64, nullable: true }
        post_apply_reboot: { type: boolean, default: false }
        firmware_file_id: { type: integer, format: int64, nullable: true }
        trigger_event_id: { type: integer, format: int64, description: "WAJIB. Ambil id dari GET /refs/ref_ztp_trigger_event." }
        priority: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
      required: [trigger_event_id]

    # ---------- Catalog ----------
    Vendor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ZTE }
        name: { type: string, example: ZTE Corporation }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, code, name, is_active]

    VendorListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Vendor' }
        total: { type: integer }
      required: [data, total]

    CreateVendorRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
      required: [code, name]

    VendorOUI:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        oui: { type: string, example: "AABBCC" }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, oui]

    AddVendorOUIRequest:
      type: object
      properties:
        oui: { type: string }
        notes: { type: string, nullable: true }
      required: [oui]

    DeviceModel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64, description: "Resolve ke `InternetGatewayDevice.*` (TR-098) atau `Device.*` (TR-181)." }
        product_class: { type: string, nullable: true }
        model_name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, device_type_id, data_model_version_id, model_name, is_active]

    CreateDeviceModelRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        product_class: { type: string, nullable: true }
        model_name: { type: string }
        description: { type: string, nullable: true }
      required: [vendor_id, device_type_id, data_model_version_id, model_name]

    VendorParameterMapping:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true, description: "NULL = berlaku untuk seluruh model vendor ini pada data model version tsb; diisi untuk override spesifik satu model." }
        software_version_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd devices.software_version (migrations/0010). NULL = generik lintas versi. Mapping dgn pattern yang cocok lebih diprioritaskan saat Resolve()." }
        logical_key: { type: string, example: wifi.5g.ssid }
        tr069_path: { type: string, example: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSID" }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, data_model_version_id, logical_key, tr069_path]

    UpsertVendorParameterMappingRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        software_version_pattern: { type: string, nullable: true }
        logical_key: { type: string }
        tr069_path: { type: string }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
      required: [vendor_id, data_model_version_id, logical_key, tr069_path]

    # ---------- Firmware ----------
    FirmwareFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firmware_uuid: { type: string, format: uuid }
        vendor_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        version: { type: string }
        file_name: { type: string }
        storage_key:
          type: string
          description: "Object key di object storage (MinIO/S3-compatible) — BUKAN URL. Presigned GET URL digenerate on-demand terpisah (lihat `POST /devices/:id/firmware-upgrade`), tidak pernah disimpan/diekspos langsung di sini."
        file_size_bytes: { type: integer, format: int64, nullable: true }
        checksum_sha256: { type: string, nullable: true, description: "Selalu dihitung ulang di server saat upload, tidak pernah dipercaya dari client." }
        release_notes: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, firmware_uuid, vendor_id, version, file_name, storage_key, is_active]

    FirmwareFileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareFile' }
        total: { type: integer }
      required: [data, total]

    UploadFirmwareRequest:
      type: object
      description: "`multipart/form-data` — bukan JSON."
      properties:
        vendor_id: { type: string, description: "Numerik, dikirim sebagai form field teks (bukan JSON number)." }
        device_model_id: { type: string, nullable: true, description: "Opsional, numerik sebagai teks." }
        version: { type: string }
        release_notes: { type: string, nullable: true }
        file:
          type: string
          format: binary
          description: "Isi file firmware. Maksimum 256 MiB."
      required: [vendor_id, version, file]

    ScheduleFirmwareUpgradeRequest:
      type: object
      properties:
        firmware_id: { type: integer, format: int64 }
        scheduled_at: { type: string, format: date-time, nullable: true }
      required: [firmware_id]

    FirmwareUpgradeJob:
      type: object
      description: "TIDAK memakai 7 kolom audit standar (tidak ada soft-delete pada entitas ini) — hanya `created_at/by` + `updated_at/by`."
      properties:
        id: { type: integer, format: int64 }
        job_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        firmware_id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64, nullable: true }
        task_status_id: { type: integer, format: int64 }
        from_version: { type: string, nullable: true }
        to_version: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
      required: [id, job_uuid, device_id, firmware_id, task_status_id]

    FirmwareUpgradeJobListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareUpgradeJob' }
        total: { type: integer }
      required: [data, total]

    FirmwareRolloutBatch:
      type: object
      description: "Rencana canary/staged rollout firmware ke populasi device bertahap per wave (migrations/0011). Status via `ref_firmware_rollout_status` (PENDING / IN_PROGRESS / PAUSED_FAILURE_THRESHOLD / COMPLETED / CANCELLED — ambil label via `GET /refs/ref_firmware_rollout_status`)."
      properties:
        id: { type: integer, format: int64 }
        batch_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = rollout lintas-tenant/global." }
        firmware_file_id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64, nullable: true, description: "Kriteria seleksi populasi target." }
        device_model_id: { type: integer, format: int64, nullable: true, description: "Kriteria seleksi populasi target." }
        wave_percentage: { type: integer, description: "Persentase populasi asli per wave (1-100)." }
        max_failure_rate_percent: { type: integer, description: "Ambang failure rate per wave (%) sebelum batch di-PAUSE otomatis." }
        current_wave: { type: integer, description: "Wave terakhir yang sudah/sedang dijalankan." }
        status_id: { type: integer, format: int64 }
        notes: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, batch_uuid, firmware_file_id, wave_percentage, max_failure_rate_percent, current_wave, status_id]

    FirmwareRolloutBatchListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareRolloutBatch' }
        total: { type: integer }
      required: [data, total]

    CreateRolloutBatchRequest:
      type: object
      properties:
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL (global) hanya boleh dibuat SUPERADMIN." }
        firmware_file_id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        wave_percentage: { type: integer, minimum: 1, maximum: 100, default: 10 }
        max_failure_rate_percent: { type: integer, minimum: 0, maximum: 100, default: 10 }
        notes: { type: string, nullable: true }
      required: [firmware_file_id]

    # ---------- Diagnostics ----------
    DeviceDiagnostic:
      type: object
      description: "`result` bertipe `domain.JSONRawMessage` — objek JSON apa adanya (bukan base64), `null` selama diagnostic belum selesai."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64, nullable: true }
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        result:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON hasil diagnostic (mis. hasil ping/traceroute/WiFi scan). `null` sampai CPE mengirim event `8 DIAGNOSTICS COMPLETE`."
        executed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, device_id, diagnostic_type, status, created_at]

    DeviceDiagnosticListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceDiagnostic' }
        total: { type: integer }
      required: [data, total]

    TriggerDiagnosticRequest:
      type: object
      properties:
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        parameters:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: "Map logical key/raw TR-069 path -> nilai yang di-set untuk menjalankan diagnostic (mis. `{\"InternetGatewayDevice.IPPingDiagnostics.Host\": \"8.8.8.8\"}`)."
      required: [diagnostic_type]

    # ---------- Generik tambahan ----------
    CountResponse:
      type: object
      description: "Envelope `{ \"count\": <int> }` yang dipakai beberapa endpoint agregat sederhana."
      properties:
        count: { type: integer }
      required: [count]

    MessageResponse:
      type: object
      description: "Envelope `{ \"message\": \"...\" }` untuk aksi asinkron yang tidak mengembalikan resource."
      properties:
        message: { type: string }
      required: [message]

    # ---------- Device config snapshots (migrations/0014) ----------
    DeviceConfigSnapshot:
      type: object
      description: "Snapshot seluruh `device_parameters` device pada satu titik waktu — audit minimal (`created_at` saja)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        snapshot_data:
          type: object
          additionalProperties: true
          description: "Objek JSON key-value parameter TR-069 saat snapshot diambil."
        created_at: { type: string, format: date-time }
      required: [id, device_id, created_at]

    DeviceConfigSnapshotListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceConfigSnapshot' }
        total: { type: integer }
      required: [data, total]

    # ---------- Webhooks (migrations/0013) ----------
    WebhookSubscription:
      type: object
      description: |
        Langganan satu jenis event pada satu URL. `secret` (HMAC) hanya muncul
        di response `POST /webhooks`, sekali — kolom DB `secret_enc` terenkripsi
        AES-GCM dan tidak pernah dikembalikan lagi.
      properties:
        id: { type: integer, format: int64 }
        subscription_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = langganan global (SUPERADMIN)." }
        event_type_id: { type: integer, format: int64 }
        name: { type: string }
        target_url: { type: string, format: uri }
        is_active: { type: boolean }
        description: { type: string, nullable: true }
        secret: { type: string, description: "HANYA pada response create. Hex 64 karakter.", nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, subscription_uuid, event_type_id, name, target_url, is_active]

    WebhookSubscriptionListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        total: { type: integer }
      required: [data, total]

    CreateWebhookRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "NULL (global) hanya SUPERADMIN. Non-superadmin: harus tenant sendiri."
        event_type:
          type: string
          enum: [DEVICE_FAULT, PARAMETER_VALUE_CHANGE, TASK_FAILED]
          description: "Kode `ref_webhook_event_types` yang sudah di-wire di usecase."
        name: { type: string }
        target_url: { type: string, format: uri }
        description: { type: string, nullable: true }
      required: [event_type, name, target_url]

    UpdateWebhookRequest:
      type: object
      description: "`name` & `target_url` WAJIB (bukan partial). `is_active`/`description` opsional (`null` = tidak diubah)."
      properties:
        name: { type: string }
        target_url: { type: string, format: uri }
        is_active: { type: boolean, nullable: true }
        description: { type: string, nullable: true }
      required: [name, target_url]

    WebhookDelivery:
      type: object
      description: "Satu percobaan pengiriman satu event ke satu langganan — tabel log volume tinggi, audit minimal."
      properties:
        id: { type: integer, format: int64 }
        delivery_uuid: { type: string, format: uuid }
        subscription_id: { type: integer, format: int64 }
        event_type_id: { type: integer, format: int64 }
        payload:
          type: object
          additionalProperties: true
          description: "Objek JSON payload event yang dikirim."
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        response_status: { type: integer, nullable: true, description: "HTTP status dari URL target pada percobaan terakhir." }
        error_message: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, delivery_uuid, subscription_id, event_type_id, status, attempt_count, max_attempts, created_at, updated_at]

    WebhookDeliveryListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/WebhookDelivery' }
        total: { type: integer }
      required: [data, total]

    # ---------- Files generik (migrations/0018) ----------
    GenericFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        file_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        file_type:
          type: string
          description: "Kode TR-069 file type."
          example: "3 Vendor Configuration File"
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        version: { type: string, nullable: true }
        file_name: { type: string }
        storage_key: { type: string, description: "Object key di storage — BUKAN URL." }
        file_size_bytes: { type: integer, format: int64 }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, file_uuid, file_type, file_name, storage_key, file_size_bytes]

    GenericFileListResponse:
      type: object
      description: "Envelope `data` + `meta` (bukan `total` datar) — konsisten dgn handler tag/preset/file."
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/GenericFile' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    UploadFileRequest:
      type: object
      description: "`multipart/form-data` — semua field numerik dikirim sebagai teks."
      properties:
        file: { type: string, format: binary, description: "Isi berkas. Maksimum 256 MiB." }
        file_type: { type: string, example: "3 Vendor Configuration File" }
        file_name: { type: string, nullable: true, description: "Default: nama file asli dari multipart." }
        version: { type: string, nullable: true }
        vendor_id: { type: string, nullable: true }
        device_model_id: { type: string, nullable: true }
      required: [file]

    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [total, page, limit]

    # ---------- Tags (migrations/0019) ----------
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = tag global." }
