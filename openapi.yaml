            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: Log percobaan pengiriman untuk satu langganan
      description: Semua role terautentikasi, tenant-scoped ke langganan.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/webhookIdPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar delivery (terbaru dulu).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryListResponse' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Langganan milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Langganan tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== FILES ==============================
  /files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload berkas generik ke object storage
      description: |
        ADMIN/SUPERADMIN. `multipart/form-data`. Di-scope ke tenant actor.
        Maksimum 256 MiB. `file_type` mengikuti kode TR-069 (`1 Firmware
        Upgrade Image`, `3 Vendor Configuration File`, dst.).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadFileRequest' }
      responses:
        '201':
          description: Berkas tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericFile' }
        '400':
          description: Bagian `file` hilang/invalid, atau file terlalu besar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listFiles
      tags: [Files]
      summary: Daftar berkas generik
      description: Semua role terautentikasi, tenant-scoped.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar berkas (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericFileListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Hapus berkas generik
      description: ADMIN/SUPERADMIN, tenant-scoped. Menghapus objek di storage + baris metadata.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/fileIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau berkas milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Berkas tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== TAGS ==============================
  /tags:
    post:
      operationId: createTag
      tags: [Tags]
      summary: Buat tag device
      description: ADMIN/SUPERADMIN. Tag otomatis di-scope ke tenant actor (`tenant_id` diisi dari actor, bukan body).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Tag dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400':
          description: Nama tag kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listTags
      tags: [Tags]
      summary: Daftar tag
      description: Semua role terautentikasi. Non-superadmin melihat tag tenant sendiri (+ tag global `tenant_id=NULL`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar tag (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tags/{id}:
    patch:
      operationId: updateTag
      tags: [Tags]
      summary: Ubah tag (nama, warna)
      description: |
        ADMIN/SUPERADMIN. Partial update; `color` berisi string kosong = dikosongkan. Tag milik tenant lain → `403`. Tag **global** (tanpa tenant) hanya boleh diubah superadmin. Minimal satu field harus diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tagIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTagRequest' }
      responses:
        '200':
          description: Data setelah diperbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400':
          description: "`id`/payload tidak valid, tidak ada field yang diisi, atau panjang melebihi batas kolom."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Role di bawah ADMIN, tag milik tenant lain, atau tag global dimutasi non-superadmin."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Tag tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Nama bentrok dengan tag lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Hapus tag
      description: ADMIN/SUPERADMIN. Tag tenant lain → `403`. Tag **global** (tanpa tenant) hanya boleh dihapus superadmin. Penghapusan juga melepas semua penempelan `device_tags`-nya.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tagIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tags:
    get:
      operationId: listDeviceTags
      tags: [Tags]
      summary: Tag yang menempel pada satu device
      description: Semua role terautentikasi. Kepemilikan device divalidasi (tenant-scoped) sebelum menyentuh tag.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Daftar tag device (envelope `data` saja, tanpa pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
                required: [data]
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: assignDeviceTag
      tags: [Tags]
      summary: Tempelkan tag ke device
      description: |
        ADMIN/NOC/SUPERADMIN. Kepemilikan device DAN tag sama-sama divalidasi
        tenant-scoped (tag global boleh; tag tenant lain → `403`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignDeviceTagRequest' }
      responses:
        '204':
          description: Tag ditempelkan (idempoten).
        '400':
          description: "`id` tidak valid, atau `tag_id` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, device milik tenant lain, atau tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tags/{tagId}:
    delete:
      operationId: removeDeviceTag
      tags: [Tags]
      summary: Lepas tag dari device
      description: ADMIN/NOC/SUPERADMIN. Tenant-scoped di sisi device dan tag.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/deviceTagIdPath'
      responses:
        '204':
          description: Tag dilepas (no-op bila tidak menempel).
        '400':
          description: "`id`/`tagId` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device/tag milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau tag tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== PRESETS ==============================
  /presets:
    post:
      operationId: createPreset
      tags: [Presets]
      summary: Buat preset provisioning
      description: |
        ADMIN/SUPERADMIN. Di-scope ke tenant actor. `precondition` dan
        `configurations` adalah string (ekspresi/JSON gaya GenieACS) —
        dievaluasi oleh engine preset, bukan divalidasi skema di sini.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePresetRequest' }
      responses:
        '201':
          description: Preset dibuat (selalu `is_active=true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '400':
          description: Nama preset kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listPresets
      tags: [Presets]
      summary: Daftar preset
      description: Semua role terautentikasi, tenant-scoped (+ preset global).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar preset (envelope `data` + `meta`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /presets/{id}:
    get:
      operationId: getPreset
      tags: [Presets]
      summary: Detail satu preset
      description: |
        Semua role terautentikasi. Preset milik tenant sendiri atau preset global (tanpa tenant) boleh dibaca; preset tenant lain → `403`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/presetIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Preset milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Preset tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updatePreset
      tags: [Presets]
      summary: Ubah preset
      description: ADMIN/SUPERADMIN, tenant-scoped. FULL replace field skalar (kirim seluruh state). Preset **global** (tanpa tenant, berlaku untuk device semua tenant) hanya boleh diubah superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/presetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePresetRequest' }
      responses:
        '200':
          description: Preset setelah diubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau preset milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Preset tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deletePreset
      tags: [Presets]
      summary: Hapus preset
      description: ADMIN/SUPERADMIN, tenant-scoped. Preset **global** (tanpa tenant) hanya boleh dihapus superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/presetIdPath'
      responses:
        '204':
          description: Terhapus.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau preset milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Preset tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== NOTIFIKASI ==============================
  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: Daftar notifikasi milik pengguna yang login
      description: |
        Hanya notifikasi MILIK pengguna pemanggil (tidak ada cara membaca milik orang lain), terbaru dulu.
        Role staf (SUPERADMIN/ADMIN/NOC/VIEWER); `ENDUSER` ditolak **403**. Tiap item memakai `id` = UUID
        notifikasi (PK numerik tidak pernah diekspos). `title`/`body` adalah **teks biasa**, bukan HTML —
        klien wajib merendernya sebagai teks. `meta.unread` selalu jumlah belum-dibaca seluruhnya (tidak
        terpengaruh filter `unread`). `link` adalah path internal Console (mis. `/devices`), bisa `null`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unread
          in: query
          description: "`true` = hanya yang belum dibaca."
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar notifikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan staf (mis. `ENDUSER`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      tags: [Notifications]
      summary: Jumlah notifikasi belum dibaca (untuk badge lonceng)
      description: Milik pengguna pemanggil. Murah (satu query terindeks) — aman dipakai polling ringan. Pembaruan realtime juga datang lewat WebSocket (event `NOTIFICATION`).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jumlah belum dibaca.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan staf (mis. `ENDUSER`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [Notifications]
      summary: Tandai notifikasi sebagai sudah dibaca
      description: |
        Isi `all: true` (semua milik pemanggil) ATAU `ids` (UUID notifikasi, maks 200). UUID milik pengguna lain
        atau yang tidak ada **diabaikan diam-diam** (tidak membocorkan keberadaan). Idempoten. Ditolak **403**
        selama sesi impersonate (jejak peringatan keamanan target tidak boleh dihapus oleh operator).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '204':
          description: Selesai (tanpa isi).
        '400':
          description: "Bukan `all` dan `ids` kosong, lebih dari 200 id, atau ada id yang bukan UUID."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan staf, atau sesi impersonate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /notifications/preferences:
    get:
      operationId: listNotificationPreferences
      tags: [Notifications]
      summary: Pengaturan kanal notifikasi per jenis (efektif)
      description: |
        Satu baris per jenis notifikasi. Nilai yang ditampilkan sudah efektif: bawaan jenis bila pengguna belum
        pernah menyimpan pilihan. Jenis `mandatory: true` (mis. `SECURITY_ALERT`) selalu `in_app` dan `email`
        aktif dan tidak bisa dimatikan. Kanal email hanya berlaku bila SMTP dikonfigurasi di server.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar pengaturan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan staf (mis. `ENDUSER`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Simpan pengaturan kanal notifikasi
      description: |
        Hanya jenis yang disebut di `items` yang diubah. Permintaan **atomik**: bila ada jenis tak dikenal atau
        ada upaya mematikan jenis `mandatory` (`in_app` atau `email` = false), seluruh permintaan ditolak **400**
        dan tidak ada yang tersimpan. Ditolak **403** selama sesi impersonate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' }
      responses:
        '204':
          description: Tersimpan.
        '400':
          description: "`items` kosong/terlalu banyak (maks 100), jenis tak dikenal, atau mencoba mematikan jenis wajib."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan staf, atau sesi impersonate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /notifications/announce:
    post:
      operationId: announceNotification
      tags: [Notifications]
      summary: Siarkan pengumuman ke staf (SUPERADMIN)
      description: |
        SUPERADMIN saja. Penerima = semua staf aktif (SUPERADMIN/ADMIN/NOC/VIEWER, **bukan** `ENDUSER`) dari
        `tenant_id` yang dipilih, atau seluruh platform bila `tenant_id` kosong. `email: true` juga mengirim
        email (bila SMTP aktif; dibatasi 1 email per pengguna per jenis per jam). `link` harus path internal:
        diawali `/`, tanpa `//`, backslash, skema, atau spasi. Maks 10 pengumuman per jam per aktor. Isi
        pengumuman di-escape di email dan diperlakukan sebagai teks biasa di JSON. Tercatat di audit trail.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnounceRequest' }
      responses:
        '202':
          description: Diterima; `recipients` = jumlah penerima yang dibuatkan notifikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnounceResponse' }
        '400':
          description: "Judul/isi kosong atau melebihi batas (160/1000 karakter), karakter kontrol, `link` tidak valid, atau `tenant_id` tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN (atau sesi impersonate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Batas 10 pengumuman per jam per aktor terlampaui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== BILLING (langganan SaaS — Xendit) ==============================
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [Billing]
      summary: Daftar paket langganan
      description: |
        Semua staf (SUPERADMIN/ADMIN/NOC/VIEWER) boleh membaca; `ENDUSER` → `403`. Non-SUPERADMIN hanya melihat paket **aktif**;
        SUPERADMIN melihat semua (termasuk nonaktif). Urut `sort_order`. Harga selalu bilangan bulat rupiah; `max_devices: null`
        = perangkat tak dibatasi.

        **Seed contoh** (`STARTER`, `BUSINESS`, `ENTERPRISE`) hanyalah placeholder yang HARUS disesuaikan pemilik produk
        sebelum billing diaktifkan di produksi.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar paket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BillingPlan' }
                required: [data]
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role `ENDUSER`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createBillingPlan
      tags: [Billing]
      summary: Buat paket langganan (SUPERADMIN)
      description: |
        SUPERADMIN saja. Validasi ketat: `code` dinormalisasi ke huruf besar lalu harus `^[A-Z][A-Z0-9_]{1,31}$`; `name` 2–64
        karakter; `description` ≤ 255; `price_idr` bilangan bulat 0–1.000.000.000; `max_devices` kosong/`null` (tak dibatasi) atau
        1–10.000.000; `period_days` 1–366 (bawaan 30). Karakter kontrol ditolak; field tak dikenal ditolak; body maks 16 KiB.
        Tercatat di audit trail (`BILLING_PLAN_CREATED`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillingPlanRequest' }
      responses:
        '201':
          description: Paket dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPlan' }
        '400':
          description: Validasi gagal (kode, nama, harga pecahan/negatif, rentang, karakter kontrol, field tak dikenal).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Kode paket sudah ada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Body melebihi 16 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/plans/{code}:
    patch:
      operationId: updateBillingPlan
      tags: [Billing]
      summary: Ubah paket langganan (SUPERADMIN)
      description: |
        SUPERADMIN saja. Semua field opsional; `max_devices: null` = tak dibatasi, field tidak dikirim = tak berubah. Kode paket
        tidak dapat diubah. **Perubahan hanya berlaku untuk invoice BARU** — nominal dan periode invoice yang sudah dibuat
        tersalin di invoice dan tidak berubah; tenant yang sudah berlangganan tidak ikut diubah batasnya sampai pembayaran
        berikutnya. Tercatat di audit trail (`BILLING_PLAN_UPDATED`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          description: Kode paket (tidak peka huruf besar/kecil).
          schema: { type: string, minLength: 2, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBillingPlanRequest' }
      responses:
        '200':
          description: Paket setelah diubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPlan' }
        '400':
          description: Validasi gagal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Paket tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteBillingPlan
      tags: [Billing]
      summary: Hapus paket langganan (SUPERADMIN)
      description: |
        SUPERADMIN saja. Soft delete: paket hilang dari katalog, riwayat invoice tetap utuh. **Ditolak `409`** selama paket masih
        dipakai tenant atau punya invoice menunggu pembayaran — nonaktifkan saja (`is_active=false`) bila hanya ingin menutup
        penjualan. Kode paket yang sudah dihapus tidak dapat dipakai lagi. Tercatat di audit trail (`BILLING_PLAN_DELETED`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          description: Kode paket (tidak peka huruf besar/kecil).
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '204':
          description: Paket dihapus.
        '400':
          description: Kode paket tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Paket tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Paket masih dipakai tenant atau punya invoice menunggu pembayaran.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [Billing]
      summary: Status langganan tenant
      description: |
        Semua staf boleh membaca (NOC/VIEWER juga). Tenant = tenant actor; SUPERADMIN **wajib** `tenant_id`; ADMIN/NOC/VIEWER
        dengan `tenant_id` tenant lain → `403`. `enabled=false` bila pembayaran dimatikan (`ACS_BILLING_ENABLED`).
        `status`: `NONE` (belum pernah berlangganan), `ACTIVE`, `EXPIRED`. `days_left` dibulatkan ke atas (0 bila `EXPIRED`,
        `null` bila `NONE`). `pending_invoice` (memuat `payment_url`) hanya untuk ADMIN/SUPERADMIN; peran lain selalu `null`.

        **Tidak ada pemutusan layanan otomatis** saat langganan berakhir — hanya status `EXPIRED` dan notifikasi; kebijakannya
        keputusan pemilik produk.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          description: ID tenant (wajib untuk SUPERADMIN; angka desimal positif, selain itu `400`).
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Status langganan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '400':
          description: "`tenant_id` tidak valid, atau SUPERADMIN tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role `ENDUSER` atau `tenant_id` milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/checkout:
    post:
      operationId: billingCheckout
      tags: [Billing]
      summary: Buat invoice pembayaran (checkout)
      description: |
        ADMIN tenant sendiri atau SUPERADMIN (wajib `tenant_id`). Sesi impersonate sebagai ADMIN juga boleh (membuat invoice
        bukan aksi sensitif; audit memuat `impersonated_by`). **Nominal HANYA dari DB** (harga paket aktif) — klien hanya
        mengirim `plan_code`; field `amount`/`price_idr` pada body ditolak `400`.

        Idempoten: bila sudah ada invoice `PENDING` yang belum kedaluwarsa untuk paket yang sama, invoice itu dikembalikan
        (tidak membuat ganda). Maks **5** invoice `PENDING` per tenant. `payment_url` divalidasi (https + host `xendit.co`)
        sebelum disimpan/dikirim. Bila gateway gagal, invoice ditandai `FAILED` dan klien menerima `502` umum (tanpa detail
        gateway). Bawaan fitur MATI → `409`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingCheckoutRequest' }
      responses:
        '201':
          description: Invoice (baru atau yang masih berlaku) beserta URL bayar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingCheckoutResponse' }
        '400':
          description: Body/`plan_code` tidak valid, paket tidak ada/nonaktif/gratis, field tak dikenal, atau SUPERADMIN tanpa `tenant_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau `tenant_id` milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Pembayaran belum diaktifkan di server, atau tenant tidak aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Body melebihi 16 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Sudah ada 5 invoice `PENDING`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Gateway pembayaran tidak tersedia/ditolak (pesan umum; invoice ditandai `FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [Billing]
      summary: Daftar invoice langganan
      description: |
        ADMIN (tenant sendiri) dan SUPERADMIN (semua tenant bila `tenant_id` kosong). NOC/VIEWER/ENDUSER → `403`. Terbaru dulu.
        `payment_url` hanya terisi untuk invoice `PENDING` yang belum kedaluwarsa. Id invoice = `invoice_uuid`; id numerik
        dan id gateway tidak pernah diekspos.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          description: Hanya efektif untuk SUPERADMIN; ADMIN dengan tenant lain → `403`. Angka desimal positif, selain itu `400`.
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Halaman invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BillingInvoice' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                    required: [total, page, limit]
                required: [data, meta]
        '400':
          description: "`tenant_id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau `tenant_id` milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/invoices/{uuid}/sync:
    post:
      operationId: syncBillingInvoice
      tags: [Billing]
      summary: Periksa status invoice ke gateway ("Periksa status")
      description: |
        ADMIN tenant pemilik atau SUPERADMIN. Mengambil status terbaru dari gateway lalu menerapkannya lewat jalur yang sama dengan
        callback (termasuk perpanjangan langganan bila ternyata sudah lunas) — untuk kasus callback terlambat. Maks 1 panggilan
        per invoice per 10 detik. Invoice milik tenant lain → `404` (keberadaannya tidak dibocorkan).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          description: Id invoice (UUID kanonik).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invoice setelah sinkronisasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingInvoice' }
        '400':
          description: Id bukan UUID kanonik.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Invoice tidak ditemukan atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Pembayaran belum diaktifkan di server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Disinkronkan kurang dari 10 detik yang lalu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Gateway pembayaran tidak tersedia (pesan umum).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /billing/xendit/webhook:
    post:
      operationId: xenditWebhook
      tags: [Billing]
      summary: Callback invoice Xendit (publik, server-ke-server)
      description: |
        **PUBLIK (tanpa Bearer)** — dipanggil oleh Xendit, bukan oleh klien API. Keamanan: header **`X-CALLBACK-TOKEN`** harus sama
        dengan `ACS_XENDIT_CALLBACK_TOKEN` (dibandingkan waktu-konstan; salah → `401` tanpa efek). Isi payload **tidak
        dipercaya**: setelah token cocok, server mengambil ulang status dan nominal invoice dari gateway
        (`GET /v2/invoices/{id}`) dan hanya melunasi bila `external_id` dan `amount` cocok dengan invoice kita. `PAID` dan
        `SETTLED` dianggap lunas; `EXPIRED` menandai invoice kedaluwarsa.

        Idempoten: callback ganda/paralel hanya memperpanjang langganan **sekali** (`billing_webhook_events` + transisi status
        atomik). Perpanjangan: `plan_expires_at = max(sekarang, masa berlaku saat ini) + period_days`; `tenants.max_devices`
        mengikuti paket. Invoice tak dikenal → `200` tanpa efek (keberadaan tidak dibocorkan). Respons sukses selalu seragam;
        galat sistem/gateway menghasilkan `5xx` agar Xendit mengulang.

        Pembatasan: body maks 64 KiB; laju 20 permintaan/detik per IP. Billing dimatikan → `404`.
      security: []
      parameters:
        - name: X-CALLBACK-TOKEN
          in: header
          required: true
          description: Token verifikasi callback yang diatur di dashboard Xendit (rahasia; tidak pernah dicatat di log).
          schema: { type: string, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/XenditWebhookPayload' }
      responses:
        '200':
          description: Diterima (juga untuk invoice tak dikenal / duplikat — respons seragam).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
        '400':
          description: Payload bukan JSON objek yang valid (token sudah cocok).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Header `X-CALLBACK-TOKEN` tidak ada atau salah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Pembayaran dimatikan (`ACS_BILLING_ENABLED=false`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Body melebihi 64 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Melebihi 20 permintaan/detik dari IP yang sama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Gateway tidak dapat dihubungi saat verifikasi — Xendit akan mengulang callback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== SELF-SERVICE (portal pelanggan) ==============================
  /self-service/devices:
    get:
      operationId: listMyDevices
      tags: [SelfService]
      summary: Device milik akun pelanggan ini
      description: |
        Role `ENDUSER` saja (`RequireRoles(ENDUSER)`). Bukan RBAC tenant —
        di-scope ke baris `user_devices` (device yang dipetakan eksplisit ke
        akun). DTO sempit (`SelfServiceDevice`), bukan `Device` penuh.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daftar device pelanggan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfServiceDeviceListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan `ENDUSER`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}:
    get:
      operationId: getMyDevice
      tags: [SelfService]
      summary: Detail satu device pelanggan
      description: |
        Role `ENDUSER` (`RequireRoles(ENDUSER)`). Device yang TIDAK dipetakan
        ke akun ini mengembalikan **`404`, bukan `403`** — disengaja di
        `selfservice.requireOwnership` supaya keberadaan device milik pelanggan
        lain tidak bisa dienumerasi.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Detail device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfServiceDevice' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan `ENDUSER`, atau token tanpa `user_id` (mis. API token mesin).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan ATAU tidak dipetakan ke akun ini (sengaja tidak dibedakan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}/wifi:
    patch:
      operationId: changeMyWiFi
      tags: [SelfService]
      summary: Ubah SSID/passphrase WiFi device sendiri
      description: |
        Role `ENDUSER` (`RequireRoles(ENDUSER)`). Mengantre satu task
        `SET_PARAMETER_VALUES` berisi logical key WiFi yang di-resolve per
        vendor. Minimal salah satu dari `ssid`/`passphrase` wajib diisi (dicek
        setelah `TrimSpace`); passphrase (bila diisi) 8–63 karakter (batas
        WPA-PSK). Device yang tidak dipetakan ke akun ini → `404`, bukan `403`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMyWiFiRequest' }
      responses:
        '202':
          description: Task perubahan WiFi diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` tidak valid, `ssid` & `passphrase` sama-sama kosong, passphrase di luar 8–63 karakter, atau `band` di luar nilai yang dikenal."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan `ENDUSER`, atau token tanpa `user_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan ATAU tidak dipetakan ke akun ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /self-service/devices/{id}/reboot:
    post:
      operationId: rebootMyDevice
      tags: [SelfService]
      summary: Reboot device sendiri
      description: |
        Role `ENDUSER` (`RequireRoles(ENDUSER)`). Mengantre task `REBOOT`.
        Device yang tidak dipetakan ke akun ini → `404`, bukan `403`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '202':
          description: Task reboot diantre — TANPA body (`204`-style no content pada status `202`).
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role bukan `ENDUSER`, atau token tanpa `user_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan ATAU tidak dipetakan ke akun ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/menu-layout:
    get:
      operationId: getMenuLayout
      tags: [Console]
      summary: Susunan menu sidebar milik pengguna yang login
      description: |
        Hanya layout MILIK pemanggil (tidak ada parameter pemilik — tidak ada cara membaca layout orang lain, termasuk
        oleh `SUPERADMIN`). `layout: null` = belum pernah diatur (Console memakai susunan bawaan). Semua peran masuk.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Layout atau `null`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuLayoutResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: putMenuLayout
      tags: [Console]
      summary: Simpan susunan menu sidebar (urutan, sub menu, item disembunyikan)
      description: |
        Mengganti layout milik pemanggil. Divalidasi ketat: maks 8 KB, ≤60 simpul tingkat atas, ≤12 grup, ≤40 item
        per grup, kedalaman 2 (grup → item), kunci `^[a-z][a-z0-9._-]{0,47}$` tanpa duplikat, nama grup 1–32 karakter
        tanpa karakter kontrol, bidang tak dikenal ditolak. Hak akses menu TIDAK ditentukan layout (tetap oleh peran).
        Ditolak **403** dalam sesi impersonate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuLayout' }
      responses:
        '200':
          description: Layout tersimpan (ternormalisasi).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuLayoutResponse' }
        '400':
          description: Bentuk/ukuran layout tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Sesi impersonate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Payload melebihi 9 KB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: resetMenuLayout
      tags: [Console]
      summary: Kembalikan menu sidebar ke susunan bawaan
      description: Soft delete layout milik pemanggil; idempoten. Ditolak **403** dalam sesi impersonate.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Layout dihapus (atau memang belum ada).
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Sesi impersonate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bug-reports:
    post:
      operationId: createBugReport
      tags: [Console]
      summary: Kirim laporan bug dari Console
      description: |
        Semua peran masuk (termasuk `ENDUSER`) boleh melapor. Tenant & pelapor SELALU dari token (bukan body). Laporan
        disimpan di database, dikirim lewat email ke operator platform (`ACS_BUG_REPORT_EMAIL`), dan memicu notifikasi
        in-app ke `SUPERADMIN`. Konteks (`page_path`, `user_agent`, `app_version`) yang tidak sah dikosongkan, bukan
        menolak laporan. Batas **10 laporan per jam per pengguna** (**429**).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: JSON, atau multipart/form-data dengan berkas `screenshot` opsional (PNG/JPEG, maks 2 MB; jenis & dimensi divalidasi dari ISI berkas). Field/berkas lain ditolak.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugReportCreate' }
          multipart/form-data:
            schema:
              type: object
              required: [title, description, expected]
              properties:
                title: { type: string, minLength: 5, maxLength: 120 }
                description: { type: string, minLength: 10, maxLength: 4000 }
                expected: { type: string, minLength: 5, maxLength: 2000 }
                severity: { type: string, enum: [MINOR, MAJOR, BLOCKER] }
                page_path: { type: string, maxLength: 512 }
                user_agent: { type: string, maxLength: 512 }
                app_version: { type: string, maxLength: 32 }
                screenshot: { type: string, format: binary }
      responses:
        '201':
          description: Laporan tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReport' }
        '400':
          description: Isi tidak valid (judul 5–120, deskripsi 10–4000 karakter, tanpa karakter kontrol; dampak MINOR/MAJOR/BLOCKER).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Batas laju laporan per jam.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listBugReports
      tags: [Console]
      summary: Daftar laporan bug
      description: |
        `SUPERADMIN` melihat SEMUA laporan (filter `tenant_id`/`status` opsional, email pelapor ikut). Peran lain hanya
        melihat laporan MILIK SENDIRI — `tenant_id` dari klien diabaikan.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, WONTFIX] }
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar laporan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReportListResponse' }
        '400':
          description: Filter tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bug-reports/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBugReport
      tags: [Console]
      summary: Detail laporan bug
      description: Pelapor sendiri atau `SUPERADMIN`. Laporan orang lain dijawab **404** (bukan 403) agar keberadaan UUID tidak bisa diprobing.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detail laporan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReport' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tidak ada atau bukan milik pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updateBugReport
      tags: [Console]
      summary: Ubah status penanganan laporan bug (SUPERADMIN)
      description: Bila status BERUBAH, **pelapor diberi tahu** (notifikasi in-app `BUG_REPORT_UPDATE` + email; "sudah ditangani" untuk `RESOLVED`). Tidak ada pemberitahuan bila status sama atau laporan dibuat dalam sesi impersonate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugReportUpdate' }
      responses:
        '200':
          description: Laporan terbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReport' }
        '400':
          description: Status/catatan tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan `SUPERADMIN`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Laporan tidak ada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bug-reports/{uuid}/screenshot:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBugReportScreenshot
      tags: [Console]
      summary: Tangkapan layar laporan bug
      description: |
        Hanya pelapor sendiri atau `SUPERADMIN`. Laporan orang lain, laporan tanpa gambar, atau UUID tak dikenal dijawab
        **404**. Jenis konten ditetapkan server dari hasil validasi (`image/png` atau `image/jpeg`); header
        `X-Content-Type-Options: nosniff` dan `Cache-Control: private, no-store`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Gambar.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tidak ada, tanpa gambar, atau bukan milik pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /data-transfers:
    post:
      operationId: createDataTransfer
      tags: [Console]
      summary: Catat proses impor/ekspor yang dijalankan di Console
      description: |
        Console melaporkan ringkasan setiap proses impor/ekspor setelah selesai. Tenant & pelaku SELALU dari token.
        Angka berasal dari klien dan hanya divalidasi kewajarannya (`success+failed ≤ total`, status konsisten dengan
        angka). Isi baris TIDAK pernah dikirim/disimpan. Email ringkasan dikirim ke pelaku (kecuali sesi impersonate,
        SMTP mati, atau batas 20 email/jam). Peran staf; `ENDUSER` **403**. Proses yang diproses server mencatat diri
        sendiri dengan `source: SERVER`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataTransferCreate' }
      responses:
        '201':
          description: Tercatat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataTransfer' }
        '400':
          description: Isi tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan staf.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listDataTransfers
      tags: [Console]
      summary: Riwayat impor/ekspor
      description: |
        Staf tenant melihat riwayat TENANT-nya sendiri (`tenant_id` dari klien diabaikan). `SUPERADMIN` melihat semua
        tenant (filter `tenant_id` opsional; baris platform bertenant `null`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [IMPORT, EXPORT] }
        - name: module
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,47}$' }
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Riwayat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataTransferListResponse' }
        '400':
          description: Filter tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan staf atau ADMIN tanpa tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /data-transfers/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDataTransfer
      tags: [Console]
      summary: Detail satu proses impor/ekspor
      description: Baris tenant lain dijawab **404** (bukan 403) agar keberadaan UUID tidak bocor lintas tenant. `SUPERADMIN` boleh semua.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataTransfer' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tidak ada atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT sesi user (dari `POST /auth/login`) ATAU API token statis
        berawalan `acs_...` (dari `POST /auth/tokens`) — keduanya dikirim
        dengan cara yang sama lewat header `Authorization: Bearer <token>`.

  parameters:
    page:
      name: page
      in: query
      description: Halaman 1–100000 (default 1). Nilai di luar rentang atau bukan angka ditolak **400**.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: page_size
      in: query
      description: Ukuran halaman 1–200 (default 50). Nilai di luar rentang atau bukan angka ditolak **400**.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    tenantIdQuery:
      name: tenant_id
      in: query
      description: |
        Filter tenant. HANYA efektif untuk actor `SUPERADMIN` — actor role lain
        selalu dipaksa ke tenant miliknya sendiri, nilai ini diabaikan.
      schema: { type: integer, format: int64 }
    tenantIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal tenant.
      schema: { type: integer, format: int64 }
    userIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal user.
      schema: { type: integer, format: int64 }
    deviceIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal device.
      schema: { type: integer, format: int64 }
    taskIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal task.
      schema: { type: integer, format: int64 }
    profileIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal provisioning profile.
      schema: { type: integer, format: int64 }
    ztRuleIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal zero-touch rule.
      schema: { type: integer, format: int64 }
    vendorIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal vendor.
      schema: { type: integer, format: int64 }
    ouiIdPath:
      name: ouiId
      in: path
      required: true
      description: ID numerik internal OUI (`vendor_ouis.id`, dari `GET /vendors/{id}/ouis`).
      schema: { type: integer, format: int64 }
    deviceModelIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal device model.
      schema: { type: integer, format: int64 }
    mappingIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal vendor parameter mapping.
      schema: { type: integer, format: int64 }
    firmwareIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal file firmware.
      schema: { type: integer, format: int64 }
    rolloutBatchIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal firmware rollout batch.
      schema: { type: integer, format: int64 }
    webhookIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal webhook subscription.
      schema: { type: integer, format: int64 }
    fileIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal file generik.
      schema: { type: integer, format: int64 }
    tagIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal tag.
      schema: { type: integer, format: int64 }
    presetIdPath:
      name: id
      in: path
      required: true
      description: ID numerik internal preset.
      schema: { type: integer, format: int64 }
    deviceTagIdPath:
      name: tagId
      in: path
      required: true
      description: ID numerik internal tag yang dilepas dari device.
      schema: { type: integer, format: int64 }

  schemas:
    MenuLayoutNode:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [item, group] }
        key: { type: string, pattern: '^[a-z][a-z0-9._-]{0,47}$', description: Hanya untuk `item`. }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,23}$', description: Hanya untuk `group`; unik. }
        label: { type: string, minLength: 1, maxLength: 32, description: Hanya untuk `group`. }
        collapsed: { type: boolean }
        children:
          type: array
          maxItems: 40
          items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,47}$' }
    MenuLayout:
      type: object
      required: [version, nodes, hidden]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1] }
        nodes:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/MenuLayoutNode' }
        hidden:
          type: array
          maxItems: 60
          items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,47}$' }
    MenuLayoutResponse:
      type: object
      properties:
        layout:
          type: object
          nullable: true
          description: Layout menu, atau null bila belum diatur.
          allOf: [{ $ref: '#/components/schemas/MenuLayout' }]
    BugReportCreate:
      type: object
      required: [title, description, expected]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 4000, description: Apa yang terjadi. }
        expected: { type: string, minLength: 5, maxLength: 2000, description: Apa yang diharapkan (isian TERPISAH dari description). }
        severity: { type: string, enum: [MINOR, MAJOR, BLOCKER], default: MINOR }
        page_path: { type: string, maxLength: 512, description: Path Console saat melapor (query/fragmen dibuang; yang tak sah dikosongkan). }
        user_agent: { type: string, maxLength: 512 }
        app_version: { type: string, maxLength: 32 }
    BugReportUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, WONTFIX] }
        note: { type: string, maxLength: 500, nullable: true }
    BugReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        tenant_name: { type: string, nullable: true }
        reporter: { type: string, description: Username pelapor. }
        reporter_email: { type: string, description: Hanya untuk `SUPERADMIN`. }
        impersonated: { type: boolean }
        title: { type: string }
        description: { type: string, description: Apa yang terjadi. }
        expected: { type: string, description: Apa yang diharapkan. }
        has_screenshot: { type: boolean }
        page_path: { type: string }
        user_agent: { type: string }
        app_version: { type: string }
        severity: { type: string, enum: [MINOR, MAJOR, BLOCKER] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, WONTFIX] }
        admin_note: { type: string, nullable: true }
        emailed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BugReportListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BugReport' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    DataTransferCreate:
      type: object
      required: [kind, status, module]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [IMPORT, EXPORT] }
        status: { type: string, enum: [COMPLETED, PARTIAL, FAILED] }
        module: { type: string, pattern: '^[a-z][a-z0-9_]{1,47}$', example: devices }
        format: { type: string, enum: [csv, xlsx, json, pdf, txt], default: csv }
        file_name: { type: string, maxLength: 255 }
        total_rows: { type: integer, minimum: 0, maximum: 5000000 }
        success_rows: { type: integer, minimum: 0, maximum: 5000000 }
        failed_rows: { type: integer, minimum: 0, maximum: 5000000 }
        detail: { type: string, maxLength: 500 }
    DataTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        tenant_name: { type: string, nullable: true }
        user: { type: string }
        impersonated: { type: boolean }
        kind: { type: string, enum: [IMPORT, EXPORT] }
        status: { type: string, enum: [COMPLETED, PARTIAL, FAILED] }
        module: { type: string }
        format: { type: string }
        file_name: { type: string, nullable: true }
        total_rows: { type: integer }
        success_rows: { type: integer }
        failed_rows: { type: integer }
        detail: { type: string, nullable: true }
        source: { type: string, enum: [SERVER, CLIENT] }
        emailed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DataTransferListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DataTransfer' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    # ---------- Notifikasi (migrations/0030) ----------
    Notification:
      type: object
      description: Satu notifikasi milik pengguna yang login. `title`/`body` adalah teks biasa (bukan HTML).
      properties:
        id: { type: string, format: uuid, description: "UUID notifikasi (identifier publik; PK numerik tidak diekspos)." }
        type:
          type: string
          description: Kode jenis.
          enum: [SECURITY_ALERT, DEVICE_OFFLINE_SPIKE, TASK_FAILURES, ROLLOUT_PAUSED, DEVICE_LIMIT_REACHED, NEW_TENANT_SIGNUP, ANNOUNCEMENT, BILLING_PAID, BILLING_EXPIRING, BILLING_EXPIRED, BILLING_FAILED, BUG_REPORT_UPDATE, OPTICAL_ALERT]
        type_name: { type: string, example: Pengumuman }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        title: { type: string, maxLength: 160 }
        body: { type: string, maxLength: 1000 }
        link:
          type: string
          nullable: true
          description: Path internal Console (diawali `/`), mis. `/devices`.
          example: /firmware
        entity_type: { type: string, nullable: true, example: firmware_rollout_batch }
        entity_id: { type: integer, format: int64, nullable: true }
        read_at: { type: string, format: date-time, nullable: true, description: "`null` = belum dibaca." }
        created_at: { type: string, format: date-time }
      required: [id, type, type_name, severity, title, body, link, entity_type, entity_id, read_at, created_at]

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        meta:
          type: object
          properties:
            total: { type: integer, description: "Jumlah notifikasi sesuai filter." }
            unread: { type: integer, description: "Jumlah belum dibaca seluruhnya (tak terpengaruh filter)." }
            page: { type: integer }
            limit: { type: integer }
          required: [total, unread, page, limit]
      required: [data, meta]

    MarkNotificationsReadRequest:
      type: object
      description: Isi `all` ATAU `ids`.
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        all: { type: boolean, default: false }

    NotificationPreference:
      type: object
      properties:
        type: { type: string, example: TASK_FAILURES }
        name: { type: string }
        description: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL], description: Keparahan bawaan jenis. }
        in_app: { type: boolean }
        email: { type: boolean }
        mandatory: { type: boolean, description: "`true` = tidak bisa dimatikan (selalu in-app dan email)." }
      required: [type, name, description, severity, in_app, email, mandatory]

    NotificationPreferenceListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
      required: [data]

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              type: { type: string, maxLength: 48, example: TASK_FAILURES }
              in_app: { type: boolean }
              email: { type: boolean }
            required: [type, in_app, email]
      required: [items]

    AnnounceRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 1000, description: "Teks biasa; baris baru diperbolehkan." }
        link:
          type: string
          maxLength: 255
          description: "Opsional. Path internal diawali `/`; tanpa `//`, backslash, skema, atau spasi."
          example: /dashboard
        tenant_id: { type: integer, format: int64, nullable: true, description: "Kosong = seluruh platform." }
        email: { type: boolean, default: false, description: "Kirim juga lewat email (bila SMTP aktif)." }
      required: [title, body]

    AnnounceResponse:
      type: object
      properties:
        recipients: { type: integer, description: Jumlah penerima yang dibuatkan notifikasi. }
      required: [recipients]

    # ---------- Billing (langganan SaaS) ----------
    BillingPlan:
      type: object
      description: Paket langganan. Id numerik tidak diekspos; `code` adalah identifier publik.
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$', example: STARTER }
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        max_devices: { type: integer, nullable: true, minimum: 1, maximum: 10000000, description: "Batas perangkat aktif; `null` = tak dibatasi." }
        price_idr: { type: integer, format: int64, minimum: 0, maximum: 1000000000, description: "Harga per periode, bilangan bulat rupiah." }
        period_days: { type: integer, minimum: 1, maximum: 366 }
        is_active: { type: boolean }
        sort_order: { type: integer }
      required: [code, name, description, max_devices, price_idr, period_days, is_active, sort_order]

    CreateBillingPlanRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 64, description: "Dinormalisasi ke huruf besar; harus `^[A-Z][A-Z0-9_]{1,31}$`." }
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        max_devices: { type: integer, nullable: true, minimum: 1, maximum: 10000000 }
        price_idr: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        period_days: { type: integer, minimum: 1, maximum: 366, default: 30 }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer }
      required: [code, name, price_idr]

    UpdateBillingPlanRequest:
      type: object
      additionalProperties: false
      description: "Semua field opsional. `max_devices: null` = tak dibatasi; tidak dikirim = tak berubah."
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        max_devices: { type: integer, nullable: true, minimum: 1, maximum: 10000000 }
        price_idr: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        period_days: { type: integer, minimum: 1, maximum: 366 }
        is_active: { type: boolean }
        sort_order: { type: integer }

    BillingInvoice:
      type: object
      description: |
        Invoice langganan. `id` = `invoice_uuid`. Tidak memuat id numerik, id gateway, maupun rahasia. `payment_url` hanya
        terisi saat `status=PENDING` dan belum kedaluwarsa.
      properties:
        id: { type: string, format: uuid }
        number: { type: string, maxLength: 64, description: "Nomor invoice (= `external_id` di Xendit), mis. `ACS-12-1790000000000000000-ab12cd34`." }
        tenant_id: { type: integer, format: int64 }
        plan_code: { type: string }
        plan_name: { type: string }
        amount_idr: { type: integer, format: int64, description: Nominal yang ditagih (disalin dari paket saat invoice dibuat). }
        status: { type: string, enum: [PENDING, PAID, EXPIRED, FAILED] }
        payment_url: { type: string, nullable: true, format: uri, description: "Halaman bayar Xendit (https, host `xendit.co`)." }
        period_days: { type: integer }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
      required: [id, number, tenant_id, plan_code, plan_name, amount_idr, status, payment_url, period_days, created_at, expires_at, paid_at]

    BillingSubscription:
      type: object
      properties:
        enabled: { type: boolean, description: "`false` bila pembayaran dimatikan di server." }
        status: { type: string, enum: [NONE, ACTIVE, EXPIRED] }
        plan: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/BillingPlan' }] }
        expires_at: { type: string, format: date-time, nullable: true }
        days_left: { type: integer, nullable: true, description: "Sisa hari (dibulatkan ke atas); 0 bila EXPIRED; `null` bila NONE." }
        max_devices: { type: integer, nullable: true, description: "Batas perangkat tenant saat ini; `null` = tak dibatasi." }
        pending_invoice:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BillingInvoice' }]
          description: "Invoice PENDING terbaru yang punya URL bayar. Hanya untuk ADMIN/SUPERADMIN; peran lain selalu `null`."
      required: [enabled, status, plan, expires_at, days_left, max_devices, pending_invoice]

    BillingCheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        plan_code: { type: string, maxLength: 64, description: "Dinormalisasi ke huruf besar lalu dicocokkan dengan paket aktif di DB." }
        tenant_id: { type: integer, format: int64, minimum: 1, description: "Wajib untuk SUPERADMIN; ADMIN hanya boleh tenant sendiri." }
      required: [plan_code]

    BillingCheckoutResponse:
      type: object
      properties:
        invoice: { $ref: '#/components/schemas/BillingInvoice' }
        payment_url: { type: string, format: uri, description: "Sama dengan `invoice.payment_url`; arahkan pengguna ke sini." }
      required: [invoice, payment_url]

    XenditWebhookPayload:
      type: object
      description: |
        Payload callback invoice Xendit. Hanya `id` dan/atau `external_id` yang dipakai (untuk menemukan invoice); `status`,
        `amount`, dan field lain **tidak dipercaya** — kebenaran diambil ulang dari API Xendit. Field tambahan diterima apa adanya.
      properties:
        id: { type: string, maxLength: 128, description: "Id invoice di Xendit." }
        external_id: { type: string, maxLength: 128, description: "= `number` invoice kita." }
        status: { type: string, description: "PAID / EXPIRED (diabaikan; diverifikasi ulang ke gateway)." }
        amount: { type: number }
        paid_amount: { type: number }
        paid_at: { type: string }
        payer_email: { type: string }
        currency: { type: string }
      additionalProperties: true

    # ---------- Generik ----------
    ErrorResponse:
      type: object
      description: |
        Bentuk error SERAGAM untuk seluruh endpoint (`echo.NewHTTPError`) —
        selalu `{"message": "..."}`, tidak ada kode error mesin terpisah dari
        `message` teks bebas saat ini (perhatikan: teks pesan sebagian besar
        Bahasa Indonesia, konsisten dengan gaya pesan aplikasi ini).
      properties:
        message:
          type: string
          example: "domain: data tidak ditemukan"
      required: [message]

    RefLookup:
      type: object
      description: Satu baris tabel referensi/enum generik (`ref_*`).
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ONLINE }
        name: { type: string, example: Online }
      required: [id, code, name]

    Audit:
      type: object
      description: 7 kolom audit standar yang dipakai hampir semua entitas master/transactional.
      properties:
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: integer, format: int64, nullable: true }
        is_deleted: { type: boolean }

    # ---------- Auth ----------
    LoginRequest:
      type: object
      description: Isi `email` (disarankan) ATAU `username` (kompatibilitas lama), plus `password`.
      properties:
        email: { type: string, format: email, example: nama@perusahaan.com }
        username: { type: string, description: "Kompatibilitas lama; gunakan email." }
        password: { type: string, format: password }
      required: [password]

    ForgotPasswordRequest:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token: { type: string, description: "Token dari tautan email (fragment #token=…)." }
        new_password: { type: string, format: password, minLength: 8, maxLength: 128 }
      required: [token, new_password]

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        user:
          type: object
          properties:
            id: { type: integer, format: int64 }
            uuid: { type: string, format: uuid }
            username: { type: string }
            roles: { type: array, items: { type: string } }
            tenant_id: { type: integer, format: int64, nullable: true }
      required: [access_token, token_type, user]

    SaaSReport:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        platform:
          type: object
          properties:
            tenants_total: { type: integer }
            tenants_active: { type: integer }
            tenants_new_30d: { type: integer }
            devices_total: { type: integer }
            devices_online: { type: integer }
            devices_new_7d: { type: integer }
            devices_new_30d: { type: integer }
            users_total: { type: integer }
            users_active_30d: { type: integer }
            tasks_30d: { type: integer }
            tasks_failed_30d: { type: integer }
            sessions_24h: { type: integer }
            failed_logins_24h: { type: integer }
            webhooks_active: { type: integer }
            firmware_files: { type: integer }
        tenants:
          type: array
          items:
            type: object
            properties:
              tenant_id: { type: integer, format: int64 }
              code: { type: string }
              name: { type: string }
              is_active: { type: boolean }
              created_at: { type: string, format: date-time }
              devices: { type: integer }
              devices_online: { type: integer }
              users: { type: integer }
              users_active_30d: { type: integer }
              tasks_30d: { type: integer }
              tasks_failed_30d: { type: integer }
              pending_tasks: { type: integer }
              max_pending_tasks: { type: integer, nullable: true }
              sessions_30d: { type: integer }
              webhooks_active: { type: integer }
              last_inform_at: { type: string, format: date-time, nullable: true }
              last_login_at: { type: string, format: date-time, nullable: true }
              health: { type: string, enum: [sehat, perhatian, nonaktif] }
              health_reasons: { type: array, items: { type: string } }
        vendors:
          type: array
          items:
            type: object
            properties:
              vendor: { type: string }
              devices: { type: integer }
        daily:
          type: array
          description: 30 hari terakhir berurutan (hari tanpa data bernilai 0).
          items:
            type: object
            properties:
              date: { type: string, example: "2026-10-17" }
              new_devices: { type: integer }
              sessions: { type: integer }
              tasks: { type: integer }
              tasks_failed: { type: integer }
      required: [generated_at, platform, tenants, vendors, daily]

    MfaRequiredResponse:
      type: object
      description: Password benar tetapi akun ber-MFA; lanjutkan ke `POST /auth/mfa/verify`.
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_token: { type: string, description: "Berlaku 5 menit; BUKAN token sesi." }
      required: [mfa_required, mfa_token]

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
      required: [access_token, token_type]

    ChangeOwnPasswordRequest:
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
      required: [current_password, new_password]

    IssueAPITokenRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128, description: Nama/label token untuk memudahkan identifikasi di masa depan. }
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: harus sama dengan tenant milik actor sendiri (atau dikosongkan agar default ke tenant actor)."
        expires_at: { type: string, format: date-time, nullable: true, description: "Kosongkan = default 365 hari. Harus di masa depan dan paling jauh 365 hari dari sekarang; di luar itu ditolak 400." }
      required: [name]

    IssueAPITokenResponse:
      type: object
      description: "Nilai `token` PLAINTEXT hanya muncul di sini, SEKALI — tidak bisa diambil ulang lewat endpoint manapun setelahnya."
      properties:
        token: { type: string, example: "acs_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" }
        id: { type: integer, format: int64 }
        uuid: { type: string, format: uuid }
      required: [token, id, uuid]

    APIToken:
      type: object
      description: |
        Metadata satu API token (dari `GET /auth/tokens`). Nilai token
        PLAINTEXT tidak pernah ada di sini — hanya `token_hash` yang tersimpan
        di database, dan field itu sendiri disembunyikan dari response
        (`json:"-"` di Go, lihat domain/tenancy.go).
      properties:
        id: { type: integer, format: int64 }
        token_uuid: { type: string, format: uuid }
        user_id: { type: integer, format: int64, nullable: true, description: "User yang menerbitkan token ini." }
        tenant_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        scopes:
          type: object
          nullable: true
          description: "Belum ada jalur yang mengisi field ini (selalu `null` saat ini) — dicadangkan utk scope granular per-token di masa depan."
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true, description: "NULL berarti masih aktif." }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
      required: [id, token_uuid, name, created_at, updated_at]

    APITokenListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/APIToken' }
        total: { type: integer }
      required: [data, total]

    # ---------- Tenants ----------
    Tenant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        cwmp_inform_username:
          type: string
          nullable: true
          description: "Separuh dari shared secret Inform CWMP tenant ini. Separuh lainnya (password) TIDAK PERNAH diekspos di response manapun."
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true, example: "#1a73e8" }
        max_pending_tasks: { type: integer, nullable: true, description: "NULL berarti tidak dibatasi." }
        max_devices: { type: integer, nullable: true, description: "Batas perangkat aktif tenant (paket SaaS); null = tak dibatasi." }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, tenant_uuid, code, name, is_active]

    TenantListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Tenant' }
        total: { type: integer }
      required: [data, total]

    CurrentTenant:
      type: object
      description: DTO SEMPIT khusus `GET /tenants/current` — sengaja tidak mengikutkan `code`, `is_active`, `cwmp_inform_username`, atau kolom audit.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        brand_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        primary_color: { type: string, nullable: true }
      required: [id, name]

    CreateTenantRequest:
      type: object
      description: "Batas `maxLength` di bawah ditegakkan server (`delivery/http/validate.go`) dan sama persis dengan lebar kolom `schema.sql` — melebihi batas dijawab `400`, bukan `500`."
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        cwmp_inform_username: { type: string, nullable: true, maxLength: 128 }
        cwmp_inform_password:
          type: string
          format: password
          nullable: true
          minLength: 16
          description: "Tidak dibatasi panjang maksimum di server (disimpan terenkripsi sebagai VARBINARY, bukan VARCHAR)."
      required: [code, name]

    SetTenantCWMPCredentialsRequest:
      type: object
      properties:
        username: { type: string, maxLength: 128 }
        password:
          type: string
          format: password
          minLength: 16
          description: "Tidak dicek panjang maksimumnya di server (disimpan terenkripsi)."
      required: [username, password]

    UpdateTenantBrandingRequest:
      type: object
      description: "FULL REPLACE — `null` eksplisit mengosongkan kolom terkait (bukan \"tidak diubah\")."
      properties:
        brand_name: { type: string, nullable: true, maxLength: 128 }
        logo_url: { type: string, nullable: true, format: uri, maxLength: 512, description: "Harus http/https valid." }
        primary_color: { type: string, nullable: true, maxLength: 7, pattern: '^#[0-9a-fA-F]{6}$' }

    SetTenantTaskQuotaRequest:
      type: object
      properties:
        max_pending_tasks:
          type: integer
          nullable: true
          description: "NULL berarti tidak dibatasi."

    UpdateTenantRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        code: { type: string, nullable: true, maxLength: 32 }
        name: { type: string, nullable: true, maxLength: 128 }
        is_active: { type: boolean, nullable: true }

    # ---------- Users ----------
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL untuk superadmin lintas-tenant." }
        username: { type: string }
        email: { type: string, format: email }
        full_name: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, user_uuid, username, email, full_name, is_active, roles]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }
      required: [data, total]

    CreateUserRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "Non-superadmin: WAJIB sama dengan tenant miliknya sendiri."
        username: { type: string, maxLength: 64 }
        email: { type: string, format: email, maxLength: 191 }
        password:
          type: string
          format: password
          description: |
            Hanya dicek TIDAK KOSONG. Berbeda dari `PATCH /users/{id}/password`
            dan `PATCH /auth/password` yang menegakkan minimal 8 karakter,
            `POST /users` saat ini TIDAK menegakkan panjang minimum maupun
            maksimum (asimetri nyata di `usecase/iam.CreateUser`, bukan
            kelalaian dokumentasi).
        full_name: { type: string, maxLength: 128 }
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
          description: "Non-superadmin TIDAK BOLEH menyertakan `SUPERADMIN` (dicek case-insensitive). `ENDUSER` untuk akun portal self-service."
      required: [username, password]

    UpdateUserRequest:
      type: object
      description: Partial update — field yang tidak dikirim/`null` tidak diubah.
      properties:
        full_name: { type: string, nullable: true, maxLength: 128 }
        email: { type: string, format: email, nullable: true, maxLength: 191 }
        is_active: { type: boolean, nullable: true, description: "Actor tidak bisa men-set `false` untuk akunnya sendiri (self-lockout guard)." }

    ResetUserPasswordRequest:
      type: object
      properties:
        new_password: { type: string, format: password, minLength: 8 }
      required: [new_password]

    ReplaceUserRolesRequest:
      type: object
      description: FULL REPLACE — role yang tidak disebut akan dicabut.
      properties:
        role_codes:
          type: array
          items: { type: string, enum: [SUPERADMIN, ADMIN, NOC, VIEWER, ENDUSER] }
      required: [role_codes]

    # ---------- Devices ----------
    Device:
      type: object
      description: |
        Inventory CPE. Kredensial connection request (`connection_request_username`
        DAN `connection_request_password`) serta `inform_password` TIDAK PERNAH
        muncul di response ini — di `domain.Device` ketiganya bertanda
        `json:"-"`. `connection_request_username` bisa di-*set* lewat
        `PATCH /devices/{id}` tapi tidak pernah dibaca kembali lewat API mana
        pun. (`inform_username` sendiri BUKAN kredensial rahasia dan tetap
        dikembalikan.)
      properties:
        id: { type: integer, format: int64 }
        device_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        vendor_id: { type: integer, format: int64, nullable: true, description: "NULL bila belum ter-resolve dari OUI (device UNREGISTERED)." }
        device_model_id: { type: integer, format: int64, nullable: true }
        device_status_id: { type: integer, format: int64 }
        provisioning_profile_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true, example: "AABBCC" }
        serial_number: { type: string }
        product_class: { type: string, nullable: true }
        mac_address: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
        hardware_version: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        connection_request_url: { type: string, nullable: true }
        inform_username: { type: string, nullable: true }
        last_inform_at: { type: string, format: date-time, nullable: true }
        last_boot_event_at: { type: string, format: date-time, nullable: true }
        latitude: { type: number, format: double, nullable: true, description: "Koordinat lokasi pemasangan (opsional, di-set lewat `PATCH /devices/{id}`)." }
        longitude: { type: number, format: double, nullable: true, description: "Koordinat lokasi pemasangan (opsional, di-set lewat `PATCH /devices/{id}`)." }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, device_uuid, device_status_id, serial_number]

    DeviceListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceListItem' }
        total: { type: integer }
      required: [data, total]

    DeviceListItem:
      description: Device + ringkasan baris daftar perangkat.
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            rx_power_dbm: { type: number, format: double, nullable: true, description: "Level terima optik terakhir (dBm); null bila belum pernah terbaca." }
            tx_power_dbm: { type: number, format: double, nullable: true, description: "Daya kirim optik terakhir (dBm)." }
            optical_at: { type: string, format: date-time, nullable: true, description: "Waktu metrik optik terakhir dicatat." }
            pppoe_username: { type: string, nullable: true, description: "Username PPPoE dari parameter standar yang sudah tersinkron; null bila belum terbaca." }
            virtual: { type: object, additionalProperties: { type: string }, description: "Hanya bila diminta lewat `vparams=`: peta nama virtual parameter → nilai turunan." }
            parameters: { type: object, additionalProperties: { type: string }, description: "Hanya bila diminta lewat `params=`: peta nama parameter → nilai (yang belum terisi tidak muncul)." }

    CaptureStatus:
      type: object
      properties:
        active: { type: boolean }
        until: { type: string, format: date-time, nullable: true, description: "Kedaluwarsa capture (null bila belum pernah dinyalakan)." }
      required: [active, until]
    CaptureMessage:
      type: object
      properties:
        id: { type: string, format: uuid, description: "UUID pesan (identifier publik)." }
        session_ref: { type: string, nullable: true, description: "8 hex pertama SHA-256 token sesi: mengelompokkan pesan satu sesi tanpa membuka token." }
        from_cpe: { type: boolean, description: "true = CPE → ACS; false = ACS → CPE." }
        rpc_name: { type: string, description: "Nama RPC/elemen SOAP, atau \"(kosong)\" untuk POST kosong/204." }
        http_status: { type: integer, nullable: true, description: "Status HTTP balasan ACS (hanya pesan ACS → CPE)." }
        body: { type: string, description: "XML SOAP tersamarkan; tidak ada pada daftar." }
        body_bytes: { type: integer, description: "Ukuran asli sebelum dipotong." }
        body_truncated: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, from_cpe, rpc_name, body_bytes, body_truncated, created_at]
    CaptureListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CaptureMessage' } }
        total: { type: integer }
      required: [data, total]
    VirtualParameter:
      type: object
      description: "Definisi nilai turunan (ekspresi pkg/vexpr). Identifier publik adalah UUID."
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "null = global (semua tenant)." }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: "Kunci mesin; dipakai pada `vparams=`." }
        label: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 1024 }
        expression: { type: string, maxLength: 1000 }
        unit: { type: string, nullable: true, maxLength: 32 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, label, expression, is_active]
    VirtualParameterRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id: { type: integer, format: int64, nullable: true, description: "Hanya efektif untuk SUPERADMIN; null = global." }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 1024 }
        expression: { type: string, maxLength: 1000 }
        unit: { type: string, nullable: true, maxLength: 32 }
        is_active: { type: boolean, default: true }
      required: [name, label, expression]
    VirtualParameterPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 1024 }
        expression: { type: string, maxLength: 1000 }
        unit: { type: string, nullable: true, maxLength: 32 }
        is_active: { type: boolean }
    VirtualParameterListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VirtualParameter' } }
        total: { type: integer }
      required: [data, total]
    VirtualValue:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        unit: { type: string, nullable: true }
        value: { type: string, nullable: true, description: "null = belum dapat dihitung." }
      required: [name, label, unit, value]
    VirtualParameterTestResult:
      type: object
      properties:
        ok: { type: boolean }
        value: { type: string, nullable: true }
        refs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string, nullable: true, description: "null = parameter belum dilaporkan perangkat." }
        error:
          type: object
          description: "Hanya bila ok=false."
          properties:
            pos: { type: integer, description: "Posisi karakter (mulai 0) kesalahan sintaks." }
            message: { type: string }
      required: [ok, refs]
    Fault:
      type: object
      description: "cwmp:Fault aktif dari CPE (migrations/0038). Identifier publik adalah UUID."
      properties:
        id: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        device_serial: { type: string }
        tenant_id: { type: integer, format: int64, nullable: true }
        task_id: { type: integer, format: int64, nullable: true, description: "Task yang memicu kejadian terakhir; null bila fault datang tanpa task yang cocok." }
        rpc_method: { type: string, description: "Kode jenis task yang ditolak CPE; kosong bila tidak diketahui." }
        fault_code: { type: string, description: "Kode fault CWMP apa adanya dari CPE (mis. 9005); 'unknown' bila CPE tidak mengirim kode." }
        fault_string: { type: string }
        occurrence_count: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
      required: [id, device_id, device_serial, rpc_method, fault_code, fault_string, occurrence_count, first_seen_at, last_seen_at]
    FaultListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Fault' } }
        total: { type: integer }
      required: [data, total]
    BucketCount:
      type: object
      properties:
        key: { type: string, description: "Kunci keranjang (mis. gpon, lt1d, ok, warning); label dibuat di klien." }
        count: { type: integer }
      required: [key, count]
    FleetInsights:
      type: object
      properties:
        online: { type: integer }
        offline: { type: integer }
        other: { type: integer, description: "Perangkat berstatus lain (belum terdaftar, bermasalah, dst.) — tidak ikut distribusi." }
        pon_mode: { type: array, items: { $ref: '#/components/schemas/BucketCount' }, description: "gpon, epon, unknown (perangkat online)." }
        uptime: { type: array, items: { $ref: '#/components/schemas/BucketCount' }, description: "lt1d, d1_7, d7_30, gt30d, unknown (perangkat online)." }
        optical_rx: { type: array, items: { $ref: '#/components/schemas/BucketCount' }, description: "ok, warn, bad, overload, unknown (perangkat online)." }
        temperature: { type: array, items: { $ref: '#/components/schemas/BucketCount' }, description: "normal, warning, high, critical, unknown (perangkat online)." }
        offline_age: { type: array, items: { $ref: '#/components/schemas/BucketCount' }, description: "lt1d, d1_3, d3_7, d7_30, gt30d, unknown (perangkat offline)." }
      required: [online, offline, other, pon_mode, uptime, optical_rx, temperature, offline_age]
    DeviceStats:
      type: object
      properties:
        by_status:
          type: array
          nullable: true
          items:
            type: object
            properties:
              device_status_id: { type: integer, format: int64 }
              count: { type: integer }
        by_vendor:
          type: array
          nullable: true
          items:
            type: object
            properties:
              vendor_id: { type: integer, format: int64, nullable: true, description: "NULL berarti device yang belum ter-resolve vendor-nya." }
              count: { type: integer }

    CreateDeviceRequest:
      type: object
      properties:
        tenant_id: { type: integer, format: int64, description: "WAJIB untuk SUPERADMIN; ADMIN: kosong atau tenant sendiri." }
        oui: { type: string, pattern: '^[0-9A-Za-z]{6}$', example: 00D0D0, description: "6 karakter alfanumerik (umumnya heksadesimal); disimpan huruf besar." }
        serial_number: { type: string, maxLength: 128 }
        product_class: { type: string, maxLength: 128 }
        mac_address: { type: string }
        notes: { type: string, maxLength: 255 }
        vendor_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        connection_request_url: { type: string, maxLength: 255 }
        connection_request_username: { type: string, maxLength: 128 }
        connection_request_password: { type: string, format: password, maxLength: 128 }
      required: [oui, serial_number]

    ImportDevicesRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [skip, update]
          description: "skip = lewati yang sudah ada; update = ubah yang berbeda."
        rows:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CreateDeviceRequest' }
      required: [mode, rows]

    ImportDeviceRowResult:
      type: object
      properties:
        index: { type: integer, description: "Posisi baris pada permintaan (0-based)." }
        action: { type: string, enum: [create, update, unchanged, skip, error] }
        oui: { type: string }
        serial_number: { type: string }
        changes: { type: array, items: { type: string }, description: "Field yang berubah (action=update)." }
        error: { type: string }
      required: [index, action, oui, serial_number]

    ImportDevicesResult:
      type: object
      properties:
        dry_run: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/ImportDeviceRowResult' }
      required: [dry_run, created, updated, unchanged, skipped, failed, results]

    UpdateDeviceRequest:
      type: object
      description: |
        Partial update — field yang tidak dikirim/`null` tidak diubah. String kosong
        mengosongkan `notes`, `product_class`, `mac_address`, `connection_request_url`.
        `vendor_id`/`device_model_id` hanya dapat diisi/diganti (model harus milik vendor).
        `latitude` dan `longitude` harus berpasangan (−90..90 / −180..180); koordinat tidak
        dapat dikosongkan. OUI dan serial tidak dapat diubah.
      properties:
        product_class: { type: string, nullable: true, maxLength: 128 }
        mac_address: { type: string, nullable: true, description: "Format bebas; disimpan AA:BB:CC:DD:EE:FF." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        notes: { type: string, nullable: true, maxLength: 255 }
        connection_request_url: { type: string, nullable: true }
        connection_request_username: { type: string, nullable: true }
        connection_request_password:
          type: string
          format: password
          nullable: true
          description: "Dienkripsi sebelum disimpan; tidak pernah dikembalikan lagi di response manapun."
        latitude:
          type: number
          format: double
          nullable: true
          description: "Koordinat lokasi pemasangan device."
        longitude:
          type: number
          format: double
          nullable: true
          description: "Koordinat lokasi pemasangan device."

    DeviceParameter:
      type: object
      description: Nilai parameter TR-069 terkini per device (EAV, hasil sinkronisasi GetParameterValues terakhir).
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        parameter_name: { type: string, example: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.ExternalIPAddress" }
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        writable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, device_id, parameter_name, writable]

    DeviceEvent:
      type: object
      description: "Histori event Inform CWMP — audit minimal (`created_at` saja, tanpa 7 kolom audit standar; TECH.md §11, tabel log volume tinggi)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64, nullable: true }
        event_code_id: { type: integer, format: int64 }
        command_key: { type: string, nullable: true }
        raw_payload: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, event_code_id, occurred_at]

    DeviceEventListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceEvent' }
        total: { type: integer }
      required: [data, total]

    DeviceOpticalMetric:
      type: object
      description: "Metrik optik GPON/EPON — audit minimal (TECH.md §11)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        rx_power_dbm: { type: number, format: double, nullable: true }
        tx_power_dbm: { type: number, format: double, nullable: true }
        voltage: { type: number, format: double, nullable: true }
        bias_current_ma: { type: number, format: double, nullable: true }
        temperature_celsius: { type: number, format: double, nullable: true }
        distance_meters: { type: number, format: double, nullable: true }
        recorded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, device_id, recorded_at]

    DeviceOpticalMetricListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceOpticalMetric' }
        total: { type: integer }
      required: [data, total]

    ActivityLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, nullable: true, description: "NULL untuk aksi sistem otomatis (mis. evaluasi Zero-Touch saat BOOTSTRAP)." }
        tenant_id: { type: integer, format: int64, nullable: true }
        action: { type: string, example: UPDATE_DEVICE }
        entity_type: { type: string, example: device }
        entity_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        username:
          type: string
          nullable: true
          description: "Hasil LEFT JOIN ke users, bukan kolom asli tabel — NULL bila `user_id` NULL atau user sudah dihapus."
      required: [id, action, entity_type, created_at]

    ActivityLogListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ActivityLog' }
        total: { type: integer }
      required: [data, total]

    # ---------- Tasks ----------
    Task:
      type: object
      description: |
        Satu item antrean RPC CWMP. `parameters` dan `response` bertipe
        `domain.JSONRawMessage` — di-emit sebagai **objek JSON apa adanya**
        (bukan string ter-base64-kan; asimetri base64 lama sudah diperbaiki,
        lihat log perubahan `ROADMAP.md` 2026-08-23). `response` bernilai
        `null` selama task belum selesai. Untuk role `NOC`/`VIEWER`, key
        `url`/`username`/`password` di dalam `parameters` di-redact jadi
        `"[redacted]"`.
      properties:
        id: { type: integer, format: int64 }
        task_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        task_type_id: { type: integer, format: int64 }
        task_status_id: { type: integer, format: int64 }
        priority: { type: integer, minimum: 1, maximum: 9, description: "1 = tertinggi, 9 = terendah." }
        parameters:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON parameter RPC (mis. daftar nama parameter, key-value SetParameterValues)."
        response:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON respons RPC dari CPE. `null` selama task belum selesai."
        error_message: { type: string, nullable: true }
        retry_count: { type: integer }
        max_retries: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, task_uuid, device_id, task_type_id, task_status_id, priority]

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Task' }
        total: { type: integer }
      required: [data, total]

    TaskStatusCount:
      type: object
      properties:
        task_status_id: { type: integer, format: int64 }
        count: { type: integer }
      required: [task_status_id, count]

    CreateTaskRequest:
      type: object
      description: "`parameters` di SINI adalah OBJEK JSON biasa (bukan base64) — lihat catatan asimetri di skema `Task`."
      properties:
        device_id: { type: integer, format: int64 }
        task_type:
          type: string
          description: "Kode `ref_task_types`, mis. `REBOOT`, `GET_PARAMETER_VALUES`, `SET_PARAMETER_VALUES`, `DOWNLOAD`, `FACTORY_RESET`."
          example: REBOOT
        priority: { type: integer, minimum: 0, maximum: 9, default: 5, description: "0 dikirim = pakai default 5." }
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        max_retries: { type: integer, minimum: 0, default: 3, description: "0 dikirim = pakai default 3." }
        scheduled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
      required: [device_id, task_type]

    # ---------- Provisioning ----------
    ProvisioningProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti profile global lintas tenant (hanya bisa dibuat/diedit superadmin)." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_default: { type: boolean }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, profile_uuid, name, is_default, is_active]

    ProvisioningProfileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfile' }
        total: { type: integer }
      required: [data, total]

    ProvisioningProfileParameter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        parameter_name:
          type: string
          description: "Boleh logical key (mis. `wifi.5g.ssid`) ATAU raw path TR-069 — diresolve saat APPLY, bukan saat disimpan."
        parameter_value: { type: string, nullable: true }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        apply_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, profile_id, parameter_name, apply_order]

    ProvisioningProfileDetail:
      type: object
      description: "Response gabungan khusus `GET /provisioning-profiles/:id` — BUKAN `ProvisioningProfile` polos."
      properties:
        profile: { $ref: '#/components/schemas/ProvisioningProfile' }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProvisioningProfileParameter' }
      required: [profile, parameters]

    ProfileParameterInput:
      type: object
      properties:
        parameter_name: { type: string }
        parameter_value: { type: string, nullable: true }
        apply_order: { type: integer, default: 0 }
      required: [parameter_name]

    CreateProfileRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "NULL = profile global (superadmin only). Non-superadmin WAJIB isi dengan tenant miliknya sendiri."
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 255 }
        is_default: { type: boolean, default: false }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ProfileParameterInput' }
      required: [name]

    UpdateProfileRequest:
      type: object
      description: "FULL update untuk field skalar (bukan partial — kirim seluruh state). `parameters` NULL/tidak dikirim = parameter lama TIDAK disentuh; array (termasuk kosong `[]`) = REPLACE seluruh parameter lama."
      properties:
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 255 }
        is_default: { type: boolean }
        is_active: { type: boolean }
        parameters:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProfileParameterInput' }

    ZeroTouchRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL berarti rule global lintas tenant." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true }
        serial_pattern: { type: string, nullable: true, description: "Pola SQL LIKE (`%`/`_`), dicocokkan case-insensitive." }
        software_version_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd devices.software_version (migrations/0009)." }
        match_parameter_name: { type: string, nullable: true, description: "Precondition opsional — device harus punya device_parameters dgn nama ini yang nilainya cocok match_parameter_value_pattern. Wajib berpasangan." }
        match_parameter_value_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd nilai parameter match_parameter_name. Wajib berpasangan." }
        provisioning_profile_id: { type: integer, format: int64, nullable: true, description: "NULLABLE sejak migrations/0009 — rule boleh hanya memicu reboot dan/atau firmware push." }
        post_apply_reboot: { type: boolean, description: "Jika true, enqueue task REBOOT setelah aksi lain diterapkan." }
        firmware_file_id: { type: integer, format: int64, nullable: true, description: "Jika diisi, enqueue task Download firmware ini ke device yang cocok." }
        trigger_event_id: { type: integer, format: int64, description: "FK ref_ztp_trigger_event — kapan rule dievaluasi (BOOTSTRAP_ONLY / BOOTSTRAP_OR_BOOT / EVERY_INFORM)." }
        priority: { type: integer, description: "Angka lebih kecil dievaluasi lebih dulu." }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, trigger_event_id, priority, is_active]

    ZeroTouchRuleRequest:
      type: object
      description: |
        Dipakai `POST /zero-touch-rules` DAN `PUT /zero-touch-rules/{id}`.
        Catatan: pada PUT, `tenant_id` di body TIDAK dipakai (handler
        `updateZTRule` tidak meneruskannya) — kepemilikan tenant rule tidak bisa
        dipindah lewat update.
      properties:
        tenant_id: { type: integer, format: int64, nullable: true, description: "Hanya berpengaruh saat create." }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        oui: { type: string, nullable: true, maxLength: 6 }
        serial_pattern: { type: string, nullable: true, maxLength: 255 }
        software_version_pattern: { type: string, nullable: true, maxLength: 255 }
        match_parameter_name: { type: string, nullable: true, maxLength: 512 }
        match_parameter_value_pattern: { type: string, nullable: true, maxLength: 255 }
        provisioning_profile_id: { type: integer, format: int64, nullable: true, description: "OPSIONAL sejak migrations/0009 — rule boleh hanya memicu reboot dan/atau firmware." }
        post_apply_reboot: { type: boolean, default: false }
        firmware_file_id: { type: integer, format: int64, nullable: true }
        trigger_event_id: { type: integer, format: int64, description: "WAJIB. Ambil id dari GET /refs/ref_ztp_trigger_event." }
        priority: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
      required: [trigger_event_id]

    # ---------- Catalog ----------
    Vendor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ZTE }
        name: { type: string, example: ZTE Corporation }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        oui_count: { type: integer, description: "Jumlah OUI terdaftar. Hanya diisi pada daftar vendor (GET /vendors); dihilangkan bila 0." }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, code, name, is_active]

    VendorListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Vendor' }
        total: { type: integer }
      required: [data, total]

    UpdateVendorRequest:
      type: object
      description: Partial update — field yang tidak dikirim tidak diubah. Minimal satu field. `code` tidak bisa diubah.
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 255, description: "String kosong = dikosongkan." }
        is_active: { type: boolean }

    CreateVendorRequest:
      type: object
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 255 }
      required: [code, name]

    VendorOUI:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        oui: { type: string, example: "AABBCC" }
        notes: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, oui]

    AddVendorOUIRequest:
      type: object
      properties:
        oui:
          type: string
          maxLength: 6
          description: |
            Kolom `vendor_ouis.oui` CHAR(6). Server HANYA menegakkan batas ATAS
            (maks 6 karakter) — nilai lebih pendek TETAP diterima, dan tidak ada
            validasi "wajib 6 digit heksadesimal" (keputusan produk eksplisit di
            `delivery/http/validate.go`, bukan kelalaian).
          example: "AABBCC"
        notes: { type: string, nullable: true, maxLength: 255 }
      required: [oui]

    DeviceModel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64, description: "Resolve ke `InternetGatewayDevice.*` (TR-098) atau `Device.*` (TR-181)." }
        product_class: { type: string, nullable: true }
        model_name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, device_type_id, data_model_version_id, model_name, is_active]

    UpdateDeviceModelRequest:
      type: object
      description: Partial update — field yang tidak dikirim tidak diubah. Minimal satu field. `vendor_id` tidak bisa diubah.
      properties:
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        product_class: { type: string, maxLength: 128, description: "String kosong = dikosongkan." }
        model_name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 255, description: "String kosong = dikosongkan." }
        is_active: { type: boolean }

    CreateDeviceModelRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        device_type_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        product_class: { type: string, nullable: true, maxLength: 128 }
        model_name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 255 }
      required: [vendor_id, device_type_id, data_model_version_id, model_name]

    VendorParameterMapping:
      type: object
      properties:
        id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true, description: "NULL = berlaku untuk seluruh model vendor ini pada data model version tsb; diisi untuk override spesifik satu model." }
        software_version_pattern: { type: string, nullable: true, description: "Pola SQL LIKE thd devices.software_version (migrations/0010). NULL = generik lintas versi. Mapping dgn pattern yang cocok lebih diprioritaskan saat Resolve()." }
        logical_key: { type: string, example: wifi.5g.ssid }
        tr069_path: { type: string, example: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.5.SSID" }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        value_scale: { type: number, format: double, description: "Pengali nilai mentah CPE -> satuan kanonik ACS (mis. 0.001 untuk 0,001 dBm; 1 = tanpa konversi)." }
        description: { type: string, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, vendor_id, data_model_version_id, logical_key, tr069_path]

    UpsertVendorParameterMappingRequest:
      type: object
      properties:
        vendor_id: { type: integer, format: int64 }
        data_model_version_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        software_version_pattern: { type: string, nullable: true, maxLength: 255 }
        logical_key: { type: string, maxLength: 128 }
        tr069_path: { type: string, maxLength: 512 }
        parameter_type_id: { type: integer, format: int64, nullable: true }
        value_scale: { type: number, format: double, nullable: true, minimum: 0.00001, maximum: 1000000, description: "Pengali nilai mentah CPE -> satuan kanonik (mis. 0.001 untuk 0,001 dBm). Kosong/null = 1. Di luar rentang = 400." }
        description: { type: string, nullable: true, maxLength: 255 }
      required: [vendor_id, data_model_version_id, logical_key, tr069_path]

    # ---------- Firmware ----------
    FirmwareFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firmware_uuid: { type: string, format: uuid }
        vendor_id: { type: integer, format: int64 }
        device_model_id: { type: integer, format: int64, nullable: true }
        version: { type: string }
        file_name: { type: string }
        storage_key:
          type: string
          description: "Object key di object storage (MinIO/S3-compatible) — BUKAN URL. Presigned GET URL digenerate on-demand terpisah (lihat `POST /devices/:id/firmware-upgrade`), tidak pernah disimpan/diekspos langsung di sini."
        file_size_bytes: { type: integer, format: int64, nullable: true }
        checksum_sha256: { type: string, nullable: true, description: "Selalu dihitung ulang di server saat upload, tidak pernah dipercaya dari client." }
        release_notes: { type: string, nullable: true }
        is_active: { type: boolean }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, firmware_uuid, vendor_id, version, file_name, storage_key, is_active]

    FirmwareFileListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareFile' }
        total: { type: integer }
      required: [data, total]

    UpdateFirmwareRequest:
      type: object
      description: Partial update metadata — field yang tidak dikirim tidak diubah. Minimal satu field. Isi file, checksum, dan targeting vendor/model tidak bisa diubah.
      properties:
        version: { type: string, maxLength: 64 }
        release_notes: { type: string, description: "String kosong = dikosongkan." }
        is_active: { type: boolean }

    UploadFirmwareRequest:
      type: object
      description: "`multipart/form-data` — bukan JSON."
      properties:
        vendor_id: { type: string, description: "Numerik, dikirim sebagai form field teks (bukan JSON number)." }
        device_model_id: { type: string, nullable: true, description: "Opsional, numerik sebagai teks." }
        version: { type: string }
        release_notes: { type: string, nullable: true }
        file:
          type: string
          format: binary
          description: "Isi file firmware. Maksimum 256 MiB."
      required: [vendor_id, version, file]

    ScheduleFirmwareUpgradeRequest:
      type: object
      properties:
        firmware_id: { type: integer, format: int64 }
        scheduled_at: { type: string, format: date-time, nullable: true }
      required: [firmware_id]

    FirmwareUpgradeJob:
      type: object
      description: "TIDAK memakai 7 kolom audit standar (tidak ada soft-delete pada entitas ini) — hanya `created_at/by` + `updated_at/by`."
      properties:
        id: { type: integer, format: int64 }
        job_uuid: { type: string, format: uuid }
        device_id: { type: integer, format: int64 }
        firmware_id: { type: integer, format: int64 }
        rollout_batch_id: { type: integer, format: int64, nullable: true, description: "Diisi bila job ini bagian dari staged rollout (`POST /firmware/rollout-batches`); NULL untuk upgrade satuan." }
        wave_number: { type: integer, nullable: true, description: "Nomor wave rollout tempat job ini dibuat; NULL untuk upgrade satuan." }
        task_id: { type: integer, format: int64, nullable: true }
        task_status_id: { type: integer, format: int64 }
        from_version: { type: string, nullable: true }
        to_version: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time }
        updated_by: { type: integer, format: int64, nullable: true }
      required: [id, job_uuid, device_id, firmware_id, task_status_id]

    FirmwareUpgradeJobListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareUpgradeJob' }
        total: { type: integer }
      required: [data, total]

    FirmwareRolloutBatch:
      type: object
      description: "Rencana canary/staged rollout firmware ke populasi device bertahap per wave (migrations/0011). Status via `ref_firmware_rollout_status` (PENDING / IN_PROGRESS / PAUSED_FAILURE_THRESHOLD / COMPLETED / CANCELLED — ambil label via `GET /refs/ref_firmware_rollout_status`)."
      properties:
        id: { type: integer, format: int64 }
        batch_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = rollout lintas-tenant/global." }
        firmware_file_id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64, nullable: true, description: "Kriteria seleksi populasi target." }
        device_model_id: { type: integer, format: int64, nullable: true, description: "Kriteria seleksi populasi target." }
        wave_percentage: { type: integer, description: "Persentase populasi asli per wave (1-100)." }
        max_failure_rate_percent: { type: integer, description: "Ambang failure rate per wave (%) sebelum batch di-PAUSE otomatis." }
        current_wave: { type: integer, description: "Wave terakhir yang sudah/sedang dijalankan." }
        status_id: { type: integer, format: int64 }
        notes: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true, description: "Waktu mulai terjadwal; NULL berarti wave 1 dipicu langsung saat batch dibuat." }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, batch_uuid, firmware_file_id, wave_percentage, max_failure_rate_percent, current_wave, status_id]

    FirmwareRolloutBatchListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FirmwareRolloutBatch' }
        total: { type: integer }
      required: [data, total]

    CreateRolloutBatchRequest:
      type: object
      properties:
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL (global) hanya boleh dibuat SUPERADMIN." }
        firmware_file_id: { type: integer, format: int64 }
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        wave_percentage: { type: integer, minimum: 1, maximum: 100, default: 10 }
        max_failure_rate_percent: { type: integer, minimum: 0, maximum: 100, default: 10 }
        notes: { type: string, nullable: true }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: "Bila diisi, wave pertama TIDAK langsung dipicu saat batch dibuat — menunggu sweeper `acsd` melewati waktu ini."
      required: [firmware_file_id]

    # ---------- Diagnostics ----------
    DeviceDiagnostic:
      type: object
      description: "`result` bertipe `domain.JSONRawMessage` — objek JSON apa adanya (bukan base64), `null` selama diagnostic belum selesai."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64, nullable: true }
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        result:
          type: object
          additionalProperties: true
          nullable: true
          description: "Objek JSON hasil diagnostic (mis. hasil ping/traceroute/WiFi scan). `null` sampai CPE mengirim event `8 DIAGNOSTICS COMPLETE`."
        executed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, device_id, diagnostic_type, status, created_at]

    DeviceDiagnosticListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceDiagnostic' }
        total: { type: integer }
      required: [data, total]

    TriggerDiagnosticRequest:
      type: object
      properties:
        diagnostic_type:
          type: string
          enum: [PING, TRACEROUTE, WIFI_SCAN, OPTICAL_POWER, SPEED_TEST]
        parameters:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: "Parameter diagnostik: `host` (wajib), opsional `timeout`, `block_size`, `repetitions` (PING), `tries`/`max_hops` (TRACEROUTE)."
      required: [diagnostic_type]

    # ---------- Generik tambahan ----------
    CountResponse:
      type: object
      description: "Envelope `{ \"count\": <int> }` yang dipakai beberapa endpoint agregat sederhana."
      properties:
        count: { type: integer }
      required: [count]

    MessageResponse:
      type: object
      description: "Envelope `{ \"message\": \"...\" }` untuk aksi asinkron yang tidak mengembalikan resource."
      properties:
        message: { type: string }
      required: [message]

    PushFileRequest:
      type: object
      description: "Body `POST /devices/{id}/push-file` — berkas diambil dari katalog `POST /files`, bukan diupload ulang di sini."
      properties:
        file_id:
          type: integer
          format: int64
          minimum: 1
          description: "`id` berkas dari `GET /files`. Nilai `0`/tidak diisi ditolak `400`."
      required: [file_id]

    # ---------- Device config snapshots (migrations/0014) ----------
    DeviceConfigSnapshot:
      type: object
      description: "Snapshot seluruh `device_parameters` device pada satu titik waktu — audit minimal (`created_at` saja)."
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        snapshot_data:
          type: object
          additionalProperties: true
          description: "Objek JSON key-value parameter TR-069 saat snapshot diambil."
        created_at: { type: string, format: date-time }
      required: [id, device_id, created_at]

    DeviceConfigSnapshotListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DeviceConfigSnapshot' }
        total: { type: integer }
      required: [data, total]

    # ---------- Webhooks (migrations/0013) ----------
    WebhookSubscription:
      type: object
      description: |
        Langganan satu jenis event pada satu URL. `secret` (HMAC) hanya muncul
        di response `POST /webhooks`, sekali — kolom DB `secret_enc` terenkripsi
        AES-GCM dan tidak pernah dikembalikan lagi.
      properties:
        id: { type: integer, format: int64 }
        subscription_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = langganan global (SUPERADMIN)." }
        event_type_id: { type: integer, format: int64 }
        name: { type: string }
        target_url: { type: string, format: uri }
        is_active: { type: boolean }
        description: { type: string, nullable: true }
        secret: { type: string, description: "HANYA pada response create. Hex 64 karakter.", nullable: true }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, subscription_uuid, event_type_id, name, target_url, is_active]

    WebhookSubscriptionListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        total: { type: integer }
      required: [data, total]

    CreateWebhookRequest:
      type: object
      properties:
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: "NULL (global) hanya SUPERADMIN. Non-superadmin: harus tenant sendiri."
        event_type:
          type: string
          enum: [DEVICE_FAULT, PARAMETER_VALUE_CHANGE, TASK_FAILED]
          description: "Kode `ref_webhook_event_types` yang sudah di-wire di usecase."
        name: { type: string, maxLength: 128 }
        target_url: { type: string, format: uri, maxLength: 500 }
        description: { type: string, nullable: true, maxLength: 255 }
      required: [event_type, name, target_url]

    UpdateWebhookRequest:
      type: object
      description: "`name` & `target_url` WAJIB (bukan partial). `is_active`/`description` opsional (`null` = tidak diubah). `event_type` TIDAK bisa diubah setelah langganan dibuat."
      properties:
        name: { type: string, maxLength: 128 }
        target_url: { type: string, format: uri, maxLength: 500 }
        is_active: { type: boolean, nullable: true }
        description: { type: string, nullable: true, maxLength: 255 }
      required: [name, target_url]

    WebhookDelivery:
      type: object
      description: "Satu percobaan pengiriman satu event ke satu langganan — tabel log volume tinggi, audit minimal."
      properties:
        id: { type: integer, format: int64 }
        delivery_uuid: { type: string, format: uuid }
        subscription_id: { type: integer, format: int64 }
        event_type_id: { type: integer, format: int64 }
        payload:
          type: object
          additionalProperties: true
          description: "Objek JSON payload event yang dikirim."
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        response_status: { type: integer, nullable: true, description: "HTTP status dari URL target pada percobaan terakhir." }
        error_message: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, delivery_uuid, subscription_id, event_type_id, status, attempt_count, max_attempts, created_at, updated_at]

    WebhookDeliveryListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/WebhookDelivery' }
        total: { type: integer }
      required: [data, total]

    # ---------- Files generik (migrations/0018) ----------
    GenericFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        file_uuid: { type: string, format: uuid }
        tenant_id: { type: integer, format: int64, nullable: true }
        file_type:
          type: string
          description: "Kode TR-069 file type."
          example: "3 Vendor Configuration File"
        vendor_id: { type: integer, format: int64, nullable: true }
        device_model_id: { type: integer, format: int64, nullable: true }
        version: { type: string, nullable: true }
        file_name: { type: string }
        storage_key: { type: string, description: "Object key di storage — BUKAN URL." }
        file_size_bytes: { type: integer, format: int64 }
      allOf:
        - $ref: '#/components/schemas/Audit'
      required: [id, file_uuid, file_type, file_name, storage_key, file_size_bytes]

    GenericFileListResponse:
      type: object
      description: "Envelope `data` + `meta` (bukan `total` datar) — konsisten dgn handler tag/preset/file."
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/GenericFile' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    UploadFileRequest:
      type: object
      description: "`multipart/form-data` — semua field numerik dikirim sebagai teks."
      properties:
        file: { type: string, format: binary, description: "Isi berkas. Maksimum 256 MiB." }
        file_type:
          type: string
          description: "Kode TR-069 file type — WAJIB (ditolak `400` bila kosong, dicek di `usecase/file.UploadFile`)."
          example: "3 Vendor Configuration File"
          enum:
            - "1 Firmware Upgrade Image"
            - "2 Web Content"
            - "3 Vendor Configuration File"
            - "4 Tone File"
            - "5 Ringer Melody File"
            - "Vendor Log File"
        file_name: { type: string, nullable: true, description: "Default: nama file asli dari multipart." }
        version: { type: string, nullable: true }
        vendor_id: { type: string, nullable: true, description: "Numerik sebagai teks. Nilai yang tidak bisa di-parse diabaikan (dianggap tidak diisi), bukan `400`." }
        device_model_id: { type: string, nullable: true, description: "Numerik sebagai teks. Nilai yang tidak bisa di-parse diabaikan, bukan `400`." }
      required: [file, file_type]

    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [total, page, limit]

    # ---------- Tags (migrations/0019) ----------
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = tag global." }
        name: { type: string }
        color: { type: string, nullable: true, example: "#1a73e8" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, created_at, updated_at]

    TagListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Tag' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    UpdateTagRequest:
      type: object
      description: Partial update — field yang tidak dikirim tidak diubah. Minimal satu field.
      properties:
        name: { type: string, maxLength: 255 }
        color: { type: string, maxLength: 7, description: "Hex #RRGGBB. String kosong = dikosongkan." }

    CreateTagRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        color: { type: string, nullable: true, maxLength: 7, example: "#1a73e8" }
      required: [name]

    AssignDeviceTagRequest:
      type: object
      properties:
        tag_id: { type: integer, format: int64 }
      required: [tag_id]

    # ---------- Presets (migrations/0019) ----------
    Preset:
      type: object
      description: |
        Preset gaya GenieACS. Engine (migrations/0021) menegakkan preset
        ber-`enforce=true` tiap sesi CWMP saat device menyimpang dari
        `configurations` (drift-heal). `precondition` = objek JSON dengan
        kosakata identik ZeroTouchRule; `configurations` = array op JSON.
        FR-18 TIDAK berlaku untuk preset (keputusan produk — lihat
        PRESET_ENGINE_DESIGN.md).
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64, nullable: true, description: "NULL = preset global." }
        name: { type: string }
        weight: { type: integer, description: "Urutan evaluasi — weight ASC; preset weight lebih besar menimpa saat key bentrok." }
        precondition:
          type: string
          description: 'JSON precondition, mis. `{"vendor_id":3,"software_version_pattern":"V9%"}`. `{}` = cocok semua device tenant.'
        configurations:
          type: string
          description: 'JSON array op, mis. `[{"op":"set_parameter","key":"wifi.ssid","value":"MyISP"}]`. v1: hanya `op:set_parameter` (`apply_profile`/`refresh` menyusul v1.1).'
        is_active: { type: boolean }
        enforce: { type: boolean, description: "Bila true: engine menegakkan preset ini tiap sesi (drift-heal). Default false — preset tersimpan tapi diabaikan engine." }
        channel: { type: string, nullable: true, description: "Grouping opsional (informasi UI, tidak mengubah evaluasi di v1)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, weight, is_active, enforce, created_at, updated_at]

    PresetListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Preset' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    CreatePresetRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        weight: { type: integer, default: 0 }
        precondition: { type: string, nullable: true, description: "JSON precondition (lihat skema Preset)." }
        configurations: { type: string, nullable: true, description: "JSON array op (lihat skema Preset)." }
        enforce: { type: boolean, default: false }
        channel: { type: string, nullable: true, maxLength: 64 }
      required: [name]

    UpdatePresetRequest:
      type: object
      description: "FULL replace field skalar."
      properties:
        name: { type: string, maxLength: 255 }
        weight: { type: integer }
        precondition: { type: string, nullable: true }
        configurations: { type: string, nullable: true }
        is_active: { type: boolean }
        enforce: { type: boolean }
        channel: { type: string, nullable: true, maxLength: 64 }
      required: [name]

    # ---------- Self-service (portal pelanggan, migrations/0020) ----------
    SelfServiceDevice:
      type: object
      description: "DTO SEMPIT untuk portal pelanggan — sengaja TIDAK mengekspos kredensial, tenant, atau kolom audit."
      properties:
        id: { type: integer, format: int64 }
        serial_number: { type: string }
        model: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
        status: { type: string, example: ONLINE }
        online: { type: boolean }
      required: [id, serial_number, status, online]

    SelfServiceDeviceListResponse:
      type: object
      properties:
        data:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/SelfServiceDevice' }
        total: { type: integer }
      required: [data, total]

    ChangeMyWiFiRequest:
      type: object
      description: "Minimal salah satu `ssid`/`passphrase` wajib diisi (dievaluasi setelah trim spasi)."
      properties:
        ssid: { type: string, nullable: true }
        passphrase: { type: string, format: password, nullable: true, minLength: 8, maxLength: 63, description: "Batas WPA-PSK; di luar 8–63 karakter ditolak `400`." }
        band:
          type: string
          nullable: true
          enum: ["", "2g", "2.4g", "5g"]
          description: |
            Dicocokkan case-insensitive di `selfservice.ChangeMyWiFi`. Nilai
            `""`, `2g`, dan `2.4g` sama-sama memakai logical key `wifi.ssid` /
            `wifi.wpa_passphrase`; `5g` memakai `wifi.5g.*`. Nilai lain
            ditolak `400`.
