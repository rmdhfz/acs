                file_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Task push file telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup atau device/file milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau File tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/add-object:
    post:
      operationId: addObjectDevice
      tags: [Devices]
      summary: Eksekusi RPC AddObject (FR-5)
      description: |
        ADMIN/SUPERADMIN. Menambahkan instance object baru (misalnya tabel WAN) di CPE via protokol CWMP.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_name]
              properties:
                object_name:
                  type: string
                  example: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection."
      responses:
        '202':
          description: Task AddObject telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akses ditolak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/delete-object:
    post:
      operationId: deleteObjectDevice
      tags: [Devices]
      summary: Eksekusi RPC DeleteObject (FR-5)
      description: |
