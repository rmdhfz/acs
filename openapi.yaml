      tags: [ZeroTouch]
      summary: Membuat aturan Zero-Touch Provisioning baru
      description: |
        ADMIN/SUPERADMIN. Rule dievaluasi urut `priority` ASC (angka lebih
        kecil dievaluasi lebih dulu) saat device baru mengirim event
        `0 BOOTSTRAP`. Non-superadmin hanya boleh membuat rule untuk tenant
        miliknya sendiri.
      security: [{ bearerAuth: [] }]
