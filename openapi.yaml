      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Daftar device model (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createDeviceModel
      tags: [Catalog]
      summary: Menambah model device baru milik vendor
      description: Superadmin only — bagian dari operasi data menambah dukungan vendor/model (lihat `POST /vendors`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceModelRequest' }
      responses:
        '201':
          description: Device model dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModel' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`model_name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor tidak ditemukan atau sudah dihapus."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Model dengan `model_name` yang sama sudah ada untuk vendor ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /device-models/{id}:
    get:
      operationId: getDeviceModel
      tags: [Catalog]
      summary: Detail satu device model
      description: |
        Semua role terautentikasi. Data referensi global lintas tenant.
