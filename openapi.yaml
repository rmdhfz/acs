          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Role di bawah ADMIN, atau ADMIN meminta user tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "User tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
