        - $ref: '#/components/parameters/ztRuleIdPath'
      responses:
        '204':
          description: Rule berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau rule milik tenant lain.
