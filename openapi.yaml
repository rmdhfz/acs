      tags: [Devices]
      summary: Update catatan/kredensial connection request device
      description: |
        ADMIN/NOC/SUPERADMIN. `connection_request_password` yang dikirim
        dienkripsi sebelum disimpan dan TIDAK PERNAH dikembalikan lagi lewat
        API manapun setelahnya. Partial update — field yang tidak dikirim tidak
        diubah.
      security: [{ bearerAuth: [] }]
