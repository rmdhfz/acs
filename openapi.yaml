  # ============================== DIAGNOSTICS ==============================
  /devices/{id}/diagnostics:
    post:
      operationId: triggerDiagnostic
      tags: [Diagnostics]
      summary: Trigger diagnostic test TR-069 pada device
      description: |
        ADMIN/NOC/SUPERADMIN. Menjalankan diagnostik standar TR-069 di CPE: `PING` atau `TRACEROUTE`
        (tipe lain `400`). `parameters`: `host` (wajib; hostname/IP), opsional `timeout` (ms),
        `block_size`, `repetitions` (ping 1–20) atau `tries`/`max_hops` (traceroute). Alur:
        SetParameterValues pemicu (logical key `diag.*` di-resolve per vendor/data model) →
        status `PENDING` → CPE menjalankan → event `8 DIAGNOSTICS COMPLETE` (atau poll cadangan 90 dtk)
        → GetParameterValues hasil → `COMPLETED`/`FAILED` dengan `result` terstruktur
        (`state`, `summary`, `hops`). Diagnostik yang menggantung >15 menit ditandai `FAILED`.
        Ditolak `429` bila kuota task queue tenant tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerDiagnosticRequest' }
      responses:
        '201':
          description: Diagnostic dibuat berstatus PENDING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDiagnostic' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `diagnostic_type` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listDiagnostics
      tags: [Diagnostics]
      summary: Histori diagnostic test milik device
      description: Semua role terautentikasi, tenant-scoped sama seperti `GET /devices/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
