            schema: { $ref: '#/components/schemas/ZeroTouchRuleRequest' }
      responses:
        '201':
          description: Rule dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZeroTouchRule' }
        '400':
