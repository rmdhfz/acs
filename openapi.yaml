          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/refresh:
    post:
      operationId: refreshDeviceTree
      tags: [Devices]
      summary: Telusuri pohon parameter perangkat secara rekursif
      description: |
        ADMIN/NOC/SUPERADMIN. Mengantre GetParameterNames per level (sampai `depth`, anggaran
        300 task) lalu GetParameterValues untuk daun. `path` kosong = root data model yang
        terdeteksi (TR-098/TR-181). Nama parameter dicatat tanpa menimpa nilai yang sudah ada.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, maxLength: 256, description: "Awalan objek, mis. `InternetGatewayDevice.`; kosong = root terdeteksi." }
                depth: { type: integer, minimum: 1, maximum: 8, default: 3 }
      responses:
        '202':
          description: Penelusuran diantrekan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: "Payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/set-parameter-values:
    post:
      operationId: setParameterValuesDevice
      tags: [Devices]
      summary: Eksekusi RPC SetParameterValues secara dinamis (FR-5)
      description: |
        ADMIN/SUPERADMIN. Menulis (set) satu atau lebih parameter raw secara langsung tanpa melalui Provisioning Profile.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                  example:
                    "InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSID": "WIFI_BARU"
      responses:
        '202':
          description: Task SetParameterValues telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `values` kosong (minimal 1)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /devices/{id}/apply-profile/{profileId}:
    post:
      operationId: applyProfile
      tags: [Provisioning]
      summary: Menerapkan provisioning profile ke device (eksplisit)
      description: |
        ADMIN/SUPERADMIN. Mengantre SATU task `SET_PARAMETER_VALUES` berisi
        seluruh parameter profile, lalu mengeset `provisioning_profile_id`
        device ke profile ini. SELALU dipanggil eksplisit (manual, atau
        otomatis dari evaluasi Zero-Touch Provisioning saat BOOTSTRAP) — lihat
        catatan FR-18 di `PUT /provisioning-profiles/:id`. Ditolak `429` bila
        kuota task queue tenant sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - name: profileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '201':
          description: Task SET_PARAMETER_VALUES yang diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` device/`profileId` tidak valid, atau profile tidak punya parameter untuk diterapkan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, device/profile milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== ZERO-TOUCH ==============================
  /zero-touch-rules:
    get:
      operationId: listZTRules
      tags: [ZeroTouch]
      summary: Daftar aturan Zero-Touch Provisioning
      description: |
        Semua role terautentikasi. Menampilkan rule tenant sendiri + rule
        global (`tenant_id: null`), terurut `priority` ASC. `tenant_id` di
        query hanya efektif untuk superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
      responses:
        '200':
          description: Daftar rule (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/ZeroTouchRule' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createZTRule
      tags: [ZeroTouch]
      summary: Membuat aturan Zero-Touch Provisioning baru
      description: |
        ADMIN/SUPERADMIN. Rule dievaluasi urut `priority` ASC (angka lebih
        kecil dievaluasi lebih dulu) saat device baru mengirim event
        `0 BOOTSTRAP`. Non-superadmin hanya boleh membuat rule untuk tenant
        miliknya sendiri.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZeroTouchRuleRequest' }
      responses:
        '201':
          description: Rule dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZeroTouchRule' }
        '400':
          description: "Payload tidak valid, `trigger_event_id` kosong/0, atau salah satu field pola melebihi batas panjang kolom. Catatan: `provisioning_profile_id` OPSIONAL sejak migrations/0009 (rule boleh hanya memicu reboot/firmware)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau non-superadmin mencoba membuat rule untuk tenant lain/global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /zero-touch-rules/{id}:
    get:
      operationId: getZTRule
      tags: [ZeroTouch]
      summary: Detail satu aturan Zero-Touch
      description: |
        Semua role terautentikasi. Rule milik tenant sendiri atau rule global (tanpa tenant, ikut tampil di list) boleh dibaca; rule tenant lain → `403`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ztRuleIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZeroTouchRule' }
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Rule milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Rule tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: updateZTRule
      tags: [ZeroTouch]
      summary: Update aturan Zero-Touch Provisioning (full update)
      description: ADMIN/SUPERADMIN, scope tenant sama seperti `POST /zero-touch-rules`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ztRuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZeroTouchRuleRequest' }
      responses:
        '204':
          description: Rule berhasil diupdate.
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau rule milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rule tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteZTRule
      tags: [ZeroTouch]
      summary: Soft-delete aturan Zero-Touch Provisioning
      description: ADMIN/SUPERADMIN, scope sama seperti `PUT /zero-touch-rules/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ztRuleIdPath'
      responses:
        '204':
          description: Rule berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau rule milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rule tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== CATALOG ==============================
  /vendors:
    get:
      operationId: listVendors
      tags: [Catalog]
      summary: Daftar vendor CPE
      description: |
        Semua role terautentikasi. Data referensi GLOBAL lintas tenant (FR-28)
        — TIDAK ada filter tenant sama sekali di endpoint katalog vendor/model/
        mapping (by design, ini "data referensi platform" bukan data tenant).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createVendor
      tags: [Catalog]
      summary: Menambah vendor CPE baru
      description: |
        Superadmin only. Menambah dukungan vendor baru adalah OPERASI DATA
        (insert ke `ref_vendors`/`vendor_ouis`/`device_models`/
        `vendor_parameter_mappings`), bukan perubahan kode — lihat juga
        `POST /vendors/:id/ouis`, `POST /device-models`,
        `POST /vendor-parameter-mappings`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVendorRequest' }
      responses:
        '201':
          description: Vendor dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400':
          description: "Payload tidak valid, `code`/`name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`code` vendor sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [Catalog]
      summary: Detail satu vendor
      description: |
        Semua role terautentikasi. Data referensi global lintas tenant.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updateVendor
      tags: [Catalog]
      summary: Ubah vendor (nama, deskripsi, aktif)
      description: |
        Superadmin only. Partial update — field yang tidak dikirim tidak diubah; `description` berisi string kosong = dikosongkan.
        `code` TIDAK bisa diubah (identitas stabil). Minimal satu field harus diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVendorRequest' }
      responses:
        '200':
          description: Data setelah diperbarui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400':
          description: "`id`/payload tidak valid, tidak ada field yang diisi, atau panjang melebihi batas kolom."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan superadmin."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteVendor
      tags: [Catalog]
      summary: Hapus (soft-delete) vendor
      description: |
        Superadmin only. OUI milik vendor ikut di-soft-delete. Ditolak `409` selama masih ada data aktif yang merujuk (pesan menyebut jumlah per jenis); jalan keluarnya menonaktifkan (`is_active=false`) alih-alih menghapus.
        Penghalang: device, device model, parameter mapping, firmware, profil provisioning, zero-touch rule, atau rollout batch aktif yang masih merujuk vendor ini.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      responses:
        '204':
          description: Berhasil dihapus (soft delete).
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan superadmin."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Vendor masih dipakai data aktif."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendors/{id}/ouis:
    get:
      operationId: listVendorOUIs
      tags: [Catalog]
      summary: Daftar OUI (prefix MAC) terdaftar milik vendor
      description: Semua role terautentikasi. Data global lintas tenant.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      responses:
        '200':
          description: Daftar OUI (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: addVendorOUI
      tags: [Catalog]
      summary: Mendaftarkan OUI baru milik vendor
      description: |
        Superadmin only. OUI dipakai me-resolve vendor device saat Inform (lihat
        `FindOrCreateFromInform`): device baru langsung di-resolve; device yang
        sudah ada tetapi `vendor_id`-nya masih kosong ter-resolve pada Inform
        berikutnya. OUI yang sebelumnya dihapus (`DELETE /vendors/{id}/ouis/{ouiId}`)
        bisa didaftarkan ulang — baris lama dihidupkan kembali (id dipertahankan).
        OUI yang masih aktif didaftarkan dua kali → `409`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddVendorOUIRequest' }
      responses:
        '201':
          description: OUI ditambahkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOUI' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau `oui` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor tidak ditemukan atau sudah dihapus."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: OUI sudah terdaftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vendors/{id}/ouis/{ouiId}:
    delete:
      operationId: deleteVendorOUI
      tags: [Catalog]
      summary: Hapus (soft-delete) satu OUI milik vendor
      description: |
        Superadmin only. OUI milik vendor lain atau yang sudah terhapus dijawab `404`. OUI yang sudah dihapus BISA didaftarkan ulang lewat `POST /vendors/{id}/ouis` (baris lama dihidupkan kembali).
        Catatan: device yang sudah ter-resolve ke vendor tidak berubah; hanya Inform baru yang terpengaruh.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/vendorIdPath'
        - $ref: '#/components/parameters/ouiIdPath'
      responses:
        '204':
          description: Berhasil dihapus (soft delete).
        '400':
          description: "`id` atau `ouiId` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan superadmin."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor atau OUI tidak ditemukan (OUI milik vendor lain juga dijawab 404)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /device-models:
    get:
      operationId: listDeviceModels
      tags: [Catalog]
