  # ============================== METRICS ==============================
  /metrics:
    get:
      operationId: metrics
      tags: [Metrics]
      summary: Metrik observability format Prometheus (bukan JSON)
      description: |
        **Format teks Prometheus** (`text/plain; version=0.0.4`), BUKAN JSON —
        beda dari SELURUH endpoint lain di API ini. Tanpa autentikasi sama
        sekali (konvensi umum Prometheus exporter — scraper Prometheus tidak
        mengirim Bearer token). Agregat READ-ONLY LINTAS SELURUH TENANT (mis.
        `acs_devices_by_status`, `acs_cwmp_sessions_open`,
        `acs_devices_by_vendor`) — di deployment produksi, endpoint ini WAJIB
        difirewall di level jaringan (hanya reachable dari subnet Prometheus
        scraper), BUKAN diandalkan level aplikasi, karena memang tidak ada
        autentikasi aplikasi di endpoint ini.
      security: []
      responses:
        '200':
          description: Metrik dalam format exposition Prometheus.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP acs_cwmp_sessions_open Jumlah sesi CWMP yang masih berstatus OPEN saat ini.
                  # TYPE acs_cwmp_sessions_open gauge
                  acs_cwmp_sessions_open 304

  # ============================== AUTH — OIDC (opsional) ==============================
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [Auth]
      summary: Mulai alur login OIDC (redirect ke Identity Provider)
      description: |
        Hanya aktif bila OIDC dikonfigurasi (`ACS_OIDC_*`). Endpoint browser
        redirect — BUKAN JSON. Mengembalikan `302` (`http.StatusFound`) ke
        authorization endpoint IdP. Tanpa autentikasi (titik masuk login).

        Proteksi login-CSRF/replay: server membuat `state` dan `nonce` acak
        (256 bit) per permintaan, menyisipkannya ke URL otorisasi, dan mengikatnya
        ke browser lewat cookie `acs_oidc_state` / `acs_oidc_nonce` (HttpOnly,
        SameSite=Lax, Secure bila https, path `/api/v1/auth/oidc`, berlaku 10 menit,
        sekali pakai). Browser WAJIB menerima cookie ini agar callback berhasil.
      security: []
      responses:
        '302':
          description: Redirect ke Identity Provider.
        '500':
          description: OIDC tidak dikonfigurasi/gagal membangun authorization URL di instance ini (handler mengembalikan `500`, bukan `404`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [Auth]
      summary: Callback OIDC — tukar authorization code jadi sesi
      description: |
        Dipanggil oleh browser setelah IdP meng-authorize user. Menukar
        authorization `code` menjadi ID token, lalu menautkan/menerbitkan user
        lokal. Tanpa autentikasi Bearer (identitas dibawa oleh `code`).

        Hasil: **redirect `302`** ke Console — sukses ke `{PUBLIC_URL}/sso#token=<JWT>`
        (token di FRAGMENT sehingga tidak ikut permintaan HTTP/log/Referer; respons
        `Cache-Control: no-store`), gagal ke `{PUBLIC_URL}/login?sso=error` (detail
        kegagalan hanya di log server). Akun dipetakan lewat **email** (bukan username),
        tidak ada auto-provisioning, dan SSO mengandalkan MFA di sisi IdP. Parameter `state` WAJIB cocok (perbandingan konstan-waktu) dengan cookie
        `acs_oidc_state` yang dipasang `GET /auth/oidc/login`, dan `nonce` di
        ID token wajib cocok dengan cookie `acs_oidc_nonce`; cookie dihapus di
        callback (berhasil maupun gagal). Klaim `email_verified` yang eksplisit
        `false` ditolak (klaim yang tidak dikirim IdP diterima).
      security: []
      parameters:
        - { name: code, in: query, required: true, description: "Authorization code dari IdP.", schema: { type: string } }
        - { name: state, in: query, required: true, description: "Nilai `state` yang dikembalikan IdP; harus sama dengan cookie `acs_oidc_state`.", schema: { type: string } }
      responses:
        '302':
          description: "Redirect ke Console: `/sso#token=...` (sukses) atau `/login?sso=error` (gagal verifikasi/pemetaan akun)."
        '400':
          description: "Query `code` kosong/tidak ada, atau `state` tidak valid/kedaluwarsa/cookie hilang (pesan sengaja tidak membedakan penyebabnya)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== REALTIME ==============================
  /ws:
    get:
      operationId: serveWs
      tags: [Sessions]
      summary: Upgrade WebSocket untuk push event realtime ke frontend
      description: |
        Meng-upgrade koneksi HTTP ke WebSocket (`Connection: Upgrade`). Setelah
        upgrade, server mem-push event JSON (task selesai/gagal, device
        online/offline, dsb.) yang ter-scope ke tenant actor. Autentikasi Bearer
        WAJIB pada request handshake. Tidak ada body response HTTP biasa.
        Event `NOTIFICATION` (`{id, type, severity, title, link}`) dikirim HANYA ke koneksi milik pengguna
        penerima (bukan seluruh tenant); detail lengkap diambil lewat `GET /notifications`.
      security: [{ bearerAuth: [] }]
      responses:
        '101':
          description: Switching Protocols — WebSocket terhubung.
        '400':
          description: Bukan permintaan upgrade WebSocket yang valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

