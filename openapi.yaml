                  message: { type: string }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/factory-reset:
    post:
      operationId: factoryResetDevice
      tags: [Devices]
      summary: Factory Reset perangkat
      description: |
        ADMIN/SUPERADMIN. Mengirim command factory reset ke perangkat. Ini akan menghapus konfigurasi ACS pada ONT.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Task factory reset telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup (NOC tidak dizinkan) atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/push-file:
    post:
      operationId: pushFileToDevice
      tags: [Devices]
      summary: Push file (konfigurasi/log) ke perangkat
      description: |
        ADMIN/NOC/SUPERADMIN. Mengirim file (misal konfigurasi TR-069) ke perangkat menggunakan command Download.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
