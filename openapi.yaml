          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba mengubah user tenant lain, ADMIN mencoba memberi role SUPERADMIN, atau mencoba mencabut role ADMIN dari diri sendiri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== DEVICES ==============================
  /devices:
    get:
      operationId: listDevices
      tags: [Devices]
      summary: Daftar device (inventory CPE)
      description: |
        Tiap baris membawa ringkasan untuk daftar: `rx_power_dbm`/`tx_power_dbm`/`optical_at` (metrik optik terakhir) dan
        `pppoe_username`; `null` = belum pernah terbaca dari perangkat (bukan nol). Isi lewat `POST /devices/refresh-summary`.
        Semua role terautentikasi. Non-superadmin otomatis difilter ke
        tenant-nya sendiri — parameter `tenant_id` di query hanya efektif untuk
        superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          description: |
            Mencocokkan ke `serial_number`, `mac_address`, `product_class`, dan — untuk kata kunci minimal 4 karakter —
            username PPPoE (parameter standar TR-098 `WANPPPConnection.N.Username` / TR-181 `PPP.Interface.N.Username`
            yang sudah tersinkron; lihat `POST /devices/refresh-summary`).
          schema: { type: string }
        - name: vendor_id
          in: query
          schema: { type: integer, format: int64 }
        - name: device_model_id
          in: query
          schema: { type: integer, format: int64 }
        - name: device_status_id
          in: query
          schema: { type: integer, format: int64 }
        - name: tag_id
          in: query
          description: |
            Filter device yang memiliki tag ini (`EXISTS` ke `device_tags`).
            Tetap tenant-scoped — filter tag DAN tenant di-AND. Kelola tag lewat
            `POST /devices/:id/tags`.
          schema: { type: integer, format: int64 }
        - name: optical_level
          in: query
          description: |
            Saring menurut RX pembacaan optik terakhir: `ok` (-25..-8 dBm), `warn` (-27..-25), `bad` (< -27 atau > -8,
            receiver overload), `unknown` (belum ada pembacaan RX). Nilai lain = 400.
          schema: { type: string, enum: [ok, warn, bad, unknown] }
        - name: no_vendor
          in: query
          description: "`true` = hanya device yang vendornya belum terpetakan (tampil \"Belum dikenal\")."
          schema: { type: boolean }
        - name: param
          in: query
          description: |
            Kondisi pada NILAI parameter yang dilaporkan CPE, bentuk `<nama>~<op>[~<nilai>]`; boleh diulang (maks 5, semuanya
            harus terpenuhi / AND). Operator: `eq` (sama, tidak peka huruf besar/kecil), `ne` (parameter ada dan berbeda),
            `like` (mengandung), `prefix` (berawalan), `gt`/`ge`/`lt`/`le` (numerik; nilai bukan angka tidak pernah cocok),
            `exists` (terisi), `missing` (belum ada/kosong). Nilai boleh memuat `~`. Nama parameter: huruf, angka, `.`, `_`, `-`
            (maks 256). Contoh: `param=InternetGatewayDevice.DeviceInfo.SoftwareVersion~prefix~V5&param=InternetGatewayDevice.X_ZTE.OpticalRx~lt~-25`.
            Parameter rahasia (password/passphrase/PSK) hanya boleh dipakai ADMIN/SUPERADMIN; peran lain 400.
          style: form
          explode: true
          schema: { type: array, maxItems: 5, items: { type: string } }
        - name: params
          in: query
          description: |
            Daftar nama parameter dipisah koma (maks 20) yang nilainya ikut dikirim pada tiap baris di field `parameters`
            (peta nama → nilai; parameter yang belum terisi tidak muncul). Satu query batch untuk satu halaman, tanpa N+1.
            Parameter rahasia hanya untuk ADMIN/SUPERADMIN.
          schema: { type: string }
        - name: fields
          in: query
          description: |
            Proyeksi: daftar kunci JSON dipisah koma; hanya kunci ini (dan `id`) yang dikirim. Kunci tak dikenal = 400.
            Mis. `fields=serial_number,software_version,parameters`.
          schema: { type: string }
        - name: sort
          in: query
          description: "Urutan hasil: nama kolom (naik) atau `-nama` (turun). Kolom: id, serial_number, last_inform_at, created_at, ip_address, software_version, product_class. Bawaan `id` menurun; `id` menjadi penentu urutan agar paginasi stabil."
          schema: { type: string }
        - name: vparams
          in: query
          description: |
            Nama virtual parameter dipisah koma (maks 10) yang nilainya ikut dikirim pada tiap baris di field `virtual`
            (peta nama → nilai; yang belum dapat dihitung tidak muncul). Satu query batch untuk satu halaman. Lihat `/virtual-parameters`.
          schema: { type: string }
        - name: last_inform_before
          in: query
          description: "Hanya device yang Inform terakhirnya SEBELUM waktu ini (RFC3339) — mis. yang sudah lama tidak terhubung."
          schema: { type: string, format: date-time }
        - name: last_inform_after
          in: query
          description: "Hanya device yang Inform terakhirnya pada/SETELAH waktu ini (RFC3339)."
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceListResponse' }
        '400':
          description: "Query bebas tidak valid: `param` (op/nama/jumlah), `params`, `fields` (kunci tak dikenal), `sort`, tanggal bukan RFC3339, atau parameter rahasia oleh peran tanpa hak."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id` (akun salah konfigurasi)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      operationId: createDevice
      tags: [Devices]
      summary: Pra-registrasi perangkat (sebelum CPE pertama kali Inform)
      description: |
        ADMIN+ (ADMIN dikunci ke tenant sendiri; SUPERADMIN WAJIB menyebut
        `tenant_id`). Membuat baris inventory bertatus `UNREGISTERED`; saat CPE
        dengan OUI+serial yang sama mengirim Inform memakai kredensial tenant
        tersebut, perangkat langsung terhubung (tenant sudah terkunci, tenant lain
        tidak bisa mengklaimnya). Vendor/model diisi otomatis dari katalog OUI bila
        tidak diberikan. Perangkat berstatus terhapus milik tenant yang sama dihidupkan
        kembali; milik tenant lain ditolak 409. Password connection request
        dienkripsi, tidak pernah dikembalikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceRequest' }
      responses:
        '201':
          description: Perangkat terdaftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400':
          description: Input tidak valid (OUI bukan 6 karakter alfanumerik, serial kosong, MAC/koordinat/URL salah, vendor/model/tenant tidak ada).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN+, atau ADMIN menarget tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: OUI+serial sudah terdaftar (atau tidak dapat didaftarkan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/refresh-summary:
    post:
      operationId: refreshDeviceSummary
      tags: [Devices]
      summary: Antre pembacaan ringkasan daftar (username PPPoE & level optik) untuk banyak device
      description: |
        ADMIN/NOC/SUPERADMIN. Untuk tiap device (maks. 100 id per permintaan; id ganda dihitung sekali) mengantre satu
        `GET_PARAMETER_VALUES` atas cabang koneksi WAN standar — TR-098 `InternetGatewayDevice.WANDevice.1.WANConnectionDevice.`
        atau TR-181 `Device.PPP.Interface.` sesuai data model yang terdeteksi dari parameter device — dan, bila vendor/model punya
        mapping `optical.*`, satu task polling optik. Device yang bukan milik tenant actor (non-superadmin), tidak ditemukan,
        atau belum diketahui data model-nya dilewati dan dilaporkan di `skipped`. Kuota task menunggu per tenant tetap berlaku:
        bila penuh, sisa device dilewati. Hasil muncul di `GET /devices` setelah perangkat Inform. Dicatat sebagai
        `REFRESH_DEVICE_SUMMARY` di audit trail.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_ids]
              properties:
                device_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, format: int64 }
      responses:
        '202':
          description: Task diantre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer, description: "Jumlah device yang pembacaannya diantre." }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: { type: integer, format: int64 }
                        reason: { type: string }
                required: [queued, skipped]
        '400':
          description: "`device_ids` kosong atau lebih dari 100."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/import:
    post:
      operationId: importDevices
      tags: [Devices]
      summary: Impor massal perangkat (pra-registrasi) dengan dry-run
      description: |
        ADMIN+. Maks. 1.000 baris per permintaan (klien memecah file besar).
        `?dry_run=true` hanya MENGKLASIFIKASI baris tanpa menulis apa pun —
        dipakai pratinjau: tiap baris menjadi `create` (baru), `update` (ada & berbeda,
        `changes` memuat nama field), `unchanged`, `skip` (ada & mode `skip`), atau
        `error` (alasan di `error`). Tanpa dry_run, baris dieksekusi dengan klasifikasi
        yang sama; baris diproses mandiri (bukan satu transaksi) sehingga baris gagal
        tidak menggagalkan yang lain. Kunci pencocokan: (OUI, serial). Sel kosong pada mode
        `update` = biarkan nilai lama. Perangkat milik tenant lain atau tanpa tenant
        (untuk ADMIN) dijawab error generik tanpa membocorkan pemilik. Satu entri audit
        `IMPORT_DEVICES` dicatat per eksekusi.
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDevicesRequest' }
      responses:
        '200':
          description: Hasil klasifikasi/eksekusi per baris.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDevicesResult' }
        '400':
          description: Mode salah, rows kosong, atau lebih dari 1.000 baris.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN+.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/stats:
    get:
      operationId: deviceStats
      tags: [Devices]
      summary: Agregat jumlah device per status dan per vendor
