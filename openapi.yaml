openapi: 3.0.3
info:
  title: ACS Multi-Vendor TR-069/CWMP REST API
  version: 1.0.0
  description: |
    REST API internal (Echo v5) untuk Auto Configuration Server (ACS) TR-069/CWMP
    multi-vendor (ZTE, Huawei, FiberHome, Nokia, C-Data, dst). Dikonsumsi oleh
    sistem BSS/OSS, portal NOC, dan integrasi internal lain — **BUKAN** endpoint
    yang dipakai CPE (ONT/ONU/router) itu sendiri.

    **PENTING — beda dengan endpoint CWMP:** perangkat CPE berkomunikasi dengan
    ACS lewat endpoint `/cwmp` (SOAP/XML, protokol TR-069/CWMP standar Broadband
    Forum, sesi stateful) yang **TIDAK** didokumentasikan di file ini sama
    sekali — beda protokol, beda tujuan, beda konsumen. Dokumen ini HANYA
    mencakup `/api/v1/*` (REST + JSON, kecuali `GET /api/v1/metrics` yang
    formatnya teks Prometheus).

    ## Autentikasi

    Hampir seluruh endpoint mewajibkan header `Authorization: Bearer <token>`,
    berupa salah satu dari:
    - **JWT sesi user** — didapat dari `POST /auth/login`, berlaku sesuai masa
      berlaku yang dikonfigurasi (`ACS_JWT_EXPIRY`, default 8 jam di `.env.example`).
    - **API token** — string berawalan `acs_...`, diterbitkan lewat
      `POST /auth/tokens` (ADMIN/SUPERADMIN). Umur maksimum **365 hari**:
      `expires_at` yang tidak diisi default ke 365 hari, yang lebih jauh dari itu
      atau sudah lewat ditolak `400`. Token abadi sengaja tidak ada (rotasi
      tahunan dipaksa).

    ## Header keamanan respons

    Setiap respons REST membawa `X-Content-Type-Options: nosniff`,
    `X-Frame-Options: DENY`, `Referrer-Policy: no-referrer`,
    `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`, dan
    `Cache-Control: no-store`. `Strict-Transport-Security` dikirim hanya bila
    request datang lewat https (langsung atau lewat proxy dengan
    `X-Forwarded-Proto: https`).

    Endpoint tanpa header `Authorization: Bearer` (`security: []` di operation
    masing-masing) — tidak ada yang benar-benar tanpa kontrol, hanya memakai
    mekanisme non-Bearer sesuai konteksnya:
    - **Titik masuk otentikasi** (mutasi, tapi tidak mungkin mewajibkan Bearer
      karena sesi belum ada): `POST /auth/login`, `POST /auth/mfa/verify`
      (tahap kedua MFA), `POST /auth/signup` & `POST /auth/signup/verify`
      (pendaftaran tenant mandiri), `POST /auth/forgot-password` & `POST
      /auth/reset-password` (reset via email). Kontrolnya: rate-limit ketat
      per-IP, lockout akun, token sekali-pakai berumur pendek, dan respons
      seragam (anti-enumeration) — lihat `description` tiap operation.
    - **Callback pihak ketiga**: `POST /billing/xendit/webhook` — Xendit tidak
      membawa JWT, diverifikasi lewat header `X-CALLBACK-TOKEN` (perbandingan
      waktu-konstan) + verifikasi ulang status/nominal ke gateway.
    - **Read-only/konfigurasi publik**: `GET /auth/config` (konfigurasi publik
      tanpa rahasia), `GET /auth/oidc/login` & `GET /auth/oidc/callback`
      (alur login OIDC — identitas dibawa oleh `code` dari IdP, bukan Bearer),
      serta `GET /metrics` (scrape Prometheus read-only, lihat catatan di
      endpoint tsb soal kenapa ini pengecualian yang aman).

    Di luar daftar ini, **tidak ada endpoint MUTASI tanpa autentikasi**.

    Token yang valid tapi tenant pemiliknya sudah dinonaktifkan (`is_active=false`)
    akan ditolak dengan `401` (`auth: tenant tidak aktif, hubungi administrator`)
    di request BERIKUTNYA setelah tenant dinonaktifkan, bukan menunggu token
    kedaluwarsa — dicek di setiap request, bukan hanya saat login.

    ## RBAC

    Empat role: `SUPERADMIN` (lintas seluruh tenant), `ADMIN` (di-scope ke satu
    tenant), `NOC` (operasional, di-scope ke satu tenant), `VIEWER` (read-only,
    di-scope ke satu tenant). `SUPERADMIN` selalu lolos cek role apa pun.
    Endpoint yang memuat data ter-scope tenant (device, task, provisioning
    profile, dst.) MEMFILTER otomatis ke tenant milik actor untuk role selain
    `SUPERADMIN` — parameter query `tenant_id` yang dikirim non-superadmin
    diabaikan/ditimpa, bukan dipercaya mentah. Endpoint yang mewajibkan role
    tertentu ditandai eksplisit di `description` tiap operation (mis.
    "Superadmin only" atau "ADMIN/SUPERADMIN, self-service ke tenant sendiri
    untuk ADMIN") karena skema OpenAPI sendiri tidak punya mekanisme native
    untuk RBAC granular selain `security` scheme umum.

    ## Kredensial tidak pernah plaintext

    Field kredensial (`cwmp_inform_password`, `connection_request_password`,
    password user) TIDAK PERNAH dikembalikan di response JSON manapun — hanya
    bisa di-*set*/rotate lewat request, tidak pernah dibaca kembali. Beberapa
    endpoint task generik (`GET /tasks`, `GET /tasks/:id`) me-redact field
    `url`/`username`/`password` di dalam `parameters` untuk role `NOC`/`VIEWER`
    (hanya `ADMIN`/`SUPERADMIN` yang melihat isi aslinya) — lihat deskripsi
    skema `Task`.

    ## Server

    Server di bawah ini adalah **instance dev/lokal** (port host sesuai
    `docker-compose.yml`, dipetakan dari container port 8080). Alamat/port di
    produksi PASTI berbeda — sesuaikan lewat variabel environment/reverse proxy
    deployment masing-masing, jangan asumsikan `localhost:18080` di lingkungan
    manapun selain dev lokal ini.
  contact:
    name: ACS Platform Team

servers:
  - url: http://localhost:18080/api/v1
    description: Dev lokal (docker-compose.yml — port host 18080 dipetakan ke container acsd:8080)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, penerbitan API token, dan self-service ganti password.
  - name: Tenants
    description: Manajemen tenant (multi-tenant, FR-26/27/28) — CRUD, aktivasi, branding, kredensial Inform CWMP, kuota task queue.
  - name: Users
    description: Manajemen user aplikasi dan role assignment per tenant.
  - name: Devices
    description: Inventory CPE (ONT/ONU/router) — status, parameter TR-069, event, metrik optik, aktivitas.
  - name: Tasks
    description: Antrean RPC CWMP (GetParameterValues, SetParameterValues, Reboot, Download, dst.).
  - name: VirtualParameters
    description: Nilai turunan (ekspresi deklaratif pkg/vexpr) yang dihitung dari parameter perangkat — padanan virtual parameter GenieACS tanpa skrip.
  - name: Faults
    description: cwmp:Fault aktif dari CPE per perangkat/RPC — perangkat mana menolak apa dan kenapa.
  - name: Provisioning
    description: Provisioning profile dan Zero-Touch Provisioning (ZTP) — FR-13..FR-18.
  - name: ZeroTouch
    description: Aturan pencocokan device baru saat event BOOTSTRAP (bagian dari Provisioning).
  - name: Catalog
    description: Katalog vendor CPE global lintas tenant — vendor, OUI, device model, vendor parameter mapping (FR-28).
  - name: Firmware
    description: Upload firmware ke object storage (MinIO/S3-compatible) dan penjadwalan upgrade (FR-19/20/21).
  - name: Diagnostics
    description: Trigger diagnostic test TR-069 standar (ping, traceroute, WiFi scan, dst.) dan hasilnya (FR-24).
  - name: Refs
    description: Tabel referensi/enum (`ref_*`) untuk menerjemahkan `*_id` ke label yang bisa dibaca.
  - name: Sessions
    description: Observability sesi CWMP (jumlah sesi OPEN di seluruh load balancer).
  - name: Audit
    description: Audit trail global (`activity_logs`) — aktivitas admin & perubahan data, tenant-scoped.
  - name: Webhooks
    description: Langganan webhook keluar (typed event → BSS/OSS/NMS) dan log delivery-nya (migrations/0013).
  - name: Files
    description: Berkas generik (config, log, firmware image) di object storage untuk di-push/di-pull CPE (migrations/0018).
  - name: Tags
    description: Tag/segmentasi device gaya GenieACS — label bebas per tenant + penempelan ke device (migrations/0019).
  - name: Presets
    description: Preset provisioning gaya GenieACS (precondition + configurations, migrations/0019).
  - name: SelfService
    description: Portal pelanggan (role `ENDUSER`) — hanya device yang dipetakan ke akun lewat `user_devices` (migrations/0020).
  - name: Notifications
    description: Notifikasi persisten (in-app + email) untuk staf Console — daftar, tandai baca, preferensi kanal, dan pengumuman SUPERADMIN (migrations/0030).
  - name: Console
    description: Fitur Console — susunan menu sidebar per pengguna, laporan bug (email ke operator), dan riwayat impor/ekspor per tenant (migrations/0033).
  - name: Billing
    description: Langganan SaaS lewat Xendit (Invoice API) — paket, status langganan, checkout, invoice, sinkronisasi, dan callback publik (migrations/0032). Bawaan MATI (`ACS_BILLING_ENABLED`).
  - name: Metrics
    description: Endpoint observability format Prometheus (bukan JSON), tanpa autentikasi.

paths:
  # ============================== AUTH ==============================
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login (email + password) dan menerbitkan JWT sesi user
      description: |
        Endpoint publik (tanpa autentikasi) — titik masuk satu-satunya untuk
        mendapatkan JWT. Login memakai EMAIL + password; field `username` tetap
        diterima untuk kompatibilitas skrip lama (bila `email` dan `username`
        sama-sama ada, `email` yang dipakai; email dicocokkan tanpa peka
        huruf besar/kecil). Password disimpan sebagai hash Argon2id; hash bcrypt
        lama otomatis di-upgrade saat login berhasil. Proteksi brute-force:
        akun dikunci 15 menit setelah 5 kali percobaan password salah
        berturut-turut (pemilik akun menerima email pemberitahuan); pesan error
        kunci akun SENGAJA disamarkan sama persis dengan "email atau password
        salah" (tidak membocorkan apakah akun terkunci atau memang salah
        password). Login ke akun milik tenant yang sudah dinonaktifkan ditolak
        dengan pesan terpisah (tenant tidak aktif) — SETELAH kredensial terbukti
        benar. JWT sesi dicabut otomatis bila password akun berubah setelah token
        terbit, atau akun dinonaktifkan/dihapus. Saat server sedang padat
        (antrean hashing Argon2 penuh) login menjawab 503 — bukan kredensial salah
        dan TIDAK dihitung sebagai percobaan gagal.

        **MFA:** bila akun mengaktifkan MFA TOTP, password yang benar belum memberi
        sesi — respons `200` berisi `{ "mfa_required": true, "mfa_token": "..." }`
        dan login diselesaikan lewat `POST /auth/mfa/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil (`LoginResponse`), atau langkah kedua dibutuhkan (`MfaRequiredResponse`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '400':
          description: Email (atau username) / password kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Kredensial salah, akun terkunci (brute-force), akun nonaktif, atau tenant pemilik akun nonaktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Server sibuk (antrean hashing penuh); coba lagi sebentar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Minta tautan reset password lewat email
      description: |
        Endpoint publik (tanpa autentikasi) — pemanggilnya justru user yang
        tidak bisa login. Kontrol: rate limit per-IP ketat, batas 3 permintaan
        per akun per jam, token sekali pakai berumur pendek (default 30 menit,
        hanya hash SHA-256 yang disimpan), dan respons SERAGAM (202) terlepas
        dari apakah email terdaftar/aktif atau terkena batas — supaya endpoint
        tidak bisa dipakai menebak email terdaftar. Email dikirim asinkron;
        tautan memakai fragment (`/reset-password#token=…`) agar token tidak
        masuk log server maupun header Referer. Bila SMTP belum dikonfigurasi,
        endpoint menjawab 503.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Permintaan diterima (jika email terdaftar, tautan dikirim).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Email kosong / payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limit per-IP terlampaui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Reset lewat email belum diaktifkan (SMTP belum dikonfigurasi).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Tetapkan password baru dengan token dari email
      description: |
        Endpoint publik, tetapi hanya berhasil dengan token sekali-pakai dari
        email. Token dikonsumsi secara atomik (satu dari sekian request paralel
        yang menang); password baru divalidasi SEBELUM token dihanguskan agar
        salah ketik tidak menghilangkan tautan. Setelah berhasil: lockout akun
        dibersihkan, semua token reset lain milik akun dimatikan, dan pemilik
        akun menerima email konfirmasi. Token tidak valid / terpakai /
        kedaluwarsa dijawab dengan satu pesan yang sama (400).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password berhasil diubah.
        '400':
          description: Token tidak valid/kedaluwarsa, atau password baru tidak memenuhi syarat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limit per-IP terlampaui.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Reset lewat email belum diaktifkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/tokens:
    post:
      operationId: issueAPIToken
      tags: [Auth]
      summary: Menerbitkan API token jangka panjang (`acs_...`)
      description: |
        ADMIN/SUPERADMIN. Non-superadmin hanya boleh menerbitkan token untuk
        tenant miliknya sendiri (`tenant_id` di body diabaikan/ditolak bila
        beda dari tenant actor). Nilai token PLAINTEXT hanya ditampilkan SEKALI
        di response ini — hanya hash-nya yang disimpan, tidak bisa diambil ulang.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAPITokenRequest'
      responses:
        '201':
          description: Token diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAPITokenResponse'
        '400':
          description: Payload tidak valid, `name` kosong, atau `expires_at` di masa lalu / lebih dari 365 hari dari sekarang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau non-superadmin mencoba menerbitkan token untuk tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      operationId: listAPITokens
      tags: [Auth]
      summary: Daftar API token yang pernah diterbitkan (untuk dikelola/dicabut)
      description: |
        ADMIN/SUPERADMIN — gating role SAMA seperti penerbitan token
        (`POST /auth/tokens`), bukan self-service ke semua role. Non-superadmin
        SELALU dipaksa ke tenant miliknya sendiri (parameter `tenant_id` diabaikan
        bila diisi tenant lain) dan melihat SELURUH token milik tenant tsb —
        bukan cuma token yang diterbitkan actor sendiri — supaya ADMIN bisa
        mencabut token yang diterbitkan ADMIN lain di tenant yang sama (mis.
        karyawan penerbit token sudah resign). Nilai `token` plaintext TIDAK
        pernah muncul di sini (hanya saat `POST /auth/tokens` pertama kali).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/tokens/{id}:
    delete:
      operationId: revokeAPIToken
      tags: [Auth]
      summary: Mencabut (revoke) satu API token
      description: |
        ADMIN/SUPERADMIN. Non-superadmin hanya boleh mencabut token milik
        tenant-nya sendiri — mencoba mencabut token tenant lain ditolak `403`,
        TIDAK PERNAH diam-diam berhasil. **Catatan jujur soal enumerasi**: `id`
        tidak ada sama sekali → `404`, `id` ada tapi milik tenant lain → `403`
        — kedua kode ini berbeda, sehingga non-superadmin YANG MENEBAK id
        secara berurutan bisa membedakan "id belum pernah dipakai" dari "id
        ini token milik tenant lain yang (pernah) ada". Diterima apa adanya
        (severity rendah — `id` adalah PK internal BIGINT sekuensial pada
        endpoint admin-only, bukan identifier publik, dan pola 404-vs-403 yang
        sama juga berlaku di endpoint lain di API ini), bukan dianggap
        kebocoran isi/kepemilikan token. Mencabut token yang sudah revoked
        sebelumnya tetap `204` (idempotent), bukan error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Token berhasil dicabut (atau memang sudah revoked sebelumnya).
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau non-superadmin mencoba mencabut token tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Token tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/password:
    patch:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Ganti password akun sendiri
      description: |
        Semua role yang sudah login boleh memanggil ini (tidak ada gating role)
        — actor diambil dari JWT/API token, BUKAN dari `:id` path (beda dari
        `PATCH /users/:id/password` yang itu admin mereset password user
        LAIN). Wajib menyertakan `current_password` yang benar; tanpa verifikasi
        ini siapa pun yang membajak bearer token bisa mengunci pemilik akun asli
        secara permanen. Pergantian password MENCABUT semua sesi JWT lama
        (termasuk milik pemanggil); respons berisi JWT baru agar pemanggil tetap
        login — simpan menggantikan token sebelumnya. Pemilik akun menerima
        email pemberitahuan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequest'
      responses:
        '200':
          description: Password berhasil diganti; JWT baru menggantikan token lama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Payload tidak valid, field kosong, atau `new_password` kurang dari 8 karakter / lebih dari 128 karakter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi, atau `current_password` salah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [Auth]
      summary: Konfigurasi publik halaman login (SSO / MFA tersedia?)
      description: |
        Endpoint publik read-only tanpa rahasia — dipakai Console untuk memutuskan
        apakah tombol "Masuk dengan SSO" ditampilkan (`sso_enabled`: OIDC
        dikonfigurasi, walau IdP sesaat tak terjangkau) dan apakah MFA TOTP tersedia
        di instalasi ini (`mfa_available`).
      security: []
      responses:
        '200':
          description: Konfigurasi publik.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sso_enabled: { type: boolean }
                  mfa_available: { type: boolean }
                  self_signup_enabled: { type: boolean }
                  sso_provider: { type: string, enum: ["", google, oidc], description: "Penyedia SSO: google = tombol resmi Masuk dengan Google; oidc = IdP lain; kosong = SSO tidak dikonfigurasi." }
                required: [sso_enabled, mfa_available, self_signup_enabled]

  /auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Profil akun yang sedang login
      description: |
        Semua role (termasuk ENDUSER). Dipakai SPA setelah login SSO, yang hanya
        membawa token (di fragment URL), untuk memuat profil.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profil akun.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  uuid: { type: string, format: uuid }
                  username: { type: string }
                  email: { type: string, format: email }
                  full_name: { type: string }
                  roles: { type: array, items: { type: string } }
                  tenant_id: { type: integer, format: int64, nullable: true }
                  mfa_enabled: { type: boolean }
                  impersonator_id: { type: integer, format: int64, description: "0 bila sesi biasa; id SUPERADMIN bila sesi ini impersonate." }
                required: [id, uuid, username, roles]
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/verify:
    post:
      operationId: verifyMfaLogin
      tags: [Auth]
      summary: Login tahap kedua — verifikasi kode TOTP / kode pemulihan
      description: |
        Endpoint publik (rate-limit per-IP seperti login). Kredensialnya adalah
        `mfa_token` dari respons `POST /auth/login` (berlaku 5 menit, BUKAN token
        sesi: ditolak di semua endpoint lain) ditambah `code`: 6 digit TOTP
        (RFC 6238, toleransi ±30 detik, tiap kode hanya berlaku SEKALI — replay
        ditolak) ATAU satu kode pemulihan sekali pakai (`XXXXX-XXXXX`).
        Kode salah dihitung ke lockout akun yang SAMA dengan password salah
        (5 kali → terkunci 15 menit); lockout TIDAK direset oleh tahap pertama.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token: { type: string }
                code: { type: string, minLength: 6, maxLength: 16, description: "6 digit TOTP atau kode pemulihan." }
              required: [mfa_token, code]
      responses:
        '200':
          description: Login berhasil — bentuk sama dengan `POST /auth/login`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Field kosong / payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Kode salah, `mfa_token` tidak valid/kedaluwarsa, akun terkunci/nonaktif, atau tenant nonaktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa:
    get:
      operationId: getMfaStatus
      tags: [Auth]
      summary: Status MFA akun sendiri
      description: Hanya sesi login (JWT); API token ditolak 403.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Status MFA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean, description: "Fitur MFA aktif di instalasi ini." }
                  enabled: { type: boolean }
                  recovery_codes_left: { type: integer }
                required: [available, enabled, recovery_codes_left]
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Dipanggil dengan API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [Auth]
      summary: Mulai enrol MFA — buat rahasia TOTP baru
      description: |
        Membuat rahasia TOTP (disimpan terenkripsi AES-GCM) dan mengembalikan
        `secret` (base32) + `otpauth_uri` (untuk QR di aplikasi authenticator).
        MFA belum aktif sampai `POST /auth/mfa/enable`. Memanggil ulang sebelum
        aktif mengganti rahasia lama. Hanya sesi login.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rahasia untuk diimpor ke aplikasi authenticator (jangan disimpan di sisi klien).
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
                required: [secret, otpauth_uri]
        '400':
          description: Fitur MFA tidak diaktifkan di instalasi ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Dipanggil dengan API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: MFA sudah aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/enable:
    post:
      operationId: enableMfa
      tags: [Auth]
      summary: Aktifkan MFA dengan membuktikan kode TOTP pertama
      description: |
        Memverifikasi kode 6 digit dari aplikasi authenticator, mengaktifkan MFA, dan
        mengembalikan 10 kode pemulihan sekali pakai — **hanya ditampilkan sekali**
        (server hanya menyimpan hash-nya).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$' }
              required: [code]
      responses:
        '200':
          description: MFA aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string }, example: ["K7M2P-9XQ4R"] }
                required: [recovery_codes]
        '400':
          description: Kode salah, belum setup, atau fitur tidak aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Dipanggil dengan API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: MFA sudah aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      tags: [Auth]
      summary: Nonaktifkan MFA akun sendiri
      description: |
        Wajib password DAN kode kedua (TOTP atau kode pemulihan) — token sesi curian
        saja tidak cukup untuk melucuti MFA. Sesi lain dicabut; respons membawa JWT
        baru. Kesalahan password/kode dihitung ke lockout akun.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, format: password }
                code: { type: string, minLength: 6, maxLength: 16 }
              required: [password, code]
      responses:
        '200':
          description: MFA nonaktif; JWT baru menggantikan token lama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Field kosong atau kode salah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi atau password salah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Dipanggil dengan API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: MFA belum aktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}/mfa:
    delete:
      operationId: resetUserMfa
      tags: [Users]
      summary: Admin melepas MFA akun lain
      description: |
        ADMIN (tenant yang sama) / SUPERADMIN. Untuk pemilik akun yang kehilangan
        perangkat dan kode pemulihan: rahasia & kode pemulihan dihapus, sesi akun
        dicabut, dan aksi tercatat di audit trail (`MFA_RESET`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '204':
          description: MFA dilepas.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN atau user di luar tenant pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}/devices:
    get:
      operationId: listUserDevices
      tags: [Users]
      summary: Perangkat yang tertaut ke akun pelanggan (ENDUSER)
      description: |
        ADMIN (tenant yang sama) / SUPERADMIN. Menampilkan perangkat yang dapat dilihat akun itu di portal
        "WiFi Saya" (`/self-service`). Hanya perangkat yang masih ada dan se-tenant dengan akun.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '200':
          description: Daftar perangkat tertaut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        serial_number: { type: string }
                        model: { type: string, nullable: true }
                        status: { type: string }
                  total: { type: integer }
                required: [data, total]
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau akun di luar tenant pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Akun tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}/devices/{deviceId}:
    put:
      operationId: linkUserDevice
      tags: [Users]
      summary: Tautkan perangkat ke akun pelanggan (ENDUSER)
      description: |
        ADMIN (tenant yang sama) / SUPERADMIN. Tanpa tautan ini akun ENDUSER tidak melihat perangkat apa pun di
        portal self-service. Syarat: akun ber-role **ENDUSER**; akun dan perangkat di tenant yang **sama**;
        maksimum 20 perangkat per akun. Idempoten. Tercatat di audit trail (`LINK_USER_DEVICE`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
        - { name: deviceId, in: path, required: true, description: ID numerik internal device., schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: Tertaut.
        '400':
          description: Akun bukan ENDUSER, atau akun & perangkat beda tenant / perangkat tanpa tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau akun/perangkat di luar tenant pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Akun atau perangkat tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Batas 20 perangkat per akun tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: unlinkUserDevice
      tags: [Users]
      summary: Lepas tautan perangkat dari akun pelanggan
      description: ADMIN (tenant yang sama) / SUPERADMIN. Idempoten (tautan tak ada = sukses); perangkat boleh sudah dihapus. Tercatat `UNLINK_USER_DEVICE`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
        - { name: deviceId, in: path, required: true, description: ID numerik internal device., schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: Tautan dilepas.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau akun di luar tenant pemanggil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Akun tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  /users/{id}/impersonate:
    post:
      operationId: impersonateUser
      tags: [Users]
      summary: SUPERADMIN masuk sebagai pengguna tenant (impersonate)
      description: |
        Untuk dukungan SaaS. **Hanya SUPERADMIN asli** (bukan sesi impersonate, bukan API token). Mengembalikan JWT **pendek
        (30 menit)** berperan sebagai target, membawa klaim `imp` (id SUPERADMIN) — tidak bisa diperpanjang. Target harus aktif,
        punya tenant aktif, dan bukan SUPERADMIN. Selama sesi ini: ganti password, MFA, penerbitan token API, impersonate lagi, endpoint
        platform (tenant, laporan SaaS) ditolak **403**; setiap baris audit memuat `impersonated_by`; token mati seketika bila
        SUPERADMIN asli dinonaktifkan/dicabut sesinya. `IMPERSONATE_START` dan `IMPERSONATE_END` tercatat.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '200':
          description: Token impersonate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_at: { type: string, format: date-time }
                  impersonator_id: { type: integer, format: int64 }
                  user:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      uuid: { type: string, format: uuid }
                      username: { type: string }
                      roles: { type: array, items: { type: string } }
                      tenant_id: { type: integer, format: int64, nullable: true }
                required: [access_token, token_type, expires_at, impersonator_id, user]
        '400':
          description: Target adalah diri sendiri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN, sesi impersonate, API token, atau target tak boleh di-impersonate (SUPERADMIN/nonaktif/tanpa tenant).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Tenant target nonaktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/impersonation/end:
    post:
      operationId: endImpersonation
      tags: [Auth]
      summary: Akhiri sesi impersonate (catat di audit)
      description: Hanya valid dengan token impersonate. Klien membuang token itu dan kembali ke sesi SUPERADMIN asli. Tercatat `IMPERSONATE_END`.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Dicatat.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Token bukan token impersonate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reports/saas:
    get:
      operationId: getSaaSReport
      tags: [Reports]
      summary: Laporan SaaS platform (SUPERADMIN)
      description: |
        Ukuran pelanggan & pemakaian untuk operator platform: metrik platform, baris per tenant (perangkat/online, pengguna aktif,
        task 30 hari, antrean vs kuota, sesi, inform terakhir, **kesehatan** `sehat|perhatian|nonaktif` + alasan), distribusi vendor,
        dan tren harian 30 hari. Hanya SUPERADMIN asli (sesi impersonate 403).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Laporan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSReport' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reports/saas/tenants.csv:
    get:
      operationId: exportSaaSTenantsCSV
      tags: [Reports]
      summary: Unduh tabel tenant laporan SaaS (CSV)
      description: CSV UTF-8 (BOM) untuk manajemen. Sel yang diawali `= + - @` dinetralkan (anti CSV injection). Hanya SUPERADMIN asli.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Berkas CSV.
          content:
            text/csv:
              schema: { type: string }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  /auth/signup:
    post:
      operationId: signupTenant
      tags: [Auth]
      summary: Pendaftaran tenant mandiri (self-signup)
      description: |
        **Bawaan MATI** (`ACS_SELF_SIGNUP=true` + SMTP). Publik, dibatasi laju ketat per IP. Tenant & admin TIDAK dibuat di sini:
        hanya pendaftaran tertunda (hash token + hash password) yang disimpan, lalu email berisi tautan verifikasi dikirim
        (`/verify-signup#token=...`, berlaku 24 jam). Respons **seragam** (202) baik untuk email baru maupun yang sudah terdaftar
        atau terkena batas per email — tidak membocorkan keberadaan akun. Field `website` adalah honeypot (harus kosong; bot yang
        mengisinya tampak sukses tanpa efek). Batas: 5 per IP/jam, 3 per email/hari, plafon harian platform (`ACS_SIGNUP_DAILY_CAP`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name: { type: string, minLength: 3, maxLength: 128 }
                full_name: { type: string, minLength: 2, maxLength: 128 }
                email: { type: string, format: email, maxLength: 191 }
                password: { type: string, format: password, minLength: 10, maxLength: 128, description: "Tidak boleh memuat email atau nama perusahaan." }
                accept_terms: { type: boolean, description: "Harus true." }
                website: { type: string, description: "Honeypot — biarkan kosong." }
              required: [company_name, full_name, email, password, accept_terms]
      responses:
        '202':
          description: Diterima (tautan verifikasi dikirim bila data valid).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Validasi gagal (nama, email, password, persetujuan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Pendaftaran mandiri tidak diaktifkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Batas per IP tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Plafon harian pendaftaran platform tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/signup/verify:
    post:
      operationId: verifySignup
      tags: [Auth]
      summary: Verifikasi email pendaftaran — membuat tenant & admin pertama
      description: |
        Memakai token dari email (sekali pakai, atomik: klik ganda/paralel tidak membuat dua tenant). Membuat tenant (kode dari nama +
        sufiks acak), admin pertama (peran ADMIN, password hasil pendaftaran), dan menerapkan **batas paket awal**
        (`ACS_SIGNUP_MAX_DEVICES`, `ACS_SIGNUP_MAX_PENDING_TASKS`). Gagal di tengah jalan = tenant setengah jadi dihapus dan tautan
        bisa dicoba lagi. Token tidak valid/kedaluwarsa/terpakai = pesan seragam.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '200':
          description: Tenant & admin dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_code: { type: string }
                  tenant_name: { type: string }
                  email: { type: string, format: email }
        '400':
          description: Token tidak valid, kedaluwarsa, atau sudah dipakai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Pendaftaran mandiri tidak diaktifkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}/device-limit:
    patch:
      operationId: setTenantDeviceLimit
      tags: [Tenants]
      summary: Atur batas perangkat tenant (paket SaaS)
      description: |
        SUPERADMIN. `max_devices` null = tak dibatasi. Setelah batas tercapai: Inform perangkat BARU dijawab **503** (+ `Retry-After`,
        tidak ada baris dibuat), pra-registrasi `POST /devices` dan baris impor ditolak (**429**); perangkat yang sudah ada tidak
        terganggu. Pengecekan cek-lalu-tulis (pendaftaran serentak dapat melampaui sedikit).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, description: ID numerik internal tenant., schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_devices: { type: integer, minimum: 0, maximum: 10000000, nullable: true }
      responses:
        '204':
          description: Tersimpan.
        '400':
          description: Nilai tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ============================== REFS ==============================
  /refs/{table}:
    get:
      operationId: listRefs
      tags: [Refs]
      summary: Daftar baris tabel referensi/enum (`ref_*`)
      description: |
        Nama tabel divalidasi lewat whitelist tetap di server
        (`repository/mysql/ref_repository.go`). Nama di luar whitelist ditolak
        `400` (`domain.ErrInvalidInput`), TIDAK diteruskan mentah ke SQL.
        `ref_webhook_event_types` termasuk whitelist (dipakai membuat langganan
        webhook dan dispatch event). Catatan: `ref_parameter_types` hanya punya `code`;
        `name` diisi sama dengan `code`.
        Semua role terautentikasi boleh membaca (data referensi bukan data
        sensitif per-tenant), tidak ada `RequireRoles` di router.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: table
          in: path
          required: true
          description: Nama tabel referensi (harus salah satu nilai whitelist).
          schema:
            type: string
            example: ref_device_status
            enum:
              - ref_vendors
              - ref_device_types
              - ref_data_model_versions
              - ref_event_codes
              - ref_task_types
              - ref_task_status
              - ref_device_status
              - ref_parameter_types
              - ref_roles
              - ref_ztp_trigger_event
              - ref_firmware_rollout_status
      responses:
        '200':
          description: Daftar baris referensi.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/RefLookup' }
        '400':
          description: Nama tabel tidak dikenal/di luar whitelist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== TENANTS ==============================
  /tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Membuat tenant baru
      description: Superadmin only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: Tenant dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: Payload tidak valid, `code`/`name` kosong, atau `cwmp_inform_password` kurang dari 16 karakter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`code` tenant sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: Daftar seluruh tenant
      description: Superadmin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [Tenants]
      summary: Info branding tenant milik actor sendiri
      description: |
        Semua role terautentikasi boleh memanggil (bukan cuma superadmin) —
        dipakai frontend untuk resolve branding (nama, logo, warna aksen) tanpa
        membocorkan field sensitif (`cwmp_inform_username`, kolom audit
        internal). Actor tanpa `tenant_id` (superadmin lintas-tenant)
        mengembalikan `204 No Content`, BUKAN error — frontend disarankan
        fallback ke branding default.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Branding tenant milik actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentTenant' }
        '204':
          description: Actor tidak terikat ke tenant mana pun (mis. superadmin global) — tidak ada body.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Detail satu tenant
      description: |
        ADMIN/SUPERADMIN. Superadmin ke tenant manapun; ADMIN hanya tenant-nya sendiri (tenant lain → `403`). Memuat `cwmp_inform_username` (itu sebabnya role di bawah ADMIN ditolak); password CWMP tidak pernah diekspos.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Role di bawah ADMIN, atau ADMIN meminta tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Tenant tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteTenant
      tags: [Tenants]
      summary: Hapus (soft-delete) tenant
      description: |
        Superadmin only. Ditolak `409` selama tenant masih punya **user atau device aktif** (pesan menyebut jumlahnya) — menghapusnya akan membuat data itu yatim. Untuk menghentikan akses tanpa menghapus data, pakai `PATCH /tenants/{id}` dengan `is_active=false` (token yang sudah terbit pun langsung ditolak). Tenant milik akun yang sedang dipakai tidak boleh dihapus.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      responses:
        '204':
          description: Berhasil dihapus (soft delete).
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Bukan superadmin, atau mencoba menghapus tenant milik akun sendiri."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Tenant tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Tenant masih punya user/device aktif."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update tenant (kode/nama/aktivasi)
      description: |
        Superadmin only. `is_active=false` langsung menolak login/akses SEMUA
        user milik tenant ini pada request berikutnya — termasuk bearer token
        yang sudah diterbitkan sebelumnya (dicek ulang tiap request, bukan
        menunggu token kedaluwarsa). Partial update: field yang tidak dikirim
        (`null`/tidak ada di body) tidak diubah.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantRequest' }
      responses:
        '200':
          description: Tenant setelah diupdate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: "`id` path tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

