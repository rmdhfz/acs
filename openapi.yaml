  # ============================== TASKS ==============================
  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: Daftar task (antrean RPC CWMP)
      description: |
        Semua role terautentikasi. Non-superadmin otomatis difilter ke tenant
        miliknya (lewat JOIN ke device pemilik task — task tidak punya
        `tenant_id` langsung). Untuk role `NOC`/`VIEWER`, field `url`/
        `username`/`password` di dalam `parameters` task tipe Download/Upload
        (mis. presigned URL firmware) DIREDAKSI menjadi `"[redacted]"` —
        hanya `ADMIN`/`SUPERADMIN` melihat isi aslinya.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: device_id
          in: query
          schema: { type: integer, format: int64 }
        - name: task_status_id
          in: query
          schema: { type: integer, format: int64 }
        - name: task_type
          in: query
          description: Kode `ref_task_types`, mis. `REBOOT`, `DOWNLOAD`.
          schema: { type: string }
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Membuat task RPC CWMP baru untuk sebuah device
      description: |
        ADMIN/NOC/SUPERADMIN. Non-superadmin hanya bisa membuat task untuk
        device milik tenant-nya sendiri. `priority` default 5 bila 0 dikirim
        (1 = tertinggi, 9 = terendah), `max_retries` default 3 bila 0. Ditolak
        `429` bila tenant pemilik device sudah mencapai `max_pending_tasks`
        (kuota task queue tenant, lihat `PATCH /tenants/:id/task-quota`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "Payload tidak valid, `device_id`/`task_type` kosong, atau `task_type` tidak dikenal di `ref_task_types`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tasks/stats:
    get:
      operationId: taskStats
      tags: [Tasks]
      summary: Agregat jumlah task per status
      description: |
        Semua role terautentikasi, tenant-scoped sama seperti `GET /tasks`.
        Response array POLOS (TIDAK dibungkus `data`/`total`, beda dari
        kebanyakan endpoint list lain).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Statistik task per status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskStatusCount' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Detail satu task
      description: |
        Semua role terautentikasi, tenant-scoped sama seperti `GET /tasks`
        (redaksi `parameters` untuk NOC/VIEWER berlaku juga di sini).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/taskIdPath'
      responses:
        '200':
          description: Detail task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Task milik device tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Task tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [Tasks]
      summary: Membatalkan task yang belum selesai
      description: ADMIN/NOC/SUPERADMIN, tenant-scoped sama seperti `GET /tasks/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/taskIdPath'
      responses:
        '204':
          description: Task berhasil dibatalkan.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau task milik device tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Task tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== PROVISIONING ==============================
  /provisioning-profiles:
    get:
      operationId: listProfiles
      tags: [Provisioning]
      summary: Daftar provisioning profile
      description: |
        Semua role terautentikasi. Menampilkan profile milik tenant sendiri
        DITAMBAH profile global (`tenant_id: null`, dibuat superadmin sebagai
        default lintas tenant). Parameter `tenant_id` di query hanya efektif
        untuk superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningProfileListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createProfile
      tags: [Provisioning]
      summary: Membuat provisioning profile baru
      description: |
        ADMIN/SUPERADMIN. Non-superadmin hanya boleh membuat profile untuk
        tenant miliknya sendiri (`tenant_id: null`/profile global HANYA bisa
        dibuat superadmin).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProfileRequest' }
      responses:
        '201':
          description: Profile dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningProfile' }
        '400':
          description: "Payload tidak valid atau `name` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau non-superadmin mencoba membuat profile untuk tenant lain/profile global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /provisioning-profiles/{id}:
    get:
      operationId: getProfile
      tags: [Provisioning]
      summary: Detail profile beserta daftar parameternya
      description: |
        Semua role terautentikasi — boleh membaca profile tenant sendiri ATAU
        profile global (`tenant_id: null`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      responses:
        '200':
          description: Detail profile + parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningProfileDetail' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Profile milik tenant lain (bukan global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: updateProfile
      tags: [Provisioning]
      summary: Update profile (full update) beserta parameternya
      description: |
        ADMIN/SUPERADMIN. Profile global (`tenant_id: null`) HANYA bisa diedit
        superadmin (mencegah satu tenant diam-diam mengubah default bersama).
        Bila field `parameters` dikirim (non-null), SELURUH parameter lama
        profile diganti (replace, bukan merge); bila tidak dikirim, parameter
        yang sudah ada tidak disentuh.

        **PENTING (FR-18):** mengubah profile ini TIDAK otomatis mendorong
        ulang konfigurasi ke device yang SUDAH terprovisioning dengan profile
        ini sebelumnya — ini keputusan produk yang disengaja. Untuk menerapkan
        perubahan ke device tertentu, panggil eksplisit
        `POST /devices/:id/apply-profile/:profileId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '204':
          description: Profile berhasil diupdate.
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, profile tenant lain, atau non-superadmin mencoba mengedit profile global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteProfile
      tags: [Provisioning]
      summary: Soft-delete profile
      description: ADMIN/SUPERADMIN, scope sama seperti `PUT /provisioning-profiles/:id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/profileIdPath'
      responses:
        '204':
          description: Profile berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, profile tenant lain, atau non-superadmin mencoba menghapus profile global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/reboot:
    post:
      operationId: rebootDevice
      tags: [Devices]
      summary: Reboot perangkat
      description: |
        ADMIN/NOC/SUPERADMIN. Mengirim command reboot (event 'M Reboot') ke perangkat.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Task reboot telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
