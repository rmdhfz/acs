      operationId: listZTRules
      tags: [ZeroTouch]
      summary: Daftar aturan Zero-Touch Provisioning
      description: |
        Semua role terautentikasi. Menampilkan rule tenant sendiri + rule
        global (`tenant_id: null`), terurut `priority` ASC. `tenant_id` di
        query hanya efektif untuk superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
      responses:
        '200':
          description: Daftar rule (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/ZeroTouchRule' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
