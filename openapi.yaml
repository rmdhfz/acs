openapi: 3.0.3
info:
  title: ACS Multi-Vendor TR-069/CWMP REST API
  version: 1.0.0
  description: |
    REST API internal (Echo v5) untuk Auto Configuration Server (ACS) TR-069/CWMP
    multi-vendor (ZTE, Huawei, FiberHome, Nokia, C-Data, dst). Dikonsumsi oleh
    sistem BSS/OSS, portal NOC, dan integrasi internal lain — **BUKAN** endpoint
    yang dipakai CPE (ONT/ONU/router) itu sendiri.

    **PENTING — beda dengan endpoint CWMP:** perangkat CPE berkomunikasi dengan
    ACS lewat endpoint `/cwmp` (SOAP/XML, protokol TR-069/CWMP standar Broadband
    Forum, sesi stateful) yang **TIDAK** didokumentasikan di file ini sama
    sekali — beda protokol, beda tujuan, beda konsumen. Dokumen ini HANYA
    mencakup `/api/v1/*` (REST + JSON, kecuali `GET /api/v1/metrics` yang
    formatnya teks Prometheus).

    ## Autentikasi

    Hampir seluruh endpoint mewajibkan header `Authorization: Bearer <token>`,
    berupa salah satu dari:
    - **JWT sesi user** — didapat dari `POST /auth/login`, berlaku sesuai masa
      berlaku yang dikonfigurasi (`ACS_JWT_EXPIRY`, default 8 jam di `.env.example`).
    - **API token** — string berawalan `acs_...`, diterbitkan lewat
      `POST /auth/tokens` (ADMIN/SUPERADMIN), tidak pernah kedaluwarsa kecuali
      `expires_at` diisi.

    Dua endpoint publik tanpa autentikasi: `POST /auth/login` (untuk mendapatkan
    token) dan `GET /metrics` (scrape Prometheus read-only, lihat catatan di
    endpoint tsb soal kenapa ini pengecualian yang aman).

    Token yang valid tapi tenant pemiliknya sudah dinonaktifkan (`is_active=false`)
    akan ditolak dengan `401` (`auth: tenant tidak aktif, hubungi administrator`)
    di request BERIKUTNYA setelah tenant dinonaktifkan, bukan menunggu token
    kedaluwarsa — dicek di setiap request, bukan hanya saat login.

    ## RBAC

    Empat role: `SUPERADMIN` (lintas seluruh tenant), `ADMIN` (di-scope ke satu
    tenant), `NOC` (operasional, di-scope ke satu tenant), `VIEWER` (read-only,
    di-scope ke satu tenant). `SUPERADMIN` selalu lolos cek role apa pun.
    Endpoint yang memuat data ter-scope tenant (device, task, provisioning
    profile, dst.) MEMFILTER otomatis ke tenant milik actor untuk role selain
    `SUPERADMIN` — parameter query `tenant_id` yang dikirim non-superadmin
    diabaikan/ditimpa, bukan dipercaya mentah. Endpoint yang mewajibkan role
    tertentu ditandai eksplisit di `description` tiap operation (mis.
    "Superadmin only" atau "ADMIN/SUPERADMIN, self-service ke tenant sendiri
    untuk ADMIN") karena skema OpenAPI sendiri tidak punya mekanisme native
    untuk RBAC granular selain `security` scheme umum.

    ## Kredensial tidak pernah plaintext

    Field kredensial (`cwmp_inform_password`, `connection_request_password`,
    password user) TIDAK PERNAH dikembalikan di response JSON manapun — hanya
    bisa di-*set*/rotate lewat request, tidak pernah dibaca kembali. Beberapa
    endpoint task generik (`GET /tasks`, `GET /tasks/:id`) me-redact field
    `url`/`username`/`password` di dalam `parameters` untuk role `NOC`/`VIEWER`
    (hanya `ADMIN`/`SUPERADMIN` yang melihat isi aslinya) — lihat deskripsi
    skema `Task`.

    ## Server

    Server di bawah ini adalah **instance dev/lokal** (port host sesuai
    `docker-compose.yml`, dipetakan dari container port 8080). Alamat/port di
    produksi PASTI berbeda — sesuaikan lewat variabel environment/reverse proxy
    deployment masing-masing, jangan asumsikan `localhost:18080` di lingkungan
    manapun selain dev lokal ini.
  contact:
    name: ACS Platform Team

servers:
  - url: http://localhost:18080/api/v1
    description: Dev lokal (docker-compose.yml — port host 18080 dipetakan ke container acsd:8080)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, penerbitan API token, dan self-service ganti password.
  - name: Tenants
    description: Manajemen tenant (multi-tenant, FR-26/27/28) — CRUD, aktivasi, branding, kredensial Inform CWMP, kuota task queue.
  - name: Users
    description: Manajemen user aplikasi dan role assignment per tenant.
  - name: Devices
    description: Inventory CPE (ONT/ONU/router) — status, parameter TR-069, event, metrik optik, aktivitas.
  - name: Tasks
    description: Antrean RPC CWMP (GetParameterValues, SetParameterValues, Reboot, Download, dst.).
  - name: Provisioning
    description: Provisioning profile dan Zero-Touch Provisioning (ZTP) — FR-13..FR-18.
  - name: ZeroTouch
    description: Aturan pencocokan device baru saat event BOOTSTRAP (bagian dari Provisioning).
  - name: Catalog
    description: Katalog vendor CPE global lintas tenant — vendor, OUI, device model, vendor parameter mapping (FR-28).
  - name: Firmware
    description: Upload firmware ke object storage (MinIO/S3-compatible) dan penjadwalan upgrade (FR-19/20/21).
  - name: Diagnostics
    description: Trigger diagnostic test TR-069 standar (ping, traceroute, WiFi scan, dst.) dan hasilnya (FR-24).
  - name: Refs
    description: Tabel referensi/enum (`ref_*`) untuk menerjemahkan `*_id` ke label yang bisa dibaca.
  - name: Sessions
    description: Observability sesi CWMP (jumlah sesi OPEN di seluruh load balancer).
  - name: Webhooks
    description: Langganan webhook keluar (typed event → BSS/OSS/NMS) dan log delivery-nya (migrations/0013).
  - name: Files
    description: Berkas generik (config, log, firmware image) di object storage untuk di-push/di-pull CPE (migrations/0018).
  - name: Tags
    description: Tag/segmentasi device gaya GenieACS — label bebas per tenant + penempelan ke device (migrations/0019).
  - name: Presets
    description: Preset provisioning gaya GenieACS (precondition + configurations, migrations/0019).
  - name: SelfService
    description: Portal pelanggan (role `ENDUSER`) — hanya device yang dipetakan ke akun lewat `user_devices` (migrations/0020).
  - name: Metrics
    description: Endpoint observability format Prometheus (bukan JSON), tanpa autentikasi.

paths:
  # ============================== AUTH ==============================
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login dan menerbitkan JWT sesi user
      description: |
        Endpoint publik (tanpa autentikasi) — titik masuk satu-satunya untuk
        mendapatkan JWT. Proteksi brute-force: akun dikunci 15 menit setelah 5
        kali percobaan password salah berturut-turut; pesan error kunci akun
        SENGAJA disamarkan sama persis dengan "username/password salah" (tidak
        membocorkan apakah akun terkunci atau memang salah password). Login ke
        akun milik tenant yang sudah dinonaktifkan ditolak dengan pesan
        terpisah (tenant tidak aktif) — SETELAH kredensial terbukti benar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: username/password kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Kredensial salah, akun terkunci (brute-force), akun nonaktif, atau tenant pemilik akun nonaktif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/tokens:
    post:
      operationId: issueAPIToken
      tags: [Auth]
      summary: Menerbitkan API token jangka panjang (`acs_...`)
      description: |
        ADMIN/SUPERADMIN. Non-superadmin hanya boleh menerbitkan token untuk
        tenant miliknya sendiri (`tenant_id` di body diabaikan/ditolak bila
        beda dari tenant actor). Nilai token PLAINTEXT hanya ditampilkan SEKALI
        di response ini — hanya hash-nya yang disimpan, tidak bisa diambil ulang.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAPITokenRequest'
      responses:
        '201':
          description: Token diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAPITokenResponse'
        '400':
          description: Payload tidak valid atau `name` kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau non-superadmin mencoba menerbitkan token untuk tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      operationId: listAPITokens
      tags: [Auth]
      summary: Daftar API token yang pernah diterbitkan (untuk dikelola/dicabut)
      description: |
        ADMIN/SUPERADMIN — gating role SAMA seperti penerbitan token
        (`POST /auth/tokens`), bukan self-service ke semua role. Non-superadmin
        SELALU dipaksa ke tenant miliknya sendiri (parameter `tenant_id` diabaikan
        bila diisi tenant lain) dan melihat SELURUH token milik tenant tsb —
        bukan cuma token yang diterbitkan actor sendiri — supaya ADMIN bisa
        mencabut token yang diterbitkan ADMIN lain di tenant yang sama (mis.
        karyawan penerbit token sudah resign). Nilai `token` plaintext TIDAK
        pernah muncul di sini (hanya saat `POST /auth/tokens` pertama kali).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar API token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/tokens/{id}:
    delete:
      operationId: revokeAPIToken
      tags: [Auth]
      summary: Mencabut (revoke) satu API token
      description: |
        ADMIN/SUPERADMIN. Non-superadmin hanya boleh mencabut token milik
        tenant-nya sendiri — mencoba mencabut token tenant lain ditolak `403`,
        TIDAK PERNAH diam-diam berhasil. **Catatan jujur soal enumerasi**: `id`
        tidak ada sama sekali → `404`, `id` ada tapi milik tenant lain → `403`
        — kedua kode ini berbeda, sehingga non-superadmin YANG MENEBAK id
        secara berurutan bisa membedakan "id belum pernah dipakai" dari "id
        ini token milik tenant lain yang (pernah) ada". Diterima apa adanya
        (severity rendah — `id` adalah PK internal BIGINT sekuensial pada
        endpoint admin-only, bukan identifier publik, dan pola 404-vs-403 yang
        sama juga berlaku di endpoint lain di API ini), bukan dianggap
        kebocoran isi/kepemilikan token. Mencabut token yang sudah revoked
        sebelumnya tetap `204` (idempotent), bukan error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Token berhasil dicabut (atau memang sudah revoked sebelumnya).
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role tidak cukup, atau non-superadmin mencoba mencabut token tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Token tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/password:
    patch:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Ganti password akun sendiri
      description: |
        Semua role yang sudah login boleh memanggil ini (tidak ada gating role)
        — actor diambil dari JWT/API token, BUKAN dari `:id` path (beda dari
        `PATCH /users/:id/password` yang itu admin mereset password user
        LAIN). Wajib menyertakan `current_password` yang benar; tanpa verifikasi
        ini siapa pun yang membajak bearer token bisa mengunci pemilik akun asli
        secara permanen.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequest'
      responses:
        '204':
          description: Password berhasil diganti.
        '400':
          description: Payload tidak valid, field kosong, atau `new_password` kurang dari 8 karakter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi, atau `current_password` salah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== REFS ==============================
  /refs/{table}:
    get:
      operationId: listRefs
      tags: [Refs]
      summary: Daftar baris tabel referensi/enum (`ref_*`)
      description: |
        Nama tabel divalidasi lewat whitelist tetap di server (`ref_vendors`,
        `ref_device_types`, `ref_data_model_versions`, `ref_event_codes`,
        `ref_task_types`, `ref_task_status`, `ref_device_status`,
        `ref_parameter_types`, `ref_roles`) — nama di luar whitelist ini
        mengembalikan error (saat ini `500`, bukan `400`; lihat catatan
        inkonsistensi di README/laporan audit). Semua role terautentikasi boleh
        membaca (data referensi bukan data sensitif per-tenant).
      parameters:
        - name: table
          in: path
          required: true
          description: Nama tabel referensi, lihat whitelist di atas.
          schema:
            type: string
            example: ref_device_status
      responses:
        '200':
          description: Daftar baris referensi.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RefLookup' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Nama tabel tidak dikenal/di luar whitelist (lihat catatan — idealnya `400`, tercatat sebagai inkonsistensi kecil, bukan bug keamanan).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== TENANTS ==============================
  /tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Membuat tenant baru
      description: Superadmin only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: Tenant dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: Payload tidak valid, `code`/`name` kosong, atau `cwmp_inform_password` kurang dari 16 karakter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`code` tenant sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: Daftar seluruh tenant
      description: Superadmin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [Tenants]
      summary: Info branding tenant milik actor sendiri
      description: |
        Semua role terautentikasi boleh memanggil (bukan cuma superadmin) —
        dipakai frontend untuk resolve branding (nama, logo, warna aksen) tanpa
        membocorkan field sensitif (`cwmp_inform_username`, kolom audit
        internal). Actor tanpa `tenant_id` (superadmin lintas-tenant)
        mengembalikan `204 No Content`, BUKAN error — frontend disarankan
        fallback ke branding default.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Branding tenant milik actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentTenant' }
        '204':
          description: Actor tidak terikat ke tenant mana pun (mis. superadmin global) — tidak ada body.
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}:
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update tenant (kode/nama/aktivasi)
      description: |
        Superadmin only. `is_active=false` langsung menolak login/akses SEMUA
        user milik tenant ini pada request berikutnya — termasuk bearer token
        yang sudah diterbitkan sebelumnya (dicek ulang tiap request, bukan
        menunggu token kedaluwarsa). Partial update: field yang tidak dikirim
        (`null`/tidak ada di body) tidak diubah.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantRequest' }
      responses:
        '200':
          description: Tenant setelah diupdate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: "`id` path tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}/cwmp-credentials:
    patch:
      operationId: setTenantCWMPCredentials
      tags: [Tenants]
      summary: Set/rotate shared secret Inform CWMP tenant
      description: |
        Superadmin only — kredensial ini divalidasi ACS terhadap Inform dari
        device yang belum tercatat milik tenant ini. Password TIDAK PERNAH
        dikembalikan lagi lewat API manapun setelah di-set (hanya bentuk
        terenkripsi yang tersimpan di DB).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTenantCWMPCredentialsRequest' }
      responses:
        '204':
          description: Kredensial berhasil di-set.
        '400':
          description: "`id` tidak valid, payload tidak valid, `username`/`password` kosong, atau password kurang dari 16 karakter."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}/branding:
    patch:
      operationId: updateTenantBranding
      tags: [Tenants]
      summary: Update branding tenant (nama brand, logo, warna aksen)
      description: |
        SUPERADMIN untuk tenant manapun; ADMIN hanya untuk tenant miliknya
        sendiri (self-service). Ini FULL REPLACE (bukan partial) — field yang
        dikirim `null` eksplisit akan MENGOSONGKAN kolom terkait, beda semantik
        dari `PATCH /tenants/:id` maupun `PATCH /users/:id` yang `null` berarti
        "tidak diubah".
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantBrandingRequest' }
      responses:
        '204':
          description: Branding berhasil diupdate.
        '400':
          description: "`id` tidak valid, atau validasi gagal (`brand_name` >128 karakter, `logo_url` bukan http/https valid atau >512 karakter, `primary_color` bukan format hex `#rrggbb`)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau ADMIN mencoba mengubah tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tenants/{id}/task-quota:
    patch:
      operationId: setTenantTaskQuota
      tags: [Tenants]
      summary: Set kuota task queue (`max_pending_tasks`) tenant
      description: |
        Superadmin only — kebijakan platform-level, BUKAN self-service tenant
        (ADMIN tenant sendiri tidak bisa menaikkan kuotanya sendiri lewat
        endpoint ini). `max_pending_tasks: null` berarti tidak dibatasi.
        Kuota ini HANYA membatasi jumlah task berstatus PENDING/QUEUED milik
        tenant, bukan rate limit koneksi/sesi CWMP itu sendiri.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTenantTaskQuotaRequest' }
      responses:
        '204':
          description: Kuota berhasil diupdate.
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== USERS ==============================
  /users:
    post:
      operationId: createUser
      tags: [Users]
      summary: Membuat user baru
      description: |
        ADMIN/SUPERADMIN. Superadmin bisa membuat user di tenant manapun (atau
        tanpa tenant untuk sesama superadmin); ADMIN non-superadmin hanya bisa
        membuat user di tenant miliknya sendiri, dan TIDAK BOLEH memberikan
        role `SUPERADMIN` ke siapa pun (termasuk lewat variasi casing seperti
        `"superadmin"` — dicek case-insensitive).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Payload tidak valid, atau `username`/`password` kosong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba membuat user di tenant lain, atau ADMIN mencoba memberi role SUPERADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`username`/`email` sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listUsers
      tags: [Users]
      summary: Daftar user
      description: |
        ADMIN/SUPERADMIN. Non-superadmin selalu dibatasi ke tenant miliknya
        sendiri — parameter query `tenant_id` diabaikan untuk role ini.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update data user (nama, email, aktif/nonaktif)
      description: |
        ADMIN/SUPERADMIN. Superadmin bebas ke user manapun; ADMIN dibatasi ke
        user satu tenant dengannya. Guard self-lockout: actor tidak bisa
        menonaktifkan (`is_active=false`) akunnya sendiri lewat endpoint ini.
        Partial update — field yang tidak dikirim tidak diubah.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User setelah diupdate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba mengubah user tenant lain, atau mencoba menonaktifkan akun sendiri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Soft-delete user
      description: |
        ADMIN/SUPERADMIN, scope sama seperti `PATCH /users/:id`. Guard
        self-lockout: actor tidak bisa menghapus akunnya sendiri.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '204':
          description: User berhasil di-soft-delete.
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba menghapus user tenant lain, atau mencoba menghapus akun sendiri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}/password:
    patch:
      operationId: resetUserPassword
      tags: [Users]
      summary: Admin mereset password user lain
      description: |
        ADMIN/SUPERADMIN, scope sama seperti `PATCH /users/:id`. BEDA dari
        `PATCH /auth/password` (ganti password sendiri dgn verifikasi password
        lama) — di sini TIDAK PERLU tahu password lama user target. Password
        baru tidak pernah dicatat ke activity log. Sekalian mereset lockout
        brute-force (failed attempts + locked_until) milik user target.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetUserPasswordRequest' }
      responses:
        '204':
          description: Password berhasil direset.
        '400':
          description: "`id` tidak valid, payload tidak valid, `new_password` kosong atau kurang dari 8 karakter."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, atau ADMIN mencoba mereset password user tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}/roles:
    patch:
      operationId: replaceUserRoles
      tags: [Users]
      summary: Ganti seluruh role user (full replace)
      description: |
        ADMIN/SUPERADMIN, scope sama seperti `PATCH /users/:id`. FULL REPLACE —
        role yang tidak disebut di `role_codes` akan DICABUT. Dua guard
        privilege-escalation/self-lockout: (1) ADMIN non-superadmin tidak boleh
        memberikan role `SUPERADMIN` ke siapa pun; (2) actor (ADMIN) tidak boleh
        mencabut role `ADMIN` dari akunnya sendiri.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceUserRolesRequest' }
      responses:
        '200':
          description: User dengan daftar role terbaru.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "`id` tidak valid, payload tidak valid, atau ada `role_code` yang tidak dikenal."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba mengubah user tenant lain, ADMIN mencoba memberi role SUPERADMIN, atau mencoba mencabut role ADMIN dari diri sendiri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

