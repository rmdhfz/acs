  # ============================== TASKS ==============================
  /virtual-parameters:
    get:
      operationId: listVirtualParameters
      tags: [VirtualParameters]
      summary: Daftar definisi virtual parameter (tenant sendiri + global)
      description: "Semua peran staf. Non-SUPERADMIN hanya melihat definisi tenant sendiri dan definisi global; `tenant_id` pada query hanya efektif untuk SUPERADMIN."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar definisi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualParameterListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akun non-SUPERADMIN tanpa tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      operationId: createVirtualParameter
      tags: [VirtualParameters]
      summary: Buat virtual parameter (nilai turunan dari parameter perangkat)
      description: |
        ADMIN/SUPERADMIN. ADMIN selalu membuat untuk tenant sendiri; SUPERADMIN tanpa `tenant_id` membuat definisi **global**
        (berlaku untuk semua tenant; definisi tenant bernama sama menimpanya). Ekspresi divalidasi saat disimpan
        (sintaks, fungsi, batas biaya) dan **tidak boleh merujuk parameter rahasia** (password/passphrase/PSK) karena nilainya
        tampil untuk semua peran. Maksimal 50 definisi per tenant. Nilai dihitung saat dibaca, tidak disimpan.

        Bahasa ekspresi (`pkg/vexpr`): `{Nama.Parameter}` merujuk nilai parameter; angka, teks `'...'`; operator
        `+ - * / %`, `== != < <= > >=`, `and or not`; fungsi `first coalesce if round floor ceil abs min max num str concat upper
        lower trim len contains startswith endswith replace substr duration isnull`. Tanpa loop/variabel. Contoh:
        `round({InternetGatewayDevice.X_ZTE.OpticalRx} / 1000, 1)`, `first({InternetGatewayDevice.DeviceInfo.UpTime}, {Device.DeviceInfo.UpTime})`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VirtualParameterRequest' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualParameter' }
        '400':
          description: Nama/label/ekspresi tidak valid (sintaks, fungsi tak dikenal, rujukan parameter rahasia, batas jumlah).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan ADMIN/SUPERADMIN, atau akun tanpa tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Nama sudah dipakai pada scope (tenant/global) yang sama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /virtual-parameters/test:
    post:
      operationId: testVirtualParameter
      tags: [VirtualParameters]
      summary: Coba ekspresi pada satu perangkat tanpa menyimpan
      description: "ADMIN/SUPERADMIN. Kesalahan ekspresi dikembalikan sebagai hasil (`ok: false` + posisi), bukan error HTTP, agar editor menampilkannya di tempat. Perangkat harus milik tenant pemanggil."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
