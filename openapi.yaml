            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User setelah diupdate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "`id` tidak valid atau payload tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, ADMIN mencoba mengubah user tenant lain, atau mencoba menonaktifkan akun sendiri.
