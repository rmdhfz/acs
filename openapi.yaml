  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: Daftar task (antrean RPC CWMP)
      description: |
        Semua role terautentikasi. Non-superadmin otomatis difilter ke tenant
        miliknya (lewat JOIN ke device pemilik task — task tidak punya
        `tenant_id` langsung). Untuk role `NOC`/`VIEWER`, field `url`/
        `username`/`password` di dalam `parameters` task tipe Download/Upload
        (mis. presigned URL firmware) DIREDAKSI menjadi `"[redacted]"` —
        hanya `ADMIN`/`SUPERADMIN` melihat isi aslinya.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: device_id
          in: query
          schema: { type: integer, format: int64 }
        - name: task_status_id
          in: query
          schema: { type: integer, format: int64 }
        - name: task_type
          in: query
          description: Kode `ref_task_types`, mis. `REBOOT`, `DOWNLOAD`.
          schema: { type: string }
        - $ref: '#/components/parameters/tenantIdQuery'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Daftar task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Membuat task RPC CWMP baru untuk sebuah device
      description: |
        ADMIN/NOC/SUPERADMIN. Non-superadmin hanya bisa membuat task untuk
        device milik tenant-nya sendiri. **NOC hanya boleh** tipe
        `GET_PARAMETER_VALUES`, `GET_PARAMETER_NAMES`, `REBOOT`, `SCHEDULE_INFORM`
        (tipe lain `403`; ADMIN/SUPERADMIN bebas). `parameters` divalidasi sesuai
        tipe (`400`): mis. `GET_PARAMETER_VALUES` butuh `names` (array string),
        `SET_PARAMETER_VALUES` butuh `values` (objek nama→string) dan opsional
        `types` (nama→tipe XSD: string/int/unsignedInt/boolean/dateTime/base64;
        bila tak diberikan dipakai tipe yang pernah dilaporkan CPE, default
        `xsd:string`), `DOWNLOAD` butuh `url` http(s). `storage_key` tidak boleh
        diisi lewat API. Tipe `SET_PARAMETER_ATTRIBUTES`/`GET_PARAMETER_ATTRIBUTES`
        belum didukung (`400`). `priority` 1–9 (default 5 bila 0; 1 = tertinggi),
        `max_retries` 0–10 (default 3 bila 0). Retry memakai backoff 1m, 2m, 4m…
        maks 30m. Ditolak
        `429` bila tenant pemilik device sudah mencapai `max_pending_tasks`
        (kuota task queue tenant, lihat `PATCH /tenants/:id/task-quota`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "Payload tidak valid, `device_id`/`task_type` kosong, atau `task_type` tidak dikenal di `ref_task_types`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah NOC, atau device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

