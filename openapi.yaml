  /devices/insights:
    get:
      operationId: deviceInsights
      tags: [Devices]
      summary: Distribusi armada untuk dashboard (mode PON, uptime, redaman RX, suhu ONU, lama offline)
      description: |
        Semua role terautentikasi, tenant-scoped sama seperti `GET /devices` (SUPERADMIN: seluruh platform). Redaman RX, suhu,
        uptime, dan mode PON dihitung dari perangkat **ONLINE** (perangkat offline membawa nilai basi); lama offline dari perangkat
        **OFFLINE** menurut Inform terakhir. Keranjang selalu lengkap dan berurutan tetap (yang kosong bernilai 0).

        Ambang: RX `ok` -25..-8 dBm, `warn` -27..-25, `bad` < -27, `overload` > -8; suhu `warning` ≥ 60 °C, `high` ≥ 70, `critical` ≥ 80.
        Satuan RX mentah ditebak (dBm / 0,01 / 0,001); yang tak masuk akal secara fisik = `unknown`. Mode PON terdeteksi dari nama
        parameter yang dilaporkan perangkat (`*Gpon*` / `*Epon*`), bukan dari konfigurasi; `unknown` bila tak terdeteksi. Suhu
        `unknown` sampai mapping `optical.temperature` model tersebut ada (asisten sumber optik di tab Redaman Optik).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wawasan armada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetInsights' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Actor non-superadmin tanpa `tenant_id`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}:
    delete:
      operationId: deleteDevice
      tags: [Devices]
      summary: Hapus (soft-delete) device
      description: |
        ADMIN/SUPERADMIN, dibatasi ke device milik tenant sendiri untuk non-superadmin. Task yang belum terminal (PENDING/QUEUED/SENT) dibatalkan lebih dulu (jumlahnya dicatat di audit trail). CPE yang masih menyala dan mengirim Inform lagi TIDAK ditolak: baris device dihidupkan kembali sebagai registrasi baru (id, uuid, dan riwayat dipertahankan; kredensial per-device, profil provisioning, dan catatan direset; task lama tidak dieksekusi).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '204':
          description: Berhasil dihapus (soft delete).
        '400':
          description: "`id` path tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "Tidak terautentikasi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "Role di bawah ADMIN, atau device milik tenant lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Device tidak ditemukan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: getDevice
      tags: [Devices]
      summary: Detail satu device
      description: Semua role terautentikasi, dibatasi ke device milik tenant sendiri untuk non-superadmin.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      responses:
        '200':
          description: Detail device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400':
          description: "`id` tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Device milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
