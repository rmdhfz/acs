  /vendor-parameter-mappings:
    get:
      operationId: listParameterMappings
      tags: [Catalog]
      summary: Daftar mapping logical key -> path TR-069 milik satu vendor
      description: Semua role terautentikasi. Data referensi global lintas tenant (mutasi tetap superadmin only). `vendor_id` WAJIB diisi.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Daftar mapping (array polos, TIDAK dibungkus `data`/`total`).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/VendorParameterMapping' }
        '400':
          description: "`vendor_id` tidak diisi."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: upsertParameterMapping
      tags: [Catalog]
      summary: Upsert mapping logical key -> path TR-069 mentah
      description: |
        Superadmin only. Memetakan `logical_key` (mis. `wifi.5g.ssid`) ke path
        TR-069 aktual per vendor + data model version, opsional override per
        device model spesifik. Ini mekanisme WAJIB untuk perbedaan path
        parameter antar vendor — jangan hardcode percabangan vendor di kode Go.
        Upsert: mengirim `vendor_id`+`data_model_version_id`+`device_model_id`+
        `logical_key` yang sama akan mengganti mapping yang sudah ada
        (bukan menambah duplikat). Respons selalu memuat `id` mapping yang benar
        (baik baru maupun yang diganti), dipakai untuk
        `GET|DELETE /vendor-parameter-mappings/{id}`. Mapping yang pernah dihapus
        dihidupkan kembali.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertVendorParameterMappingRequest' }
      responses:
        '200':
          description: Mapping berhasil di-upsert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorParameterMapping' }
        '400':
          description: "Payload tidak valid, `vendor_id`/`logical_key`/`tr069_path` kosong."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Vendor atau `device_model_id` tidak ditemukan / vendor sudah dihapus."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Bukan superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

