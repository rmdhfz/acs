        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_name]
              properties:
                object_name:
                  type: string
                  example: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection.1."
      responses:
        '202':
          description: Task DeleteObject telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akses ditolak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/get-parameter-names:
    post:
      operationId: getParameterNamesDevice
      tags: [Devices]
      summary: Eksekusi RPC GetParameterNames (FR-5)
      description: |
        ADMIN/NOC/SUPERADMIN. Menelusuri (explore) parameter tree pada CPE (digunakan untuk Parameter Browser dinamis).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, next_level]
              properties:
                path:
                  type: string
                  example: "InternetGatewayDevice.WANDevice."
                next_level:
                  type: boolean
                  example: true
      responses:
        '202':
          description: Task GetParameterNames telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akses ditolak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/get-parameter-values:
    post:
      operationId: getParameterValuesDevice
      tags: [Devices]
      summary: Eksekusi RPC GetParameterValues secara dinamis (FR-5)
      description: |
        ADMIN/NOC/SUPERADMIN. Membaca satu atau lebih nilai parameter raw secara spesifik.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items:
                    type: string
                  example: ["InternetGatewayDevice.DeviceInfo.HardwareVersion"]
      responses:
        '202':
          description: Task GetParameterValues telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akses ditolak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /devices/{id}/tasks/set-parameter-values:
    post:
      operationId: setParameterValuesDevice
      tags: [Devices]
      summary: Eksekusi RPC SetParameterValues secara dinamis (FR-5)
      description: |
        ADMIN/SUPERADMIN. Menulis (set) satu atau lebih parameter raw secara langsung tanpa melalui Provisioning Profile.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    "InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.SSID": "WIFI_BARU"
      responses:
        '202':
          description: Task SetParameterValues telah dimasukkan ke dalam antrean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Payload tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Akses ditolak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /devices/{id}/apply-profile/{profileId}:
    post:
      operationId: applyProfile
      tags: [Provisioning]
      summary: Menerapkan provisioning profile ke device (eksplisit)
      description: |
        ADMIN/SUPERADMIN. Mengantre SATU task `SET_PARAMETER_VALUES` berisi
        seluruh parameter profile, lalu mengeset `provisioning_profile_id`
        device ke profile ini. SELALU dipanggil eksplisit (manual, atau
        otomatis dari evaluasi Zero-Touch Provisioning saat BOOTSTRAP) — lihat
        catatan FR-18 di `PUT /provisioning-profiles/:id`. Ditolak `429` bila
        kuota task queue tenant sudah tercapai.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - name: profileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '201':
          description: Task SET_PARAMETER_VALUES yang diantre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: "`id` device/`profileId` tidak valid, atau profile tidak punya parameter untuk diterapkan."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Role di bawah ADMIN, device/profile milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Device atau profile tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Kuota task queue tenant sudah tercapai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================== ZERO-TOUCH ==============================
  /zero-touch-rules:
