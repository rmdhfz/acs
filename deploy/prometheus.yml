# Konfigurasi scrape Prometheus utk ACS (ROADMAP.md Fase 2, TECH.md §10).
# Dipakai oleh service `prometheus` di docker-compose.yml — dimount ke
# /etc/prometheus/prometheus.yml di dalam container.
#
# CATATAN BATASAN (jujur, bukan disembunyikan): rules file di bawah HANYA
# membuat alert muncul di tab "Alerts" Prometheus UI. TIDAK ADA Alertmanager
# di stack ini, jadi TIDAK ADA notifikasi keluar (Slack/email/dst) saat alert
# firing — itu di luar cakupan sesi ini.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

scrape_configs:
  - job_name: acsd
    metrics_path: /api/v1/metrics
    static_configs:
      # "acsd" = nama service di docker-compose.yml (network internal
      # compose), port 8080 = ACS_HTTP_ADDR container (bukan port host
      # 18080 yang dipetakan utk akses dari luar compose network).
      - targets: ["acsd:8080"]
