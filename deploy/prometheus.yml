# Konfigurasi scrape Prometheus utk ACS (ROADMAP.md Fase 2, TECH.md §10).
# Dipakai oleh service `prometheus` di docker-compose.yml — dimount ke
# /etc/prometheus/prometheus.yml di dalam container.
#
# Alur alert: Prometheus mengevaluasi aturan di prometheus_alerts.yml -> mengirim ke Alertmanager (blok `alerting` di bawah) ->
# Alertmanager meneruskan ke acsd lewat webhook (deploy/alertmanager/config.yml) -> notifikasi PLATFORM_ALERT untuk SUPERADMIN.
# Sebelumnya blok `alerting` tidak ada, sehingga alert hanya terlihat di tab "Alerts" Prometheus dan tidak pernah sampai ke
# Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        # "alertmanager" = nama service di docker-compose.yml (jaringan internal compose), port 9093 = port di dalam container.
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: acsd
    metrics_path: /api/v1/metrics
    static_configs:
      # "acsd" = nama service di docker-compose.yml (network internal
      # compose), port 8080 = ACS_HTTP_ADDR container (bukan port host
      # 18080 yang dipetakan utk akses dari luar compose network).
      - targets: ["acsd:8080"]
