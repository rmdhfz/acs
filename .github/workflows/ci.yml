name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Batalkan run lama pada ref yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Baca versi dari go.mod (go 1.26.x) supaya CI & lokal tidak drift.
          go-version-file: go.mod
          cache: true

      - name: gofmt (harus bersih)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File belum ter-gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race untuk menangkap data race di jalur sesi CWMP / task queue
        # (app server didesain multi-instance/stateless, TECH.md §9).
        run: go test -race ./...

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@2 lint openapi.yaml
